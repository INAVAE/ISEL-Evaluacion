}

/* ---- pestaña: validación ---- */
function tabCheck(ins){
  const v = validate(ins);
  const M={err:['✕','v-err'],warn:['△','v-warn']};
  return `<div class="tabpanel">
    <p class="mini" style="margin-bottom:14px">Los errores impiden publicar la versión. Los avisos no bloquean, pero señalan reactivos que probablemente no discriminen entre candidatos.</p>
    ${v.length? `<ul class="vlist">${v.map(x=>`<li><span class="vm ${M[x.lvl][1]}">${M[x.lvl][0]}</span>
      <span><b>${esc(x.t)}</b>${x.d?`<br><span class="tiny">${esc(x.d)}</span>`:''}</span></li>`).join('')}</ul>`
    : `<div class="empty"><b>Sin observaciones</b>La estructura del instrumento es consistente y puede publicarse.</div>`}
    <div style="margin-top:22px" class="grid g4">
      ${[['Dimensiones',ins.dims.length],['Reactivos activos',countActive(ins)],
         ['Requisitos básicos',(ins.basic||[]).length],['Competencias ideales',(ins.ideal||[]).length]]
        .map(([k,n])=>`<div class="cell" style="border:1px solid var(--steel-200)"><div class="k">${k}</div><div class="v">${n}</div></div>`).join('')}
    </div>
    <div style="margin-top:18px"><div class="sect-h" style="margin-bottom:8px"><h2 style="font-size:20px">Reparto de reactivos por dimensión</h2></div>
      ${bars(Object.fromEntries(ins.dims.map(d=>{
        const n = ins.items.filter(i=>i.dim===d.id && i.active!==false).length;
        const mx = Math.max(1,...ins.dims.map(x=>ins.items.filter(i=>i.dim===x.id && i.active!==false).length));
        return [d.id, R(n/mx*100)];
      })), ins.dims)}
      <p class="tiny">Escala relativa a la dimensión con más reactivos, para detectar dimensiones con peso alto y poca evidencia.</p>
    </div></div>`;
}

function viewEditor(){
  const ins = S.draft;
  if(!ins) return viewVersions();
  const T = {items:tabItems, dims:tabDims, reqs:tabReqs, plan:tabPlan, meta:tabMeta, check:tabCheck};
  return topbar()+`<div class="shell" style="padding-top:22px;padding-bottom:40px">
    ${edHead(ins)}${(T[S.tab]||tabItems)(ins)}${saveBar(ins)}</div>`;
}

/* ---- formulario de un reactivo ---- */
function viewItemEdit(){
  const q = S.itemDraft, ins = S.draft;
  if(!q) return viewEditor();
  const opt = (o,i) => {
    let right = '';
    if(q.type==='scenario'||q.type==='technical')
      right = `<div><label class="fl">Puntaje 0–100</label><input class="fi" type="number" min="0" max="100" data-opt="${i}.s" value="${o.s??0}">
        <label class="sw ${o.flag?'on':''}" style="margin-top:7px" data-optflag="${i}"><i></i>Bandera crítica</label></div>`;
    else if(q.type==='multi')
      right = `<div><label class="fl">Puntos (+/−)</label><input class="fi" type="number" step="1" data-opt="${i}.p" value="${o.p??0}"></div>`;
    else if(q.type==='ranking')
      right = `<div><label class="fl">Posición ideal</label><input class="fi" type="number" min="1" max="${q.opts.length}" data-opt="${i}.r" value="${o.r??i+1}"></div>`;
    return `<div class="optrow"><div class="ok">${'ABCDEFGHI'[i]||i+1}</div>
      <div><label class="fl">Texto de la opción</label><textarea class="fi" rows="2" data-opt="${i}.t">${esc(o.t||'')}</textarea></div>
      ${right}<button class="rowdel" data-delopt="${i}" style="margin-top:22px">×</button></div>`;
  };
  const optArea = q.type==='likert'
    ? `<div class="formgrid"><div><label class="fl">Etiqueta del 1</label><input class="fi" data-lab="0" value="${esc(q.labs?q.labs[0]:'')}"></div>
       <div><label class="fl">Etiqueta del 5</label><input class="fi" data-lab="1" value="${esc(q.labs?q.labs[1]:'')}"></div></div>
       <p class="mini">La escala se convierte linealmente a 0–100. Conviene mantener el peso bajo (0.5) por el sesgo de deseabilidad social.</p>`
    : `${(q.opts||[]).map(opt).join('')}
       <div class="navrow" style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-addopt>Agregar opción</button>
       ${q.type==='multi'?`<span style="display:flex;align-items:center;gap:8px"><label class="fl" style="margin:0">Máximo de selecciones</label>
         <input class="fi" style="width:80px" type="number" min="1" data-max value="${q.max||3}"></span>`:''}
       ${q.type==='ranking'?`<span class="tiny">Las posiciones ideales deben ser 1 a ${q.opts.length} sin repetir.</span>`:''}</div>`;
  const hint = {
    scenario:'Las opciones incorrectas no deben ser absurdas: todas deben parecer razonables. Lo que separa a un vendedor consultivo de uno transaccional es cuál elige primero, no cuál es obviamente falsa.',
    technical:'Nivel básico e intermedio. Vale premiar la respuesta prudente (“validaría estos datos antes de recomendar”) por encima de una respuesta rápida pero temeraria.',
    multi:'Incluye opciones con puntos negativos para castigar los reflejos transaccionales (preguntar la marca preferida, correr a cerrar el mes).',
    ranking:'Define el orden ideal completo. El puntaje baja según el desplazamiento respecto de ese orden.',
    likert:'Autoevaluación: úsala junto con un par de consistencia en la pestaña de datos de la versión.'
  }[q.type];
  return topbar()+`<div class="shell" style="padding-top:22px;padding-bottom:50px">
    <div class="sect-h"><h2>${S.itemNew?'Nuevo reactivo':'Editar reactivo '+esc(q.id)}</h2>
      <span class="sub">${esc(ins.name)} · ${esc(ins.version)}</span></div>
    ${S.msg?`<div class="alert" style="margin-bottom:16px"><h3>${esc(S.msg)}</h3></div>`:''}
    <div class="panel"><div class="panel-b">
      <div class="formgrid">
        <div><label class="fl">Identificador</label><input class="fi" data-it="id" value="${esc(q.id)}"></div>
        <div><label class="fl">Dimensión</label><select class="fi" data-it="dim">
          ${ins.dims.map(d=>`<option value="${d.id}" ${q.dim===d.id?'selected':''}>${esc(d.short)}</option>`).join('')}</select></div>
        <div><label class="fl">Tipo de reactivo</label><select class="fi" data-ittype>
          ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${q.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div><label class="fl">Dificultad</label><select class="fi" data-it="level">
          ${LEVELS_Q.map(l=>`<option ${q.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="full"><label class="fl">Competencia evaluada</label><input class="fi" data-it="comp" value="${esc(q.comp||'')}"></div>
        <div><label class="fl">Peso dentro de la dimensión</label><input class="fi" type="number" step="0.1" min="0.1" data-it="w" value="${q.w||1}"></div>
        <div style="display:flex;align-items:flex-end;gap:18px">
          <label class="sw ${q.crit?'on':''}" data-itcrit><i></i>Competencia crítica</label>
          <label class="sw ${q.active!==false?'on':''}" data-itactive><i></i>${q.active!==false?'Activo':'Inactivo'}</label></div>
      </div>
      <div style="margin-top:18px"><label class="fl">Situación o caso (opcional)</label>
        <textarea class="fi" rows="3" data-it="case">${esc(q.case||'')}</textarea></div>
      <div style="margin-top:14px"><label class="fl">Pregunta</label>
        <textarea class="fi" rows="2" data-it="q">${esc(q.q||'')}</textarea></div>
    </div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Opciones y puntuación</h3>
      <span class="sub">${TYPES[q.type]}</span></div>
      <div class="panel-b"><p class="mini" style="margin-bottom:14px">${hint}</p>${optArea}</div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Justificación del criterio</h3></div>
      <div class="panel-b"><p class="mini" style="margin-bottom:8px">Solo la ve el administrador. Explica por qué cada opción recibe su puntaje; es lo que permite defender una decisión de contratación meses después.</p>
      <textarea class="fi" rows="4" data-it="just">${esc(q.just||'')}</textarea></div></div>
    <div class="savebar" style="margin-top:16px">
      <span class="tiny">Los cambios se aplican al borrador; recuerda guardarlo.</span><span class="sp"></span>
      <button class="btn btn-ghost btn-sm" data-cancelitem>Cancelar</button>
      <button class="btn btn-sm" data-saveitem>Aplicar al borrador</button></div>
  </div>`;
}


/* ============================================================
   MÓDULO 8 — CONEXIÓN, ACCESO E INVITACIONES
   ============================================================ */
const SQL_SCHEMA = "-- ============================================================\n-- ISEL \u00b7 Evaluaci\u00f3n de competencias comerciales\n-- Esquema para Supabase / PostgreSQL\n-- Ejecutar completo en el SQL Editor del proyecto.\n-- ============================================================\n\n-- En Supabase pgcrypto ya viene instalado en el esquema \"extensions\", no en\n-- \"public\". Por eso todas las funciones llevan extensions en su search_path:\n-- sin eso, gen_random_bytes() no se encuentra y la funci\u00f3n falla.\ncreate extension if not exists pgcrypto;\n\n-- ------------------------------------------------------------\n-- 1. INSTRUMENTOS (versiones de la evaluaci\u00f3n)\n-- La definici\u00f3n completa vive en jsonb: dimensiones, reactivos,\n-- requisitos, plan y pares de consistencia. Se versiona entera\n-- para que un candidato evaluado con 1.0 conserve su contexto\n-- aunque 1.1 cambie los pesos.\n-- ------------------------------------------------------------\ncreate table if not exists isel_instruments (\n  id          text primary key,\n  name        text not null,\n  area        text,\n  version     text not null,\n  status      text not null default 'borrador'\n              check (status in ('borrador','publicada','archivada')),\n  notes       text,\n  definition  jsonb not null,\n  created_at  timestamptz not null default now(),\n  updated_at  timestamptz not null default now()\n);\ncreate index if not exists isel_instruments_status_idx on isel_instruments(status);\n\n-- ------------------------------------------------------------\n-- 2. CANDIDATOS\n-- profile guarda escolaridad, experiencia, disponibilidad, etc.\n-- La edad se captura pero nunca entra al c\u00e1lculo.\n-- ------------------------------------------------------------\ncreate table if not exists isel_candidates (\n  id          text primary key,\n  full_name   text not null,\n  email       text,\n  profile     jsonb not null default '{}'::jsonb,\n  created_at  timestamptz not null default now()\n);\ncreate index if not exists isel_candidates_name_idx on isel_candidates(lower(full_name));\n\n-- ------------------------------------------------------------\n-- 3. EVALUACIONES APLICADAS\n-- Una fila por aplicaci\u00f3n. invite_token permite que el candidato\n-- conteste desde su celular sin ver el panel; se anula al enviar.\n-- ------------------------------------------------------------\ncreate table if not exists isel_assessments (\n  id             text primary key,\n  candidate_id   text references isel_candidates(id) on delete cascade,\n  instrument_id  text references isel_instruments(id),\n  version        text,\n  invite_token   text unique,\n  status         text not null default 'pendiente'\n                 check (status in ('pendiente','en_progreso','completada','cancelada')),\n  consent        jsonb,\n  answers        jsonb,\n  dims_def       jsonb,\n  result         jsonb,\n  index_score    int,\n  decision       text,\n  profile_code   text,\n  risk           text,\n  consistency    int,\n  invited_at     timestamptz not null default now(),\n  started_at     timestamptz,\n  submitted_at   timestamptz\n);\n-- Se agrega aparte porque create table if not exists no modifica una tabla\n-- que ya existe. Es seguro volver a ejecutarlo.\nalter table isel_assessments add column if not exists consent jsonb;\n\n-- Procedencia del puntaje: el servidor recalcula y aqu\u00ed queda constancia\n-- de lo que report\u00f3 el navegador, para poder detectar manipulaci\u00f3n.\nalter table isel_assessments add column if not exists scored_by text;\nalter table isel_assessments add column if not exists client_index int;\nalter table isel_assessments add column if not exists score_mismatch boolean;\n\ncreate index if not exists isel_assessments_status_idx on isel_assessments(status);\ncreate index if not exists isel_assessments_cand_idx   on isel_assessments(candidate_id);\ncreate index if not exists isel_assessments_date_idx   on isel_assessments(submitted_at desc);\n\n-- ------------------------------------------------------------\n-- 4. RESPUESTAS INDIVIDUALES\n-- Normalizadas para poder hacer an\u00e1lisis de reactivos: qu\u00e9 tanto\n-- discrimina cada pregunta entre candidatos buenos y malos.\n-- Guardar la respuesta cruda permite recalcular el puntaje si\n-- despu\u00e9s se recalibra el instrumento.\n-- ------------------------------------------------------------\ncreate table if not exists isel_answers (\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  item_id       text not null,\n  dimension_id  text,\n  item_type     text,\n  raw_answer    jsonb,\n  score         numeric,\n  primary key (assessment_id, item_id)\n);\ncreate index if not exists isel_answers_item_idx on isel_answers(item_id);\n\n-- ------------------------------------------------------------\n-- 5. PUNTAJES POR DIMENSI\u00d3N\n-- ------------------------------------------------------------\ncreate table if not exists isel_dimension_scores (\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  dimension_id  text not null,\n  score         int,\n  weight        numeric,\n  minimum       int,\n  is_critical   boolean,\n  primary key (assessment_id, dimension_id)\n);\n\n-- ------------------------------------------------------------\n-- 6. BANDERAS CR\u00cdTICAS\n-- kind: 'respuesta_etica' (opci\u00f3n marcada como falta grave),\n--       'crit' (dimensi\u00f3n bajo umbral de corte),\n--       'warn' (competencia cr\u00edtica bajo el m\u00ednimo del puesto).\n-- ------------------------------------------------------------\ncreate table if not exists isel_critical_flags (\n  id            bigserial primary key,\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  kind          text not null,\n  item_id       text,\n  detail        text,\n  created_at    timestamptz not null default now()\n);\ncreate index if not exists isel_flags_assessment_idx on isel_critical_flags(assessment_id);\n\n-- ------------------------------------------------------------\n-- 7. RECOMENDACI\u00d3N\n-- ------------------------------------------------------------\ncreate table if not exists isel_recommendations (\n  assessment_id       text primary key references isel_assessments(id) on delete cascade,\n  decision            text,\n  level               text,\n  profile_code        text,\n  risk                text,\n  potential           text,\n  basic_met           int,\n  basic_total         int,\n  ideal_met           int,\n  ideal_total         int,\n  narrative           text,\n  interview_questions text[]\n);\n\n-- ------------------------------------------------------------\n-- 8. PLAN DE DESARROLLO\n-- ------------------------------------------------------------\ncreate table if not exists isel_development_plans (\n  id            bigserial primary key,\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  phase         text not null check (phase in ('d30','d60','d90')),\n  activity      text not null,\n  addresses_gap boolean not null default false\n);\ncreate index if not exists isel_plans_assessment_idx on isel_development_plans(assessment_id);\n\n-- ============================================================\n-- VISTAS\n-- ============================================================\n\n-- Reconstruye el registro que consume la aplicaci\u00f3n\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_records;\ncreate view isel_records with (security_invoker = true) as\nselect\n  a.id,\n  a.candidate_id                        as \"candidateId\",\n  coalesce(a.submitted_at, a.invited_at) as \"createdAt\",\n  coalesce(i.name, 'Puesto no especificado') as puesto,\n  a.version,\n  a.instrument_id                       as \"instrumentId\",\n  a.dims_def                            as \"dimsDef\",\n  c.profile,\n  a.consent,\n  a.answers,\n  a.result,\n  a.scored_by                        as \"scoredBy\",\n  a.client_index                     as \"clientIndex\",\n  coalesce(a.score_mismatch, false)  as \"scoreMismatch\",\n  r.narrative\nfrom isel_assessments a\njoin isel_candidates c on c.id = a.candidate_id\nleft join isel_instruments i on i.id = a.instrument_id\nleft join isel_recommendations r on r.assessment_id = a.id\nwhere a.status = 'completada';\n\n-- Tablero ejecutivo\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_candidate_overview;\ncreate view isel_candidate_overview with (security_invoker = true) as\nselect c.full_name, a.id as assessment_id, a.version, a.index_score, a.decision,\n       a.profile_code, a.risk, rec.basic_met, rec.basic_total, rec.ideal_met, rec.ideal_total,\n       (select count(*) from isel_critical_flags f where f.assessment_id = a.id and f.kind = 'respuesta_etica') as ethical_flags,\n       a.submitted_at\nfrom isel_assessments a\njoin isel_candidates c on c.id = a.candidate_id\nleft join isel_recommendations rec on rec.assessment_id = a.id\nwhere a.status = 'completada'\norder by a.index_score desc nulls last;\n\n-- An\u00e1lisis de reactivos: qu\u00e9 tanto discrimina cada pregunta.\n-- Un reactivo con desviaci\u00f3n cercana a cero no separa candidatos\n-- y conviene revisarlo o retirarlo.\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_item_analysis;\ncreate view isel_item_analysis with (security_invoker = true) as\nselect ans.item_id, ans.dimension_id, ans.item_type,\n       count(*)                       as respuestas,\n       round(avg(ans.score), 1)       as puntaje_medio,\n       round(stddev_pop(ans.score), 1) as dispersion,\n       round(corr(ans.score, a.index_score::numeric)::numeric, 2) as correlacion_indice\nfrom isel_answers ans\njoin isel_assessments a on a.id = ans.assessment_id\nwhere a.status = 'completada' and ans.score is not null\ngroup by ans.item_id, ans.dimension_id, ans.item_type;\n\n-- ============================================================\n-- FUNCIONES\n-- ============================================================\n\n-- ============================================================\n-- MOTOR DE PUNTUACI\u00d3N EN EL SERVIDOR\n-- Calcula el resultado desde las respuestas crudas y la definici\u00f3n\n-- del instrumento. El jsonb 'result' que manda el navegador se\n-- ignora por completo; solo se conserva su \u00edndice para poder\n-- detectar manipulaci\u00f3n.\n-- ============================================================\n\n\n-- ---- puntaje de un reactivo ----\ncreate or replace function isel__score_item(it jsonb, ans jsonb)\nreturns numeric\nlanguage plpgsql\nimmutable\nset search_path = public, extensions\nas $fn$\ndeclare\n  t       text := it->>'type';\n  n       int;\n  mx      int;\n  best    numeric := 0;\n  got     numeric := 0;\n  over    int;\n  disp    numeric := 0;\n  maxdisp numeric;\n  o       jsonb;\n  i       int;\nbegin\n  if ans is null or jsonb_typeof(ans) = 'null' then\n    return null;\n  end if;\n\n  if t = 'likert' then\n    return ((ans #>> '{}')::int - 1) * 25;\n  end if;\n\n  if t in ('scenario','technical') then\n    i := (ans #>> '{}')::int;\n    o := it->'opts'->i;\n    if o is null then return null; end if;\n    return (o->>'s')::numeric;\n  end if;\n\n  if t = 'multi' then\n    if jsonb_typeof(ans) <> 'array' then return null; end if;\n    mx := coalesce((it->>'max')::int, jsonb_array_length(it->'opts'));\n\n    select coalesce(sum(z.p), 0) into best\n    from (\n      select (e->>'p')::numeric as p\n      from jsonb_array_elements(it->'opts') e\n      where (e->>'p')::numeric > 0\n      order by (e->>'p')::numeric desc\n      limit mx\n    ) z;\n    if best = 0 then return null; end if;\n\n    select coalesce(sum(coalesce((it->'opts'->(v.val::int)->>'p')::numeric, 0)), 0) into got\n    from jsonb_array_elements_text(ans) as v(val);\n\n    over := greatest(0, jsonb_array_length(ans) - mx);\n    return greatest(0, least(100, round(got / best * 100) - over * 8));\n  end if;\n\n  if t = 'ranking' then\n    n := jsonb_array_length(it->'opts');\n    if n < 2 then return null; end if;\n\n    select coalesce(sum(abs(coalesce((it->'opts'->(v.val::int)->>'r')::numeric, v.ord) - v.ord)), 0)\n      into disp\n    from jsonb_array_elements_text(ans) with ordinality as v(val, ord);\n\n    maxdisp := floor(n * n / 2.0);\n    if maxdisp = 0 then return null; end if;\n    return greatest(0, least(100, round((1 - disp / maxdisp) * 100)));\n  end if;\n\n  return null;\nend\n$fn$;\n\n-- ---- valor de un requisito ----\ncreate or replace function isel__req_value(src jsonb, dims jsonb, perq jsonb, prof jsonb)\nreturns int\nlanguage plpgsql\nimmutable\nset search_path = public, extensions\nas $fn$\ndeclare\n  t   text := src->>'type';\n  v   numeric;\n  cnt int;\nbegin\n  if t = 'operativo' then\n    return case\n      when coalesce(prof->>'licencia','') = 'S\u00ed'\n       and coalesce(prof->>'viajar','No') <> 'No'\n       and coalesce(prof->>'campo','No')  <> 'No'\n      then 100 else 0 end;\n  end if;\n\n  if t = 'dim' then\n    return coalesce((dims->>(src->>'dim'))::int, 0);\n  end if;\n\n  select count(*), coalesce(avg((perq->>x.val)::numeric), 0)\n    into cnt, v\n  from jsonb_array_elements_text(coalesce(src->'ids','[]'::jsonb)) as x(val)\n  where perq ? x.val and jsonb_typeof(perq->x.val) = 'number';\n\n  if cnt > 0 then return round(v)::int; end if;\n  return coalesce((dims->>(src->>'fallback'))::int, 0);\nend\n$fn$;\n\n-- ---- motor completo ----\ncreate or replace function isel_score(p_instrument jsonb, p_answers jsonb, p_profile jsonb)\nreturns jsonb\nlanguage plpgsql\nstable\nset search_path = public, extensions\nas $fn$\ndeclare\n  it         jsonb;\n  d          jsonb;\n  perq       jsonb := '{}'::jsonb;\n  dims       jsonb := '{}'::jsonb;\n  flags      jsonb := '[]'::jsonb;\n  alerts     jsonb := '[]'::jsonb;\n  basic      jsonb := '[]'::jsonb;\n  ideal      jsonb := '[]'::jsonb;\n  strengths  jsonb := '[]'::jsonb;\n  gaps       jsonb := '[]'::jsonb;\n  probes     jsonb := '[]'::jsonb;\n  plan       jsonb := '{}'::jsonb;\n  consdet    jsonb := '[]'::jsonb;\n  sc         numeric;\n  num        numeric;\n  den        numeric;\n  wsum       numeric := 0;\n  idx        numeric := 0;\n  dv         int;\n  o          jsonb;\n  ansv       jsonb;\n  row_       jsonb;\n  st         text;\n  basic_ok   int := 0;\n  ideal_ok   int := 0;\n  basic_tot  int := 0;\n  ideal_tot  int := 0;\n  prof_code  text;\n  train_raw  numeric;\n  train_key  text;\n  crit_fail  int := 0;\n  hard       boolean := false;\n  risk       text;\n  dec_       text;\n  cons_idx   int := 100;\n  cons_acc   numeric := 0;\n  cons_n     int := 0;\n  hard_dims  text[] := '{}';\n  pair       jsonb;\n  selfv      numeric;\n  behv       numeric;\n  behn       int;\n  g          jsonb;\n  prof_entry jsonb;\n  prof_last  jsonb;\n  ph         text;\n  line       jsonb;\n  arr        jsonb;\n  tmp        numeric;\nbegin\n  ---------------------------------------------------------------\n  -- 1. puntaje por reactivo\n  ---------------------------------------------------------------\n  for it in\n    select e from jsonb_array_elements(coalesce(p_instrument->'items','[]'::jsonb)) e\n    where coalesce((e->>'active')::boolean, true)\n  loop\n    ansv := p_answers -> (it->>'id');\n    sc := isel__score_item(it, ansv);\n    perq := perq || jsonb_build_object(it->>'id', case when sc is null then 'null'::jsonb else to_jsonb(sc::int) end);\n\n    if it->>'type' in ('scenario','technical')\n       and ansv is not null and jsonb_typeof(ansv) = 'number' then\n      o := it->'opts'->((ansv #>> '{}')::int);\n      if o is not null and coalesce((o->>'flag')::boolean, false) then\n        flags := flags || jsonb_build_array(jsonb_build_object(\n          'id', it->>'id', 'dim', it->>'dim', 'txt', o->>'t'));\n      end if;\n    end if;\n  end loop;\n\n  ---------------------------------------------------------------\n  -- 2. puntaje por dimensi\u00f3n e \u00edndice global\n  ---------------------------------------------------------------\n  for d in select e from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e loop\n    num := 0; den := 0;\n    for it in\n      select e from jsonb_array_elements(coalesce(p_instrument->'items','[]'::jsonb)) e\n      where coalesce((e->>'active')::boolean, true) and e->>'dim' = d->>'id'\n    loop\n      if jsonb_typeof(perq->(it->>'id')) = 'number' then\n        num := num + (perq->>(it->>'id'))::numeric * coalesce((it->>'w')::numeric, 1);\n        den := den + coalesce((it->>'w')::numeric, 1);\n      end if;\n    end loop;\n    dv := case when den > 0 then round(num/den)::int else 0 end;\n    dims := dims || jsonb_build_object(d->>'id', dv);\n    wsum := wsum + coalesce((d->>'w')::numeric, 0);\n    idx  := idx + dv * coalesce((d->>'w')::numeric, 0);\n  end loop;\n  if wsum = 0 then wsum := 1; end if;\n  idx := round(idx / wsum);\n\n  ---------------------------------------------------------------\n  -- 3. banderas y alertas\n  ---------------------------------------------------------------\n  if jsonb_array_length(flags) > 0 then\n    hard := true;\n    alerts := alerts || jsonb_build_array(jsonb_build_object(\n      'lvl','crit','t','Respuesta de riesgo \u00e9tico',\n      'd','El candidato eligi\u00f3 al menos una acci\u00f3n que compromete la integridad profesional ('\n          || (select string_agg(f->>'id', ', ') from jsonb_array_elements(flags) f)\n          || '). Esta se\u00f1al se eval\u00faa por separado del promedio.'));\n  end if;\n\n  for row_ in\n    select * from jsonb_array_elements(\n      coalesce(p_instrument->'hardRules',\n        '[{\"dim\":\"etica\",\"below\":60,\"t\":\"\u00c9tica\"},\n          {\"dim\":\"comunicacion\",\"below\":50,\"t\":\"Comunicaci\u00f3n\"},\n          {\"dim\":\"consultiva\",\"below\":45,\"t\":\"Venta consultiva\"}]'::jsonb)) e\n  loop\n    if dims ? (row_->>'dim') and (dims->>(row_->>'dim'))::int < (row_->>'below')::int then\n      hard := true;\n      hard_dims := hard_dims || (row_->>'dim');\n      alerts := alerts || jsonb_build_array(jsonb_build_object(\n        'lvl','crit',\n        't', (row_->>'t') || ' por debajo del umbral de corte (' || (row_->>'below') || ')',\n        'd', 'Obtuvo ' || (dims->>(row_->>'dim')) ||\n             '. Es una competencia indispensable y no se compensa con el resto del perfil.'));\n    end if;\n  end loop;\n\n  for d in select e from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e loop\n    if coalesce((d->>'crit')::boolean,false) and (dims->>(d->>'id'))::int < (d->>'min')::int then\n      crit_fail := crit_fail + 1;\n      if not (d->>'id' = any(hard_dims)) then\n        alerts := alerts || jsonb_build_array(jsonb_build_object(\n          'lvl','warn',\n          't', (d->>'short') || ' por debajo del m\u00ednimo del puesto (' || (d->>'min') || ')',\n          'd', 'Obtuvo ' || (dims->>(d->>'id')) ||\n               '. Competencia cr\u00edtica: requiere validaci\u00f3n espec\u00edfica en entrevista.'));\n      end if;\n    end if;\n  end loop;\n\n  ---------------------------------------------------------------\n  -- 4. requisitos b\u00e1sicos e ideales\n  ---------------------------------------------------------------\n  for row_ in select e from jsonb_array_elements(coalesce(p_instrument->'basic','[]'::jsonb)) e loop\n    dv := isel__req_value(row_->'src', dims, perq, p_profile);\n    st := case\n            when dv >= (row_->>'min')::int then 'ok'\n            when row_->'src'->>'type' = 'operativo' then 'no'\n            when dv >= (row_->>'min')::int - 15 then 'pa'\n            else 'no' end;\n    if st = 'ok' then basic_ok := basic_ok + 1; end if;\n    basic_tot := basic_tot + 1;\n    basic := basic || jsonb_build_array(row_ || jsonb_build_object(\n      'v', dv, 'st', st, 'bin', row_->'src'->>'type' = 'operativo'));\n  end loop;\n\n  for row_ in select e from jsonb_array_elements(coalesce(p_instrument->'ideal','[]'::jsonb)) e loop\n    dv := isel__req_value(row_->'src', dims, perq, p_profile);\n    st := case\n            when dv >= (row_->>'min')::int then 'ok'\n            when dv >= (row_->>'min')::int - 15 then 'pa'\n            else 'no' end;\n    if st = 'ok' then ideal_ok := ideal_ok + 1; end if;\n    ideal_tot := ideal_tot + 1;\n    ideal := ideal || jsonb_build_array(row_ || jsonb_build_object('v', dv, 'st', st));\n  end loop;\n\n  ---------------------------------------------------------------\n  -- 5. perfil, entrenabilidad, riesgo y decisi\u00f3n\n  ---------------------------------------------------------------\n  -- El perfil se clasifica con las reglas del instrumento, no con reglas fijas\n  -- del puesto de vendedor: gana la primera cuyas condiciones se cumplen todas.\n  prof_entry := null;\n  for row_ in\n    select e from jsonb_array_elements(\n      coalesce(nullif(p_instrument->'profiles','[]'::jsonb),\n      '[{\"code\":\"D\",\"k\":\"Desarrollador estrat\u00e9gico de cuentas\",\"d\":\"\",\n         \"when\":[{\"dim\":\"consultiva\",\"min\":78},{\"dim\":\"prospeccion\",\"min\":72},\n                 {\"dim\":\"pipeline\",\"min\":72},{\"dim\":\"comunicacion\",\"min\":75},{\"dim\":\"index\",\"min\":78}]},\n        {\"code\":\"C\",\"k\":\"Consultor comercial\",\"d\":\"\",\n         \"when\":[{\"dim\":\"consultiva\",\"min\":68},{\"dim\":\"tecnica\",\"min\":58},\n                 {\"dim\":\"negociacion\",\"min\":58},{\"dim\":\"index\",\"min\":66}]},\n        {\"code\":\"B\",\"k\":\"Vendedor industrial\",\"d\":\"\",\n         \"when\":[{\"dim\":\"index\",\"min\":56},{\"dim\":\"prospeccion\",\"min\":52},{\"dim\":\"consultiva\",\"min\":55}]},\n        {\"code\":\"A\",\"k\":\"Comercial transaccional\",\"d\":\"\",\"when\":[]}]'::jsonb)) e\n  loop\n    if not exists (\n      select 1 from jsonb_array_elements(coalesce(row_->'when','[]'::jsonb)) c\n      where case when c->>'dim' = 'index' then idx\n                 else coalesce((dims->>(c->>'dim'))::numeric, idx) end < (c->>'min')::numeric)\n    then\n      prof_entry := row_;\n      exit;\n    end if;\n    prof_last := row_;\n  end loop;\n  if prof_entry is null then prof_entry := prof_last; end if;\n  prof_code := coalesce(prof_entry->>'code', 'A');\n\n  -- La entrenabilidad tambi\u00e9n se pondera con lo que declare el instrumento.\n  train_raw := 0; tmp := 0;\n  for row_ in\n    select e from jsonb_array_elements(\n      coalesce(nullif(p_instrument->'trainability','[]'::jsonb),\n      '[{\"dim\":\"aprendizaje\",\"w\":0.30},{\"item\":\"A02\",\"fallback\":\"aprendizaje\",\"w\":0.15},\n        {\"dim\":\"organizacion\",\"w\":0.15},{\"dim\":\"etica\",\"w\":0.15},\n        {\"dim\":\"tecnica\",\"w\":0.10},{\"dim\":\"resultados\",\"w\":0.15}]'::jsonb)) e\n  loop\n    train_raw := train_raw + coalesce((row_->>'w')::numeric, 0) * (\n      case\n        when row_ ? 'item' and jsonb_typeof(perq->(row_->>'item')) = 'number'\n          then (perq->>(row_->>'item'))::numeric\n        else coalesce((dims->>coalesce(row_->>'dim', row_->>'fallback'))::numeric, idx)\n      end);\n    tmp := tmp + coalesce((row_->>'w')::numeric, 0);\n  end loop;\n  train_raw := round(case when tmp > 0 then train_raw / tmp else idx end);\n  train_key := case when train_raw >= 82 then 'Muy alto'\n                    when train_raw >= 68 then 'Alto'\n                    when train_raw >= 52 then 'Medio'\n                    else 'Bajo' end;\n\n  risk := case when hard or crit_fail >= 3 then 'Alto'\n               when crit_fail >= 1 or idx < 60 then 'Moderado'\n               else 'Bajo' end;\n\n  ---------------------------------------------------------------\n  -- 6. consistencia\n  ---------------------------------------------------------------\n  for pair in select e from jsonb_array_elements(coalesce(p_instrument->'consPairs','[]'::jsonb)) e loop\n    if jsonb_typeof(perq->(pair->>'self')) = 'number' then\n      selfv := (perq->>(pair->>'self'))::numeric;\n      select count(*), avg((perq->>b.val)::numeric) into behn, behv\n      from jsonb_array_elements_text(coalesce(pair->'beh','[]'::jsonb)) as b(val)\n      where jsonb_typeof(perq->b.val) = 'number';\n      if behn > 0 then\n        cons_acc := cons_acc + abs(selfv - behv);\n        cons_n := cons_n + 1;\n        consdet := consdet || jsonb_build_array(jsonb_build_object(\n          'n', pair->>'n', 'self', round(selfv)::int,\n          'beh', round(behv)::int, 'gap', round(abs(selfv - behv))::int));\n      end if;\n    end if;\n  end loop;\n  if cons_n > 0 then\n    cons_idx := greatest(0, least(100, round(100 - (cons_acc / cons_n) * 1.1)::int));\n  end if;\n\n  ---------------------------------------------------------------\n  -- 7. decisi\u00f3n\n  ---------------------------------------------------------------\n  dec_ := case\n    when hard then 'NO'\n    when idx < 40 or crit_fail >= 3 then 'NO'\n    when crit_fail >= 1 or idx < 60\n      or (basic_tot > 0 and basic_ok::numeric / basic_tot < 0.8) then 'RES'\n    when idx >= 90\n      or (idx >= 82 and prof_code = 'D' and train_key in ('Alto','Muy alto')\n          and ideal_ok >= ceil(ideal_tot * 0.6)) then 'POT'\n    when idx >= 75 then 'ALTO'\n    else 'SI' end;\n\n  ---------------------------------------------------------------\n  -- 8. fortalezas, brechas, preguntas y plan\n  ---------------------------------------------------------------\n  select coalesce(jsonb_agg(jsonb_build_object(\n           't', e->>'short', 'v', (dims->>(e->>'id'))::int, 'd', coalesce(e->>'strength',''))), '[]'::jsonb)\n    into strengths\n  from (\n    select e from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e\n    where (dims->>(e->>'id'))::int >= 60\n    order by (dims->>(e->>'id'))::int desc\n    limit 3\n  ) z;\n\n  select coalesce(jsonb_agg(jsonb_build_object(\n           't', e->>'short', 'v', (dims->>(e->>'id'))::int, 'd', coalesce(e->>'gap',''))), '[]'::jsonb)\n    into gaps\n  from (\n    select e from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e\n    where (dims->>(e->>'id'))::int < 78\n    order by (dims->>(e->>'id'))::int asc\n    limit 3\n  ) z;\n\n  if jsonb_array_length(flags) > 0 then\n    probes := probes || jsonb_build_array(\n      'Revisar directamente la respuesta de riesgo \u00e9tico detectada ('\n      || (select string_agg(f->>'id', ', ') from jsonb_array_elements(flags) f)\n      || '): pedir que explique su razonamiento y qu\u00e9 har\u00eda hoy de forma distinta.');\n  end if;\n\n  for g in select e from jsonb_array_elements(gaps) e loop\n    select e->>'probe' into st\n    from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e\n    where e->>'short' = g->>'t' limit 1;\n    if st is not null and st <> '' and not probes @> to_jsonb(array[st]) then\n      probes := probes || jsonb_build_array(st);\n    end if;\n  end loop;\n\n  if cons_idx < 70 then\n    probes := probes || jsonb_build_array(\n      'El \u00edndice de consistencia es bajo: hay diferencia notable entre lo que el candidato declara de s\u00ed mismo y las decisiones que eligi\u00f3. Contrastar con ejemplos concretos y verificables.');\n  end if;\n  if coalesce((prof_entry->>'warnLow')::boolean, false) and idx >= 60 then\n    probes := probes || jsonb_build_array(coalesce(nullif(prof_entry->>'warnText',''),\n      'El perfil resulta competente pero limitado para el alcance del puesto. Explorar con ejemplos concretos hasta d\u00f3nde ha llegado su responsabilidad real.'));\n  end if;\n\n  for st in\n    select e->>'probe'\n    from jsonb_array_elements(coalesce(p_instrument->'dims','[]'::jsonb)) e\n    where coalesce(e->>'probe','') <> ''\n    order by (dims->>(e->>'id'))::int asc\n  loop\n    exit when jsonb_array_length(probes) >= 3;\n    if not probes @> to_jsonb(array[st]) then\n      probes := probes || jsonb_build_array(st);\n    end if;\n  end loop;\n  probes := (select coalesce(jsonb_agg(v), '[]'::jsonb)\n             from (select value as v from jsonb_array_elements(probes) limit 5) z);\n\n  foreach ph in array array['d30','d60','d90'] loop\n    arr := '[]'::jsonb;\n    for line in select e from jsonb_array_elements(coalesce(p_instrument->'plan'->ph,'[]'::jsonb)) e loop\n      arr := arr || jsonb_build_array(jsonb_build_object(\n        't', line->>'t',\n        'g', coalesce(line->>'dim','') <> ''\n             and coalesce((dims->>(line->>'dim'))::int, 100) < 70));\n    end loop;\n    plan := plan || jsonb_build_object(ph, arr);\n  end loop;\n\n  ---------------------------------------------------------------\n  return jsonb_build_object(\n    'dims', dims, 'index', idx::int, 'perQ', perq,\n    'alerts', alerts, 'flags', flags,\n    'BASIC', basic, 'IDEAL', ideal,\n    'basicOk', basic_ok, 'idealOk', ideal_ok,\n    'prof', prof_code,\n    'profK', coalesce(prof_entry->>'k', prof_code),\n    'profD', coalesce(prof_entry->>'d', ''),\n    'trainRaw', train_raw::int, 'trainKey', train_key,\n    'risk', risk, 'dec', dec_,\n    'strengths', strengths, 'gaps', gaps, 'probes', probes, 'plan', plan,\n    'consistency', jsonb_build_object('idx', cons_idx, 'det', consdet)\n  );\nend\n$fn$;\n\n-- Descompone el registro que env\u00eda la aplicaci\u00f3n en las tablas\n-- normalizadas. Es interna: no se expone a anon ni a authenticated.\ncreate or replace function isel__persist(p jsonb)\nreturns text\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  v_assessment text := p->>'id';\n  v_candidate  text;\n  v_result     jsonb;\n  v_def        jsonb;\n  v_scored     text;\n  v_client     int  := nullif(p->'result'->>'index','')::int;\n  v_paso       text := 'inicio';\nbegin\n  -- El resultado se recalcula aqu\u00ed desde las respuestas crudas y la definici\u00f3n\n  -- del instrumento. Lo que manda el navegador solo se guarda para comparar.\n  v_paso := 'calculo';\n  select definition into v_def from isel_instruments where id = p->>'instrumentId';\n  if v_def is not null then\n    v_result := isel_score(v_def, coalesce(p->'answers','{}'::jsonb), coalesce(p->'profile','{}'::jsonb));\n    v_scored := 'servidor';\n  else\n    v_result := p->'result';\n    v_scored := 'cliente';\n  end if;\n  select candidate_id into v_candidate from isel_assessments where id = v_assessment;\n  if v_candidate is null then\n    v_candidate := coalesce(p->>'candidateId', 'K' || encode(gen_random_bytes(8), 'hex'));\n  end if;\n\n  v_paso := 'candidato';\n  insert into isel_candidates (id, full_name, email, profile)\n  values (v_candidate,\n          coalesce(nullif(p->'profile'->>'nombre',''), 'Sin nombre'),\n          p->'profile'->>'email',\n          coalesce(p->'profile', '{}'::jsonb))\n  on conflict (id) do update\n    set full_name = excluded.full_name,\n        email     = coalesce(excluded.email, isel_candidates.email),\n        profile   = excluded.profile;\n\n  v_paso := 'evaluacion';\n  insert into isel_assessments (id, candidate_id, instrument_id, version, status,\n                                consent, answers, dims_def, result, index_score, decision,\n                                profile_code, risk, consistency, submitted_at,\n                                scored_by, client_index, score_mismatch)\n  values (v_assessment, v_candidate, p->>'instrumentId', p->>'version', 'completada',\n          p->'consent', p->'answers', p->'dimsDef', v_result,\n          (v_result->>'index')::int, v_result->>'dec', v_result->>'prof', v_result->>'risk',\n          (v_result->'consistency'->>'idx')::int,\n          coalesce((p->>'createdAt')::timestamptz, now()),\n          v_scored, v_client,\n          v_scored = 'servidor' and v_client is distinct from (v_result->>'index')::int)\n  on conflict (id) do update\n    set consent      = excluded.consent,\n        answers      = excluded.answers,\n        dims_def     = excluded.dims_def,\n        result       = excluded.result,\n        index_score  = excluded.index_score,\n        decision     = excluded.decision,\n        profile_code = excluded.profile_code,\n        risk         = excluded.risk,\n        consistency  = excluded.consistency,\n        status       = 'completada',\n        invite_token = null,\n        submitted_at = excluded.submitted_at,\n        scored_by      = excluded.scored_by,\n        client_index   = excluded.client_index,\n        score_mismatch = excluded.score_mismatch;\n\n  v_paso := 'respuestas';\n  delete from isel_answers where assessment_id = v_assessment;\n  insert into isel_answers (assessment_id, item_id, dimension_id, item_type, raw_answer, score)\n  select v_assessment, kv.key, x.it->>'dim', x.it->>'type', kv.value,\n         nullif(v_result->'perQ'->>kv.key, '')::numeric\n  from jsonb_each(coalesce(p->'answers', '{}'::jsonb)) kv\n  left join lateral (\n    select item as it\n    from isel_instruments ins,\n         jsonb_array_elements(ins.definition->'items') item\n    where ins.id = p->>'instrumentId' and item->>'id' = kv.key\n    limit 1\n  ) x on true;\n\n  v_paso := 'dimensiones';\n  delete from isel_dimension_scores where assessment_id = v_assessment;\n  insert into isel_dimension_scores (assessment_id, dimension_id, score, weight, minimum, is_critical)\n  select v_assessment, d->>'id', (v_result->'dims'->>(d->>'id'))::int,\n         (d->>'w')::numeric, (d->>'min')::int, (d->>'crit')::boolean\n  from jsonb_array_elements(coalesce(p->'dimsDef', '[]'::jsonb)) d;\n\n  v_paso := 'banderas';\n  delete from isel_critical_flags where assessment_id = v_assessment;\n  insert into isel_critical_flags (assessment_id, kind, item_id, detail)\n  select v_assessment, 'respuesta_etica', f->>'id', f->>'txt'\n  from jsonb_array_elements(coalesce(v_result->'flags', '[]'::jsonb)) f;\n  insert into isel_critical_flags (assessment_id, kind, item_id, detail)\n  select v_assessment, a->>'lvl', null, (a->>'t') || ' \u2014 ' || (a->>'d')\n  from jsonb_array_elements(coalesce(v_result->'alerts', '[]'::jsonb)) a;\n\n  v_paso := 'recomendacion';\n  insert into isel_recommendations (assessment_id, decision, level, profile_code, risk, potential,\n                                    basic_met, basic_total, ideal_met, ideal_total,\n                                    narrative, interview_questions)\n  values (v_assessment, v_result->>'dec', p->>'level', v_result->>'prof', v_result->>'risk',\n          v_result->>'trainKey',\n          (v_result->>'basicOk')::int, jsonb_array_length(coalesce(v_result->'BASIC','[]'::jsonb)),\n          (v_result->>'idealOk')::int, jsonb_array_length(coalesce(v_result->'IDEAL','[]'::jsonb)),\n          case when v_scored = 'servidor' then null else p->>'narrative' end,\n          array(select jsonb_array_elements_text(coalesce(v_result->'probes','[]'::jsonb))))\n  on conflict (assessment_id) do update\n    set decision = excluded.decision, level = excluded.level, profile_code = excluded.profile_code,\n        risk = excluded.risk, potential = excluded.potential,\n        basic_met = excluded.basic_met, basic_total = excluded.basic_total,\n        ideal_met = excluded.ideal_met, ideal_total = excluded.ideal_total,\n        narrative = excluded.narrative, interview_questions = excluded.interview_questions;\n\n  v_paso := 'plan';\n  delete from isel_development_plans where assessment_id = v_assessment;\n  insert into isel_development_plans (assessment_id, phase, activity, addresses_gap)\n  select v_assessment, ph.key, it->>'t', coalesce((it->>'g')::boolean, false)\n  from jsonb_each(coalesce(v_result->'plan', '{}'::jsonb)) ph,\n       jsonb_array_elements(ph.value) it;\n\n  return v_assessment;\nexception when others then\n  -- Reporta en qu\u00e9 paso muri\u00f3 y el error original, en vez de un mensaje opaco\n  raise exception 'ISEL persist fall\u00f3 en el paso \"%\": % (SQLSTATE %)', v_paso, sqlerrm, sqlstate;\nend\n$fn$;\n\n-- Guardar un registro desde el panel (requiere sesi\u00f3n)\ncreate or replace function isel_save_record(p jsonb)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare v_id text;\nbegin\n  if auth.uid() is null then\n    raise exception 'Se requiere sesi\u00f3n iniciada';\n  end if;\n  v_id := isel__persist(p);\n  return jsonb_build_object('ok', true, 'id', v_id);\nend\n$fn$;\n\n-- Crear una invitaci\u00f3n para que el candidato conteste por su cuenta\ncreate or replace function isel_create_invite(p_instrument text, p_name text, p_email text)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  v_token text := encode(gen_random_bytes(12), 'hex');\n  v_cand  text := 'K' || encode(gen_random_bytes(8), 'hex');\n  v_ass   text := 'A' || encode(gen_random_bytes(8), 'hex');\n  v_ver   text;\nbegin\n  if auth.uid() is null then\n    raise exception 'Se requiere sesi\u00f3n iniciada';\n  end if;\n  select version into v_ver from isel_instruments where id = p_instrument;\n  if v_ver is null then\n    raise exception 'El instrumento indicado no existe';\n  end if;\n\n  insert into isel_candidates (id, full_name, email, profile)\n  values (v_cand, coalesce(nullif(p_name,''), 'Candidato por invitaci\u00f3n'), p_email,\n          jsonb_build_object('nombre', p_name, 'email', p_email));\n\n  insert into isel_assessments (id, candidate_id, instrument_id, version, invite_token, status)\n  values (v_ass, v_cand, p_instrument, v_ver, v_token, 'pendiente');\n\n  return jsonb_build_object('token', v_token, 'assessmentId', v_ass, 'candidateId', v_cand, 'version', v_ver);\nend\n$fn$;\n\n-- Lo \u00fanico que puede leer un candidato con su enlace:\n-- la definici\u00f3n del instrumento y su propio nombre.\n-- Nunca puntajes, criterios ni datos de otros candidatos.\ncreate or replace function isel_get_invite(p_token text)\nreturns jsonb\nlanguage sql\nsecurity definer\nset search_path = public, extensions\nstable\nas $fn$\n  select jsonb_build_object(\n    'assessmentId', a.id,\n    'status',       a.status,\n    'version',      a.version,\n    'instrumentId', a.instrument_id,\n    'candidate',    jsonb_build_object('nombre', c.full_name, 'email', c.email),\n    'instrument',   i.definition)\n  from isel_assessments a\n  join isel_instruments i on i.id = a.instrument_id\n  left join isel_candidates c on c.id = a.candidate_id\n  where a.invite_token = p_token\n    and a.status in ('pendiente','en_progreso');\n$fn$;\n\ncreate or replace function isel_start_invite(p_token text)\nreturns void\nlanguage sql\nsecurity definer\nset search_path = public, extensions\nas $fn$\n  update isel_assessments\n     set status = 'en_progreso', started_at = coalesce(started_at, now())\n   where invite_token = p_token and status = 'pendiente';\n$fn$;\n\n-- Env\u00edo del candidato. El token se anula: un enlace, un uso.\ncreate or replace function isel_submit_invite(p_token text, p jsonb)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare v_id text;\nbegin\n  select id into v_id\n    from isel_assessments\n   where invite_token = p_token and status in ('pendiente','en_progreso');\n  if v_id is null then\n    raise exception 'La invitaci\u00f3n no es v\u00e1lida o ya fue utilizada';\n  end if;\n  perform isel__persist(jsonb_set(p, '{id}', to_jsonb(v_id)));\n  return jsonb_build_object('ok', true);\nend\n$fn$;\n\n-- ============================================================\n-- VERIFICACI\u00d3N Y REC\u00c1LCULO\n-- ============================================================\n\n-- Compara lo que calcul\u00f3 el navegador contra lo que calcula el servidor.\n-- Una diferencia no prueba manipulaci\u00f3n: tambi\u00e9n aparece si el instrumento\n-- cambi\u00f3 despu\u00e9s de aplicar la evaluaci\u00f3n. Lo que manda es la columna\n-- indice_servidor, que es la que se guarda como resultado.\ncreate or replace view isel_score_audit with (security_invoker = true) as\nselect c.full_name                 as candidato,\n       a.id                        as evaluacion,\n       a.version,\n       a.scored_by                 as calculado_por,\n       a.client_index              as indice_cliente,\n       a.index_score               as indice_servidor,\n       coalesce(a.score_mismatch, false) as difiere,\n       a.submitted_at\nfrom isel_assessments a\njoin isel_candidates c on c.id = a.candidate_id\nwhere a.status = 'completada'\norder by coalesce(a.score_mismatch, false) desc, a.submitted_at desc;\n\n-- Vuelve a puntuar una evaluaci\u00f3n desde sus respuestas guardadas.\ncreate or replace function isel_rescore(p_assessment text)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  a      isel_assessments%rowtype;\n  v_def  jsonb;\n  v_prof jsonb;\n  v_res  jsonb;\n  v_pay  jsonb;\nbegin\n  -- Permite llamarla con sesi\u00f3n de usuario (desde la app) o como due\u00f1o de la\n  -- base (desde el editor SQL), pero no desde la API sin autenticar.\n  if auth.uid() is null and not pg_has_role(current_user, 'postgres', 'member') then\n    raise exception 'Se requiere sesi\u00f3n iniciada o permisos de administrador de la base';\n  end if;\n  select * into a from isel_assessments where id = p_assessment;\n  if a.id is null then raise exception 'La evaluaci\u00f3n % no existe', p_assessment; end if;\n\n  select definition into v_def from isel_instruments where id = a.instrument_id;\n  if v_def is null then raise exception 'No se encontr\u00f3 el instrumento % de esa evaluaci\u00f3n', a.instrument_id; end if;\n\n  select profile into v_prof from isel_candidates where id = a.candidate_id;\n  v_res := isel_score(v_def, coalesce(a.answers,'{}'::jsonb), coalesce(v_prof,'{}'::jsonb));\n\n  v_pay := jsonb_build_object(\n    'id', a.id, 'candidateId', a.candidate_id, 'instrumentId', a.instrument_id,\n    'version', a.version, 'createdAt', coalesce(a.submitted_at, now()),\n    'profile', coalesce(v_prof,'{}'::jsonb), 'answers', coalesce(a.answers,'{}'::jsonb),\n    'consent', a.consent, 'dimsDef', a.dims_def, 'result', v_res);\n\n  perform isel__persist(v_pay);\n  return jsonb_build_object('id', a.id, 'index', (v_res->>'index')::int, 'decision', v_res->>'dec');\nend\n$fn$;\n\n-- Recalcula todas las evaluaciones completadas.\ncreate or replace function isel_rescore_all()\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  r     record;\n  n     int := 0;\n  fails int := 0;\n  err   text;\nbegin\n  if auth.uid() is null and not pg_has_role(current_user, 'postgres', 'member') then\n    raise exception 'Se requiere sesi\u00f3n iniciada o permisos de administrador de la base';\n  end if;\n  for r in select id from isel_assessments where status = 'completada' order by submitted_at loop\n    begin\n      perform isel_rescore(r.id);\n      n := n + 1;\n    exception when others then\n      fails := fails + 1;\n      if err is null then err := sqlerrm; end if;\n    end;\n  end loop;\n  return jsonb_build_object('recalculadas', n, 'con_error', fails, 'primer_error', err);\nend\n$fn$;\n\ngrant execute on function isel_rescore(text)  to authenticated;\ngrant execute on function isel_rescore_all()  to authenticated;\ngrant select on isel_score_audit to authenticated;\nrevoke execute on function isel_score(jsonb, jsonb, jsonb) from anon;\nrevoke execute on function isel__score_item(jsonb, jsonb) from anon;\nrevoke execute on function isel__req_value(jsonb, jsonb, jsonb, jsonb) from anon;\n\n-- ============================================================\n-- SEGURIDAD\n-- Sin pol\u00edticas, RLS activo bloquea todo: anon no toca las tablas\n-- y solo puede ejecutar las tres funciones del flujo de invitaci\u00f3n.\n-- ============================================================\nalter table isel_instruments       enable row level security;\nalter table isel_candidates        enable row level security;\nalter table isel_assessments       enable row level security;\nalter table isel_answers           enable row level security;\nalter table isel_dimension_scores  enable row level security;\nalter table isel_critical_flags    enable row level security;\nalter table isel_recommendations   enable row level security;\nalter table isel_development_plans enable row level security;\n\ndo $policies$\ndeclare t text;\nbegin\n  foreach t in array array['isel_instruments','isel_candidates','isel_assessments','isel_answers',\n                           'isel_dimension_scores','isel_critical_flags','isel_recommendations',\n                           'isel_development_plans']\n  loop\n    execute format('drop policy if exists isel_rw_authenticated on %I', t);\n    execute format(\n      'create policy isel_rw_authenticated on %I for all to authenticated using (true) with check (true)', t);\n  end loop;\nend\n$policies$;\n\nrevoke execute on function isel__persist(jsonb) from public;\nrevoke execute on function isel__persist(jsonb) from anon;\n\ngrant execute on function isel_get_invite(text)            to anon, authenticated;\ngrant execute on function isel_start_invite(text)          to anon, authenticated;\ngrant execute on function isel_submit_invite(text, jsonb)  to anon, authenticated;\ngrant execute on function isel_save_record(jsonb)          to authenticated;\ngrant execute on function isel_create_invite(text,text,text) to authenticated;\n\ngrant select on isel_records, isel_candidate_overview, isel_item_analysis to authenticated;\n\n-- ============================================================\n-- NOTA SOBRE EL C\u00c1LCULO\n-- El puntaje lo calcula isel_score dentro de la base, a partir de\n-- las respuestas crudas y de la definici\u00f3n del instrumento. El\n-- jsonb 'result' que manda el navegador se descarta; solo se\n-- conserva su \u00edndice en client_index para poder detectar si el\n-- dispositivo report\u00f3 algo distinto (score_mismatch).\n-- Lo que ning\u00fan sistema puede evitar es que un candidato responda\n-- de forma deshonesta. La defensa contra eso est\u00e1 en el dise\u00f1o de\n-- los reactivos, no en el c\u00f3digo.\n-- ============================================================\n";

function inviteLink(token){
  const base = location.origin + location.pathname + location.search;
  return base + '#/e/' + token;
}

function viewSettings(){
  const t = S.conn;
  return topbar()+`<div class="shell-narrow" style="padding-top:30px;padding-bottom:60px">
    <div class="sect-h"><h2>Conexión de datos</h2>
      <span class="sub">${DB.remote?'Supabase':'Almacenamiento local'}</span></div>
    <div class="panel" style="margin-bottom:18px"><div class="panel-b" style="padding:13px 16px">
      <div class="tiny">Versión de la aplicación cargada en este navegador</div>
      <div style="font-family:var(--cond);font-size:22px;font-weight:600">${BUILD}</div>
      <div class="tiny" style="margin-top:4px">${BUILD_NOTAS}</div>
      <div class="tiny" style="margin-top:6px">Si no coincide con la que esperabas, el navegador está sirviendo una copia en caché:
      recarga con Ctrl+Shift+R o abre una ventana de incógnito.</div>
    </div></div>
    ${S.msg?`<div class="alert warn" style="margin-bottom:18px"><h3>${esc(S.msg)}</h3></div>`:''}

    <div class="modecard">
      <button class="modeopt ${CFG.mode==='supabase'?'on':''}" data-mode="supabase">
        <b>En línea</b><span>Modo de operación. Base compartida con control de acceso: el equipo ve los mismos
        candidatos, los enlaces funcionan desde cualquier dispositivo, el puntaje se calcula en el servidor y las

const scoreColor = v => v>=80?'var(--r-green)': v>=60?'var(--r-yellow)': v>=40?'var(--r-orange)':'var(--r-red)';

function answerDetail(q, ans, score){
  const best = i => q.opts.reduce((b,o,k)=> o.s>q.opts[b].s ? k : b, 0);
  let body = '';
  if(q.type==='likert'){
    body = `<div class="ansrow sel"><span class="ansv" style="color:${scoreColor(score)}">${ans||'—'}</span>
      <span>Se calificó ${ans||'—'} de 5 en la escala “${esc(q.labs[0])}” a “${esc(q.labs[1])}”.</span></div>`;
  }
  else if(q.type==='scenario' || q.type==='technical'){
    const b = best();
    body = q.opts.map((o,i)=>{
      const chosen = ans===i;
      const cls = chosen ? 'sel' : (i===b ? 'best' : '');
      return `<div class="ansrow ${cls}">
        <span class="ansv" style="color:${scoreColor(o.s)}">${o.s}</span>
        <span>${esc(o.t)}
          ${chosen?'<b class="tagc">Elegida</b>':''}${i===b && !chosen?'<b class="tagb">Mejor opción</b>':''}
          ${o.flag?'<b class="tagf">Bandera crítica</b>':''}</span></div>`;
    }).join('');
  }
  else if(q.type==='multi'){
    const sel = ans||[];
    body = q.opts.map((o,i)=>{
      const chosen = sel.includes(i);
      const cls = chosen ? (o.p<0?'bad':'sel') : (o.p>0 ? 'miss' : '');
      return `<div class="ansrow ${cls}">
        <span class="ansv" style="color:${o.p>0?'var(--r-green)':o.p<0?'var(--r-red)':'var(--ink-3)'}">${o.p>0?'+'+o.p:o.p}</span>
        <span>${esc(o.t)}
          ${chosen?'<b class="tagc">Elegida</b>':''}${!chosen && o.p>0?'<b class="tagm">No la vio</b>':''}</span></div>`;
    }).join('');
  }
  else if(q.type==='ranking'){
    const chosen = ans||[];
    body = q.opts.map((o,i)=>{
      const pos = chosen.indexOf(i)+1;
      const ok = pos===o.r;
      return `<div class="ansrow ${ok?'sel':'bad'}">
        <span class="ansv">${pos||'—'}<em>/${o.r}</em></span>
        <span>${esc(o.t)}${ok?'':`<b class="tagm">Debía ir en ${o.r}</b>`}</span></div>`;
    }).join('');
  }
  return body;
}

/* ---- análisis de reactivos ---- */
function itemStats(){
  const rows = [];
  const recs = S.list.filter(r=>r.result && r.result.perQ);
  const byIns = {};
  S.instruments.forEach(i=>{ i.items.forEach(q=>{ byIns[q.id] = byIns[q.id] || {q, dim:q.dim}; }); });
  Object.values(byIns).forEach(({q})=>{
    const pares = [];
    recs.forEach(r=>{
      const v = r.result.perQ[q.id];
      if(v!==null && v!==undefined) pares.push([v, r.result.index]);
    });
    const n = pares.length;
    if(!n) return;
    const mx = pares.reduce((a,p)=>a+p[0],0)/n;
    const my = pares.reduce((a,p)=>a+p[1],0)/n;
    const sx = Math.sqrt(pares.reduce((a,p)=>a+(p[0]-mx)**2,0)/n);
    const sy = Math.sqrt(pares.reduce((a,p)=>a+(p[1]-my)**2,0)/n);
    const cov = pares.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/n;
    const r = (sx>0 && sy>0) ? cov/(sx*sy) : null;
    let veredicto, color;
    if(sx < 8){ veredicto='Todos responden igual'; color='var(--r-red)'; }
    else if(r===null){ veredicto='Sin datos suficientes'; color='var(--ink-3)'; }
    else if(r >= .35){ veredicto='Discrimina bien'; color='var(--r-green)'; }
    else if(r >= .15){ veredicto='Discrimina poco'; color='var(--amber)'; }
    else { veredicto='No discrimina'; color='var(--r-red)'; }
    if(mx >= 92) veredicto = 'Demasiado fácil';
    if(mx <= 20) veredicto = 'Demasiado difícil';
    rows.push({q, n, media:R(mx), sd:R(sx), r: r===null?null:Math.round(r*100)/100, veredicto, color});
  });
  return rows;
}

function viewAnalysis(){
  const rows = itemStats();
  const n = S.list.length;
  const key = {r:'r', media:'media', sd:'sd', id:'id'}[S.analysisSort] || 'r';
  rows.sort((a,b)=>{
    if(key==='id') return a.q.id < b.q.id ? -1 : 1;
    const x = a[key]===null?-2:a[key], y = b[key]===null?-2:b[key];
    return x - y;
  });
  const malos = rows.filter(x=>x.color==='var(--r-red)').length;
  return topbar()+`<div class="shell" style="padding-top:26px;padding-bottom:50px">
    <div class="sect-h"><h2>Análisis de reactivos</h2><span class="sub">${rows.length} reactivos · ${n} evaluaciones</span></div>
    ${n < 15 ? `<div class="alert warn" style="margin-bottom:16px"><h3>Muestra insuficiente</h3>
      Con ${n} evaluación${n===1?'':'es'} los números son ruido. Estas cifras empiezan a significar algo a partir de unos
      15 candidatos y se vuelven confiables cerca de 30. Déjalo correr y vuelve cuando tengas historial.</div>`
      : malos ? `<div class="alert" style="margin-bottom:16px"><h3>${malos} reactivo${malos>1?'s':''} para revisar</h3>
      Aparecen abajo en rojo. O todos los candidatos responden igual, o la respuesta no se relaciona con el desempeño general.</div>`
      : `<div class="alert warn" style="margin-bottom:16px"><h3>Sin reactivos problemáticos</h3>
      Todos separan razonablemente entre candidatos.</div>`}
    <p class="note" style="margin:0 0 16px"><b>Media</b>: puntaje promedio del reactivo.
    <b>Dispersión</b>: qué tanto varían las respuestas; cerca de cero significa que todos contestan lo mismo y el reactivo no aporta.
    <b>Correlación</b>: relación entre lo que se obtiene en este reactivo y el índice global. Alta significa que quienes
    responden bien aquí suelen ser los mejores candidatos, que es justo lo que debe hacer una buena pregunta.</p>

/* ============================================================

function porFamilia(lista, soloPublicadas){
  const g = {};
  (lista||[]).filter(i=>!soloPublicadas || i.status==='publicada')
    .forEach(i=>{ (g[famOf(i)] = g[famOf(i)] || []).push(i); });
  Object.keys(g).forEach(f=>{
    g[f].sort((a,b)=>((b.isActive?1:0)-(a.isActive?1:0)) || (b.updatedAt||'').localeCompare(a.updatedAt||''));
  });
  return g;
}
const versionElegida = (fam, grupos) =>
  (S.pickVer && S.pickVer[fam]) || (grupos[fam] && grupos[fam][0] && grupos[fam][0].id) || '';
