<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluación de Competencias Comerciales ISEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --steel-50:#F3F5F7; --steel-75:#EAEEF1; --steel-100:#E0E5E9; --steel-200:#CFD6DC;
  --steel-300:#B3BDC6; --steel-500:#77848F;
  --ink:#151E27; --ink-2:#3D4B58; --ink-3:#6B7986;
  --blue:#12558C; --blue-d:#0B3C66; --blue-l:#E7EFF6;
  --amber:#C97C0A; --amber-l:#FBF1DF;
  --r-red:#B23A2E; --r-orange:#C96A1E; --r-yellow:#B58800; --r-green:#1C7550; --r-blue:#1B5FA8;
  --paper:#FFFFFF;
  --line:1px solid var(--steel-200);
  --sans:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Barlow',-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans); background:var(--steel-50); color:var(--ink);
  font-size:16px; line-height:1.55; letter-spacing:.005em;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{max-width:1140px;margin:0 auto;padding:0 22px}
.shell-narrow{max-width:760px;margin:0 auto;padding:0 22px}
.topbar{
  background:var(--paper);border-bottom:var(--line);position:sticky;top:0;z-index:40;
}
.topbar-in{display:flex;align-items:center;gap:16px;height:58px}
.brand{display:flex;align-items:baseline;gap:9px;text-decoration:none;color:inherit}
.brand-mark{
  font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.06em;
  color:var(--blue);border:2px solid var(--blue);padding:0 7px;line-height:1.25;
}
.brand-txt{font-size:13.5px;color:var(--ink-3);font-weight:500}
.topbar-sp{flex:1}
.tlink{
  font-size:14px;font-weight:600;color:var(--ink-2);padding:7px 12px;border:var(--line);
  background:var(--paper);
}
.tlink:hover{background:var(--steel-75);color:var(--blue)}
.tlink.on{background:var(--blue);border-color:var(--blue);color:#fff}

/* ---------- type ---------- */
h1{font-family:var(--cond);font-weight:600;font-size:clamp(34px,5.6vw,58px);line-height:1.02;letter-spacing:-.005em}
h2{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.12}
h3{font-family:var(--sans);font-weight:600;font-size:17px;line-height:1.3}
.lede{font-size:18px;color:var(--ink-2);max-width:62ch}
.sub{font-size:14.5px;color:var(--ink-3)}
.tiny{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.num{font-family:var(--cond);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- hero ---------- */
.hero{padding:64px 0 42px}
.hero h1{max-width:15ch}
.hero-sub{font-family:var(--cond);font-size:clamp(19px,2.6vw,26px);font-weight:500;color:var(--blue);margin-top:10px}
.hero p.lede{margin-top:22px}

/* calibrated scale (hero device) */
.gauge{margin:44px 0 8px;border-top:2px solid var(--ink);padding-top:0}
.gauge-ticks{display:flex;height:26px;align-items:flex-start}
.gauge-tick{flex:1;border-left:1px solid var(--steel-300);height:8px;position:relative}
.gauge-tick.major{height:15px;border-left:1px solid var(--ink)}
.gauge-tick.major::after{
  content:attr(data-v);position:absolute;top:17px;left:-9px;font-family:var(--cond);
  font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums
}
.gauge-bands{display:flex;gap:3px;margin-top:16px}
.gauge-band{padding:9px 10px 10px;border-top:4px solid;background:var(--paper);border-right:var(--line);border-bottom:var(--line);border-left:var(--line)}
.gauge-band b{display:block;font-family:var(--cond);font-size:16px;font-weight:600;letter-spacing:.02em}
.gauge-band span{font-size:11.5px;color:var(--ink-3);line-height:1.3;display:block;margin-top:2px}
.gb0{border-top-color:var(--r-red);flex:39}
.gb1{border-top-color:var(--r-orange);flex:20}
.gb2{border-top-color:var(--r-yellow);flex:15}
.gb3{border-top-color:var(--r-green);flex:15}
.gb4{border-top-color:var(--r-blue);flex:11}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  background:var(--blue);color:#fff;font-weight:600;font-size:15.5px;
  padding:13px 26px;border:2px solid var(--blue);
}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:disabled{background:var(--steel-200);border-color:var(--steel-200);color:var(--steel-500);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--blue);border-color:var(--steel-200)}
.btn-ghost:hover{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
.btn-sm{padding:8px 15px;font-size:14px;border-width:1px}
.btn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px}

/* ---------- panels ---------- */
.panel{background:var(--paper);border:var(--line)}
.panel-h{padding:14px 18px;border-bottom:var(--line);display:flex;align-items:center;gap:12px}
.panel-h h2,.panel-h h3{flex:1}
.panel-b{padding:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.g2,.g3,.g4{grid-template-columns:1fr}}

.dimlist{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:34px;border-top:var(--line)}
.dimrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:var(--line)}
.dimrow b{font-family:var(--cond);font-size:15px;color:var(--blue);width:42px;flex:none;font-variant-numeric:tabular-nums}
.dimrow span{flex:1;font-size:14.5px}
.dimrow i{font-style:normal;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media(max-width:700px){.dimlist{grid-template-columns:1fr}}

/* ---------- form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--steel-200);background:var(--paper);
  font-size:15px;border-radius:0
}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none;box-shadow:inset 0 -2px 0 var(--blue)}
.req::after{content:' *';color:var(--r-red)}

/* ---------- assessment ---------- */
.prog{background:var(--paper);border-bottom:var(--line);position:sticky;top:58px;z-index:30}
.prog-in{padding:11px 0 12px}
.prog-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-3);margin-bottom:7px}
.prog-meta b{font-family:var(--cond);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.prog-seg{display:flex;gap:2px;height:6px}
.seg{flex:1;background:var(--steel-100)}
.seg.done{background:var(--blue)}
.seg.now{background:var(--amber)}

.qwrap{padding:34px 0 60px}
.qtag{
  display:inline-block;font-family:var(--cond);font-size:13.5px;font-weight:600;letter-spacing:.04em;
  color:var(--blue);border-left:3px solid var(--blue);padding-left:8px;margin-bottom:14px
}
.qcase{
  background:var(--steel-75);border-left:3px solid var(--steel-300);padding:14px 16px;
  font-size:15.5px;color:var(--ink-2);margin-bottom:18px
}
.qtext{font-size:19.5px;font-weight:600;line-height:1.35;margin-bottom:6px;max-width:44ch}
.qhint{font-size:13.5px;color:var(--ink-3);margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:13px;align-items:flex-start;background:var(--paper);border:1px solid var(--steel-200);
  padding:14px 16px;text-align:left;font-size:15.5px;line-height:1.45;width:100%;
  transition:border-color .12s,background .12s
}
.opt:hover{border-color:var(--blue);background:var(--blue-l)}
.opt-k{
  flex:none;width:24px;height:24px;border:1px solid var(--steel-300);display:flex;align-items:center;
  justify-content:center;font-family:var(--cond);font-size:14px;font-weight:600;color:var(--ink-3);margin-top:1px
}
.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.opt.sel .opt-k{background:var(--blue);border-color:var(--blue);color:#fff}
.opt-t{flex:1}

.lik{display:flex;gap:6px;margin-top:4px}
.lik button{
  flex:1;border:1px solid var(--steel-200);background:var(--paper);padding:12px 4px;text-align:center;
  font-family:var(--cond);font-size:20px;font-weight:600
}
.lik button:hover{border-color:var(--blue);background:var(--blue-l)}
.lik button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.lik-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px}

.qblock{border-bottom:var(--line);padding-bottom:26px;margin-bottom:26px}
.qblock:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.navrow{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}
.navrow .sp{flex:1}

/* ---------- results ---------- */
.res-hero{background:var(--paper);border:var(--line);border-top:4px solid var(--blue)}
.res-top{display:flex;flex-wrap:wrap;gap:0;border-bottom:var(--line)}
.res-id{padding:22px 24px;flex:1;min-width:260px}
.res-id h2{font-size:34px}
.res-score{
  padding:22px 24px;border-left:var(--line);min-width:210px;display:flex;gap:18px;align-items:center
}
.bigscore{font-family:var(--cond);font-size:76px;font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}
.bigscore em{font-size:26px;font-style:normal;color:var(--ink-3)}
.lvl{font-family:var(--cond);font-size:19px;font-weight:600;letter-spacing:.03em}
.dot{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:1px}
@media(max-width:760px){.res-score{border-left:none;border-top:var(--line);width:100%}}

.res-cells{display:grid;grid-template-columns:repeat(4,1fr)}
.cell{padding:16px 20px;border-right:var(--line)}
.cell:last-child{border-right:none}
.cell .k{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.cell .v{font-family:var(--cond);font-size:22px;font-weight:600;line-height:1.15;margin-top:3px}
@media(max-width:860px){.res-cells{grid-template-columns:1fr 1fr}.cell{border-bottom:var(--line)}}

.alert{border-left:4px solid var(--r-red);background:#FCF2F0;padding:14px 16px;margin-top:16px}
.alert.warn{border-left-color:var(--amber);background:var(--amber-l)}
.alert h3{font-size:15px;margin-bottom:5px}
.alert ul{margin:6px 0 0 18px;font-size:14.5px}

.bars{display:flex;flex-direction:column;gap:11px}
.bar-r{display:grid;grid-template-columns:150px 1fr 46px;gap:12px;align-items:center}
.bar-r .nm{font-size:14px;font-weight:500}
.bar-r .nm em{font-style:normal;color:var(--ink-3);font-size:12px;display:block}
.bar-t{height:16px;background:var(--steel-100);position:relative}
.bar-f{height:100%}
.bar-t .mark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3);opacity:.5}
.bar-r .vv{font-family:var(--cond);font-size:19px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:600px){.bar-r{grid-template-columns:110px 1fr 40px}}

.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:var(--line);font-size:14.5px}
.chk:last-child{border-bottom:none}
.chk .m{flex:none;width:20px;font-family:var(--cond);font-size:17px;font-weight:700;text-align:center}
.m-ok{color:var(--r-green)}.m-pa{color:var(--amber)}.m-no{color:var(--r-red)}
.chk .d{flex:1}
.chk .d em{font-style:normal;display:block;font-size:12.5px;color:var(--ink-3)}

.ol{counter-reset:n;list-style:none}
.ol li{counter-increment:n;padding:12px 0 12px 40px;border-bottom:var(--line);position:relative;font-size:14.5px}
.ol li:last-child{border-bottom:none}
.ol li::before{
  content:counter(n);position:absolute;left:0;top:12px;font-family:var(--cond);font-weight:600;
  font-size:15px;width:24px;height:24px;border:1px solid var(--steel-300);display:flex;
  align-items:center;justify-content:center;color:var(--ink-3)
}
.ol li b{display:block;font-size:15.5px;margin-bottom:2px}
.ol li span{color:var(--ink-2)}

.plan-col{border-top:3px solid var(--blue);background:var(--paper);border-left:var(--line);border-right:var(--line);border-bottom:var(--line);padding:16px}
.plan-col h3{font-family:var(--cond);font-size:20px;margin-bottom:10px}
.plan-col ul{list-style:none}
.plan-col li{padding:7px 0 7px 16px;border-bottom:var(--line);font-size:14px;position:relative}
.plan-col li:last-child{border-bottom:none}
.plan-col li::before{content:'';position:absolute;left:0;top:15px;width:7px;height:1px;background:var(--blue)}
.plan-col li.gap::before{background:var(--amber);height:3px;top:14px}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{
  text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-3);padding:10px 12px;
  border-bottom:2px solid var(--steel-200);white-space:nowrap;cursor:pointer;user-select:none
}
.tbl th:hover{color:var(--blue)}
.tbl td{padding:11px 12px;border-bottom:var(--line);vertical-align:middle}
.tbl tr:hover td{background:var(--steel-50)}
.tbl .nmc{font-weight:600}
.tbl .idx{font-family:var(--cond);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 8px;border:1px solid;white-space:nowrap}
.tbl-scroll{overflow-x:auto}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{margin-bottom:0}
.filters select,.filters input{min-width:150px;padding:8px 10px;font-size:14px}

.cmp-tbl td.lab{font-weight:500;color:var(--ink-2);width:190px}
.cmp-cell{position:relative;padding-right:44px!important}
.cmp-bar{position:absolute;left:12px;right:12px;bottom:6px;height:3px;background:var(--steel-100)}
.cmp-bar i{display:block;height:100%}
.cmp-v{position:absolute;right:12px;top:9px;font-family:var(--cond);font-weight:600;font-size:17px}
.best{box-shadow:inset 3px 0 0 var(--r-green)}

/* ---------- question bank ---------- */
.qb-item{border:var(--line);background:var(--paper);margin-bottom:8px}
.qb-h{display:flex;gap:12px;align-items:baseline;padding:12px 14px;width:100%;text-align:left}
.qb-h .qid{font-family:var(--cond);font-weight:600;color:var(--blue);width:44px;flex:none}
.qb-h .qq{flex:1;font-size:14.5px}
.qb-b{padding:0 14px 14px 70px;font-size:14px}
.qb-b .sc{display:flex;gap:10px;padding:6px 0;border-bottom:var(--line)}
.qb-b .sc b{font-family:var(--cond);font-size:16px;width:38px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.qb-just{background:var(--blue-l);border-left:3px solid var(--blue);padding:10px 12px;margin-top:12px;font-size:13.5px}

/* ---------- misc ---------- */
.sect{padding:26px 0}
.sect-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;border-bottom:2px solid var(--ink);padding-bottom:7px}
.sect-h h2{flex:1}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3);border:1px dashed var(--steel-300);background:var(--paper)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.foot{padding:30px 0 46px;color:var(--ink-3);font-size:13px;border-top:var(--line);margin-top:40px}
.rank-n{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{font-size:13px;color:var(--ink-3);margin-top:10px;max-width:70ch}

/* ---------- print ---------- */
@media print{
  body{background:#fff;font-size:11pt}
  /* El plan de 30/60/90 se partía entre páginas y las columnas quedaban
     separadas de su encabezado. Cada bloque se mantiene entero. */
  .plan-col, .grid, .ol li, .chk, .bar-r, .alert{break-inside:avoid}
  .sect-h, .panel-h{break-after:avoid}
  .sect{break-inside:auto}
  .panel{break-inside:avoid-page}
  .topbar,.no-print{display:none!important}
  .shell{max-width:100%;padding:0}
  .panel,.res-hero{break-inside:avoid;border-color:#999}
  .sect{padding:10px 0}
  .page-break{break-before:page}
}

/* ---------- editor ---------- */
.ed-head{background:var(--paper);border:var(--line);border-top:4px solid var(--blue);padding:18px 20px;margin-bottom:0}
.ed-title{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ed-title h2{font-size:30px;flex:1;min-width:240px}
.ed-meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.ed-meta span{font-size:13px;color:var(--ink-3)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border:1px solid;letter-spacing:.02em}
.b-draft{color:var(--amber);border-color:var(--amber);background:var(--amber-l)}
.b-pub{color:var(--r-green);border-color:var(--r-green);background:#EEF6F2}
.b-arc{color:var(--steel-500);border-color:var(--steel-300);background:var(--steel-75)}
.b-live{color:#fff;border-color:var(--blue);background:var(--blue)}

.tabs{display:flex;gap:0;border-bottom:2px solid var(--steel-200);background:var(--paper);border-left:var(--line);border-right:var(--line);overflow-x:auto}
.tabs button{padding:12px 18px;font-size:14.5px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap;margin-bottom:-2px}
.tabs button:hover{color:var(--blue)}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabpanel{background:var(--paper);border:var(--line);border-top:none;padding:20px}

.savebar{position:sticky;bottom:0;z-index:20;background:var(--paper);border:var(--line);border-top:2px solid var(--blue);
  padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:0}
.savebar .sp{flex:1}
.dirty{color:var(--amber);font-weight:600;font-size:13.5px}

.et{width:100%;border-collapse:collapse;font-size:14px}
.et th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 8px;border-bottom:2px solid var(--steel-200)}
.et td{padding:6px 8px;border-bottom:var(--line);vertical-align:top}
.et input[type=text],.et input[type=number],.et select,.et textarea{
  width:100%;padding:6px 8px;border:1px solid var(--steel-200);background:var(--paper);font-size:14px}
.et input:focus,.et select:focus,.et textarea:focus{border-color:var(--blue);outline:none}
.et textarea{resize:vertical;min-height:52px;line-height:1.4}
.et .w60{width:74px}.et .w90{width:96px}
.et tr:hover td{background:var(--steel-50)}
.rowdel{color:var(--r-red);font-weight:700;font-size:16px;padding:2px 8px;line-height:1}
.rowdel:hover{background:#FCF2F0}

.itemrow{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:var(--line);margin-bottom:6px;background:var(--paper)}
.itemrow.off{background:var(--steel-50);opacity:.62}
.itemrow .iid{font-family:var(--cond);font-weight:600;color:var(--blue);width:46px;flex:none;font-size:15px}
.itemrow .iq{flex:1;font-size:14.5px;line-height:1.4;cursor:pointer;text-align:left}
.itemrow .iq em{font-style:normal;display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.itemrow .iacts{display:flex;gap:6px;flex:none;align-items:center}

.sw{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-3);cursor:pointer;user-select:none}
.sw i{width:30px;height:17px;background:var(--steel-200);position:relative;display:block;flex:none;transition:background .15s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;background:#fff;transition:left .15s}
.sw.on i{background:var(--r-green)}
.sw.on i::after{left:15px}

/* ============================================================
   MÓDULO 4 — MOTOR DE PUNTUACIÓN
   Ponderado + requisitos mínimos + banderas críticas.
   No utiliza edad, sexo, estado civil, origen ni ninguna
   variable ajena a las funciones del puesto.
   ============================================================ */
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const R = n => Math.round(n);
const listEs = a => a.length<2 ? (a[0]||'') : a.slice(0,-1).join(', ')+' y '+a[a.length-1];

function scoreQuestion(q, ans){
  if(ans===undefined || ans===null) return null;
  switch(q.type){
    case 'scenario': case 'technical':
      return q.opts[ans] ? q.opts[ans].s : null;
    case 'likert':
      return (ans-1)*25;
    case 'multi':{
      const pos = q.opts.filter(o=>o.p>0).sort((a,b)=>b.p-a.p);
      if(!pos.length) return null;
      const best = pos.slice(0, q.max||pos.length).reduce((s,o)=>s+o.p,0);
      let got = 0;
      ans.forEach(i=>{ if(q.opts[i]) got += q.opts[i].p; });
      const over = Math.max(0, ans.length - (q.max||99));
      return clamp(R(got/best*100) - over*8, 0, 100);
    }
    case 'ranking':{
      const n = q.opts.length;
      if(n<2) return null;
      let disp = 0;
      ans.forEach((oi, pos)=>{ if(q.opts[oi]) disp += Math.abs(q.opts[oi].r - (pos+1)); });
      const maxDisp = Math.floor(n*n/2);
      return clamp(R((1 - disp/maxDisp)*100), 0, 100);
    }
  }
  return null;
}

function reqValue(row, dims, perQ, profile){
  const s = row.src || {};
  if(s.type==='operativo')
    return (profile.licencia==='Sí' && profile.viajar!=='No' && profile.campo!=='No') ? 100 : 0;
  if(s.type==='dim') return dims[s.dim] ?? 0;
  const v = (s.ids||[]).map(i=>perQ[i]).filter(x=>x!==null && x!==undefined);
  if(v.length) return R(v.reduce((a,b)=>a+b,0)/v.length);
  return s.fallback ? (dims[s.fallback] ?? 0) : 0;
}

function runScoring(profile, answers, ins){
  const I = ins || INS;
  const dimsDef = I.dims, items = I.items.filter(i=>i.active!==false);
  const perQ = {}, flags = [];
  items.forEach(q=>{
    const s = scoreQuestion(q, answers[q.id]);
    perQ[q.id] = s;
    if((q.type==='scenario'||q.type==='technical') && typeof answers[q.id]==='number'){
      const o = q.opts[answers[q.id]];
      if(o && o.flag) flags.push({id:q.id, dim:q.dim, txt:o.t});
    }
  });

  const dims = {};
  dimsDef.forEach(d=>{
    let num=0, den=0;
    items.filter(q=>q.dim===d.id).forEach(q=>{
      if(perQ[q.id]!==null && perQ[q.id]!==undefined){ num += perQ[q.id]*(q.w||1); den += (q.w||1); }
    });
    dims[d.id] = den ? R(num/den) : 0;
  });

  const wsum = dimsDef.reduce((s,d)=>s+(d.w||0),0) || 1;
  const index = R(dimsDef.reduce((s,d)=>s + dims[d.id]*(d.w||0), 0) / wsum);

  /* banderas críticas */
  const alerts = [];
  if(flags.length) alerts.push({lvl:'crit', t:'Respuesta de riesgo ético',
    d:'El candidato eligió al menos una acción que compromete la integridad profesional ('+flags.map(f=>f.id).join(', ')+'). Esta señal se evalúa por separado del promedio.'});
  const hardRules = (I.hardRules) || [
    {dim:'etica', below:60, t:'Ética'}, {dim:'comunicacion', below:50, t:'Comunicación'}, {dim:'consultiva', below:45, t:'Venta consultiva'}
  ];
  const hardHit = [];
  hardRules.forEach(hr=>{
    if(dims[hr.dim]!==undefined && dims[hr.dim] < hr.below){
      hardHit.push(hr);
      alerts.push({lvl:'crit', t:hr.t+' por debajo del umbral de corte ('+hr.below+')',
        d:'Obtuvo '+dims[hr.dim]+'. Es una competencia indispensable y no se compensa con el resto del perfil.'});
    }
  });
  dimsDef.filter(d=>d.crit).forEach(d=>{
    if(dims[d.id] < d.min && !hardHit.some(h=>h.dim===d.id))
      alerts.push({lvl:'warn', t:d.short+' por debajo del mínimo del puesto ('+d.min+')',
        d:'Obtuvo '+dims[d.id]+'. Competencia crítica: requiere validación específica en entrevista.'});
  });

  const mark = r => ({...r, st: r.v>=r.min ? 'ok'
    : (r.src && r.src.type==='operativo' ? 'no' : (r.v>=r.min-15 ? 'pa' : 'no'))});
  const BASIC = (I.basic||[]).map(r=>mark({...r, v:reqValue(r,dims,perQ,profile), bin:r.src&&r.src.type==='operativo'}));
  const IDEAL = (I.ideal||[]).map(r=>mark({...r, v:reqValue(r,dims,perQ,profile)}));
  const basicOk = BASIC.filter(r=>r.st==='ok').length;
  const idealOk = IDEAL.filter(r=>r.st==='ok').length;
  const basicPct = BASIC.length ? basicOk/BASIC.length : 1;

  const g = id => dims[id] ?? index;
  let prof;
  if(g('consultiva')>=78 && g('prospeccion')>=72 && g('pipeline')>=72 && g('comunicacion')>=75 && index>=78) prof='D';
  else if(g('consultiva')>=68 && g('tecnica')>=58 && g('negociacion')>=58 && index>=66) prof='C';
  else if(index>=56 && g('prospeccion')>=52 && g('consultiva')>=55) prof='B';
  else prof='A';

  const trainRaw = R(g('aprendizaje')*.30 + (perQ.A02 ?? g('aprendizaje'))*.15 + g('organizacion')*.15 +
                     g('etica')*.15 + g('tecnica')*.10 + g('resultados')*.15);
  const trainKey = trainRaw>=82?'Muy alto': trainRaw>=68?'Alto': trainRaw>=52?'Medio':'Bajo';

  const critFail = dimsDef.filter(d=>d.crit && dims[d.id] < d.min).length;
  const hard = flags.length>0 || hardHit.length>0;
  const risk = hard || critFail>=3 ? 'Alto' : (critFail>=1 || index<60 ? 'Moderado' : 'Bajo');

  let dec;
  if(hard) dec='NO';
  else if(index<40 || critFail>=3) dec='NO';
  else if(critFail>=1 || index<60 || basicPct<0.8) dec='RES';
  else if(index>=90 || (index>=82 && prof==='D' && (trainKey==='Alto'||trainKey==='Muy alto') && idealOk>=Math.ceil(IDEAL.length*0.6))) dec='POT';
  else if(index>=75) dec='ALTO';
  else dec='SI';

  const ranked = dimsDef.map(d=>({...d, v:dims[d.id]})).sort((a,b)=>b.v-a.v);
  const strengths = ranked.filter(d=>d.v>=60).slice(0,3).map(d=>({t:d.short, v:d.v, d:d.strength||''}));
  const gaps = [...ranked].reverse().filter(d=>d.v<78).slice(0,3).map(d=>({t:d.short, v:d.v, d:d.gap||''}));

  const cons = consistency(perQ, I);
  const probes = [];
  if(flags.length) probes.push('Revisar directamente la respuesta de riesgo ético detectada ('+flags.map(f=>f.id).join(', ')+'): pedir que explique su razonamiento y qué haría hoy de forma distinta.');
  gaps.forEach(gp=>{ const d = dimsDef.find(x=>x.short===gp.t); if(d && d.probe) probes.push(d.probe); });
  if(cons.idx < 70) probes.push('El índice de consistencia es bajo: hay diferencia notable entre lo que el candidato declara de sí mismo y las decisiones que eligió. Contrastar con ejemplos concretos y verificables.');
  if(prof==='A' && index>=60) probes.push('El perfil resulta competente pero transaccional. Explorar si ha trabajado alguna vez con objetivo de desarrollo de cuenta y no solo de atención de pedidos.');
  let gi = ranked.length-1;
  while(probes.length<3 && gi>=0){ const d=ranked[gi--]; if(d.probe && !probes.includes(d.probe)) probes.push(d.probe); }

  const low = id => (dims[id] ?? 100) < 70;
  const plan = {};
  ['d30','d60','d90'].forEach(k=>{
    plan[k] = ((I.plan&&I.plan[k])||[]).map(i=>({t:i.t, g: !!(i.dim && low(i.dim))}));
  });

  return {dims, index, perQ, alerts, flags, BASIC, IDEAL, basicOk, idealOk,
          prof, trainRaw, trainKey, risk, dec, strengths, gaps,
          probes: probes.slice(0,5), plan, consistency:cons};
}

/* Índice de consistencia: contrasta autoevaluación contra decisiones observadas.
   Informativo. Nunca se usa por sí solo para descartar a una persona. */
function consistency(perQ, ins){
  const pairs = (ins && ins.consPairs) || [];
  const det = []; let acc = 0, n = 0;
  pairs.forEach(p=>{
    const s = perQ[p.self];
    const b = (p.beh||[]).map(i=>perQ[i]).filter(v=>v!==null && v!==undefined);
    if(s===null || s===undefined || !b.length) return;
    const bm = b.reduce((a,c)=>a+c,0)/b.length;
    const gapv = Math.abs(s-bm);
    det.push({n:p.n, self:R(s), beh:R(bm), gap:R(gapv)});
    acc += gapv; n++;
  });
  return {idx: n ? clamp(R(100 - (acc/n)*1.1), 0, 100) : 100, det};
}

/* ---- Supabase por REST (PostgREST + GoTrue), sin SDK ---- */
async function sbFetch(path, opts, _retried){
  if(!CFG.url || !CFG.anonKey) throw new Error('Falta la URL del proyecto o la clave anónima.');
  /* Los tokens de Supabase caducan en una hora. Se renuevan antes de usarlos,
     salvo en las rutas de autenticación para no entrar en recursión. */
  if(path.indexOf('/auth/v1/') !== 0) await ensureSession();
  const base = CFG.url.replace(/\/+$/,'');
  /* Las llaves nuevas (sb_publishable_) no son JWT: mandarlas como Bearer
     hace que el gateway las rechace. Solo se manda Bearer cuando hay sesión
     o cuando la llave sí es un JWT heredado. */
  const bearer = (SESSION && SESSION.access_token) || (/^eyJ/.test(CFG.anonKey) ? CFG.anonKey : null);
  const base_headers = {apikey: CFG.anonKey, 'Content-Type': 'application/json'};
  if(bearer) base_headers.Authorization = 'Bearer ' + bearer;
  let res;
  try{
    res = await fetch(base + path, Object.assign({}, opts,
      {headers: Object.assign(base_headers, (opts && opts.headers) || {})}));
  }catch(e){
    throw new Error('sin respuesta. Revisa que la URL esté bien escrita y que haya conexión a internet.');
  }
  const txt = await res.text();
  let data = null;
  try{ data = txt ? JSON.parse(txt) : null; }catch(e){ data = txt; }
  if(!res.ok){
    const m = (data && (data.message || data.msg || data.error_description ||
               (typeof data.error === 'string' ? data.error : null) || data.hint)) || ('HTTP ' + res.status);
    const code = data && (data.error_code || data.code);
    const full = code ? m + ' [' + code + ']' : m;
    if(!_retried && isExpired(full) && SESSION && SESSION.refresh_token){
      try{ await DB.refresh(); return sbFetch(path, opts, true); }
      catch(e){ throw new Error('Tu sesión expiró. Vuelve a iniciar sesión.'); }
    }
    throw new Error(full);
  }
  return data;
}
const rpc = (fn, args) => sbFetch('/rest/v1/rpc/' + fn, {method:'POST', body: JSON.stringify(args||{})});

const isExpired = m => /jwt expired|pgrst303|token is expired|invalid refresh token/i.test(String(m||''));

/* Renueva el token si le quedan menos de dos minutos de vida */
async function ensureSession(){
  if(!SESSION || !SESSION.refresh_token) return;
  const exp = SESSION.expires_at ? SESSION.expires_at * 1000 : 0;
  if(exp && Date.now() < exp - 120000) return;
  try{ await DB.refresh(); }catch(e){ /* el reintento de sbFetch decide qué hacer */ }
}
function stampSession(d){
  if(d && !d.expires_at && d.expires_in) d.expires_at = Math.floor(Date.now()/1000) + d.expires_in;
  return d;
}

/* Traduce los fallos de autenticación a la acción concreta que los resuelve */
function authError(msg){
  const m = String(msg||'').toLowerCase();
  if(m.includes('email_provider_disabled') || m.includes('email logins are disabled') ||
     m.includes('provider is not enabled') || m.includes('email signin is disabled'))
    return 'El inicio de sesión con correo está desactivado en Supabase. Entra a Authentication → Sign In / Providers → Email y enciende el proveedor. Deja apagado solo "Allow new users to sign up".';
  if(m.includes('invalid_credentials') || m.includes('invalid login credentials'))
    return 'Correo o contraseña incorrectos. Si no recuerdas la contraseña, en Authentication → Users puedes cambiarla desde los tres puntos del usuario.';
  if(m.includes('email_not_confirmed') || m.includes('email not confirmed'))
    return 'La cuenta existe pero no está confirmada. En Authentication → Users, abre el usuario y confírmalo, o créalo de nuevo marcando "Auto Confirm User".';
  if(m.includes('signup_disabled') || m.includes('signups not allowed'))
    return 'El registro está cerrado, que es lo correcto. Crea la cuenta desde Authentication → Users → Add user.';
  if(m.includes('over_request_rate_limit') || m.includes('rate limit'))
    return 'Demasiados intentos seguidos. Espera un minuto y vuelve a probar.';
  if(m.includes('user_banned'))
    return 'La cuenta está bloqueada en Supabase. Revísala en Authentication → Users.';
  return msg;
}

/* Traduce los mensajes de Supabase a la causa real */
function diagnose(msg){
  const m = String(msg||'').toLowerCase();
  if(m.includes('secret api key')) return 'secreta';
  if(m.includes('invalid api key') || m.includes('no api key') || m.includes('invalid jwt')) return 'llave';
  if(m.includes('pgrst202') || m.includes('could not find the function') || m.includes('schema cache')) return 'esquema';
  if(m.includes('permission denied') || m.includes('jwt expired')) return 'permisos';
  return null;
}

    try{
      const d = stampSession(await sbFetch('/auth/v1/token?grant_type=refresh_token',
        {method:'POST', body: JSON.stringify({refresh_token: prev.refresh_token})}));

  async pending(){ return LS.get('isel:pending', []); },
  async queue(rec){
    const all = await DB.pending();
    if(!all.some(r=>r.id===rec.id)) all.push(rec);
    await LS.set('isel:pending', all);
    return all;
  },
  async flushPending(){
    const all = await DB.pending();
    if(!all.length) return {sent:0, left:0, error:''};
    const left = [];
    let sent = 0, error = '';
    for(const rec of all){
      try{
        if(rec._inviteToken) await DB.submitInvite(rec._inviteToken, rec);
        else await DB.saveCandidate(rec);
        sent++;
      }catch(e){ left.push(rec); error = e.message; }
    }
    await LS.set('isel:pending', left);
    return {sent, left: left.length, error};
  },

function buildRecord(profile, answers, ins){
  const I = ins || INS;
  const r = runScoring(profile, answers, I);
  const rec = {
    id: 'C'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    candidateId: 'K'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    createdAt: new Date().toISOString(),
    puesto: I.name,
    version: I.version,
    instrumentId: I.id,
    dimsDef: I.dims.map(d=>({id:d.id, short:d.short, n:d.n, w:d.w, min:d.min, crit:d.crit})),
    profile, answers, shuffle: (S && S.shuffle) || null,
    consent: (I.privacy && I.privacy.enabled)
      ? {accepted: !!(S && S.consent), at: new Date().toISOString(), aviso: (I.privacy.text||'').slice(0,400)}
      : null,
    result: r
  };
  rec.level = levelOf(r.index).k;
  rec.narrative = narrative(rec);
  return rec;
}

function demoAnswers(bias, ins){
  const a = {}, items = (ins||INS).items.filter(i=>i.active!==false);
  const noise = () => (Math.random()-0.5)*26;
  items.forEach(q=>{
    const target = clamp(bias*100 + noise(), 0, 100);
    if(q.type==='likert'){ a[q.id] = clamp(Math.round(1 + target/25), 1, 5); return; }
    if(q.type==='multi'){
      const good = q.opts.map((o,i)=>({o,i})).filter(x=>x.o.p>0).sort((x,y)=>y.o.p-x.o.p);
      const bad  = q.opts.map((o,i)=>({o,i})).filter(x=>x.o.p<0);
      const k = clamp(Math.round(good.length*(0.35 + target/100*0.65)), 1, q.max||good.length);
      const sel = good.slice(0,k).map(x=>x.i);
      if(bad.length && Math.random() > target/100) sel.push(bad[Math.floor(Math.random()*bad.length)].i);
      a[q.id] = sel; return;
    }
    if(q.type==='ranking'){
      const ord = q.opts.map((o,i)=>({i,r:o.r})).sort((x,y)=>x.r-y.r).map(x=>x.i);
      const swaps = Math.round((1-target/100)*3);
      for(let s=0;s<swaps;s++){ const j=Math.floor(Math.random()*(ord.length-1)); [ord[j],ord[j+1]]=[ord[j+1],ord[j]]; }
      a[q.id] = ord; return;
    }
    let bi=0, bd=1e9;
    q.opts.forEach((o,i)=>{ const d=Math.abs(o.s-target); if(d<bd){ bd=d; bi=i; } });
    a[q.id] = bi;
  });
  return a;
}

async function bootstrap(){
  await DB.loadConfig();
  let ins = [];
  try{ ins = await DB.listInstruments(); }
  catch(e){ DB.lastError = e.message; }

  if(!ins.length){
    const b = baseInstrument();
    ins = [b];
    try{ await DB.saveInstrument(b); }catch(e){ DB.lastError = e.message; }
  }
  const active = ins.find(i=>i.id===S.activeIns) || ins.find(i=>i.status==='publicada') || ins[0];
  useInstrument(active);
  S.activeIns = active.id;

  let cands = [];
  try{ cands = await DB.listCandidates(); }
  catch(e){ DB.lastError = e.message; }

  /* Los datos ficticios solo se generan en modo local: nunca se
     escriben en una base real. */
  if(!cands.length && !DB.remote){
    cands = DEMO_PEOPLE.map((p,k)=>{
      const {bias, ...prof} = p;
      const rec = buildRecord(prof, demoAnswers(bias, active), active);
      rec.createdAt = new Date(Date.now() - (k*6+2)*86400000).toISOString();
      return rec;
    });
    await LS.set('isel:candidates', cands);
  }
  return {ins, cands};
}

/* Orden aleatorio de opciones.
   Las respuestas se guardan SIEMPRE con el índice original del banco, así que
   revolver solo afecta lo que ve el candidato: puntuación, análisis y comparación
   entre candidatos siguen siendo idénticos. */
function buildShuffle(ins){
  const map = {};
  (ins.items||[]).forEach(q=>{
    if(q.type==='likert' || !q.opts) return;
    const idx = q.opts.map((_,i)=>i);
    if(ins.shuffleOptions === false){ map[q.id] = idx; return; }
    for(let i=idx.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idx[i],idx[j]] = [idx[j],idx[i]];
    }
    map[q.id] = idx;
  });
  return map;
}
const displayOrder = q => (S.shuffle && S.shuffle[q.id]) || q.opts.map((_,i)=>i);

function radar(dimsScores, series, defs){
  const D = defs || DIMS, N = D.length;
  if(N<3) return `<p class="sub">Se necesitan al menos 3 dimensiones para dibujar el radar.</p>`;
  const cx=230, cy=170, R0=118;
  const pt=(i,v)=>{ const a=-Math.PI/2 + i*2*Math.PI/N, r=R0*clamp(v,0,100)/100; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  let g='';
  [25,50,75,100].forEach(l=>{ g += `<polygon points="${D.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--steel-200)" stroke-width="1"/>`; });
  D.forEach((d,i)=>{
    const [x,y]=pt(i,100);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--steel-200)"/>`;
    const [lx,ly]=pt(i,132);
    const anch = lx>cx+6?'start': lx<cx-6?'end':'middle';
    g += `<text x="${lx}" y="${ly+4}" text-anchor="${anch}" font-size="11.5" font-weight="600" fill="var(--ink-2)" font-family="Barlow,sans-serif">${esc(d.short)}</text>`;
  });
  const ss = series || [{dims:dimsScores, c:'var(--blue)'}];
  ss.forEach(s=>{
    const p = D.map((d,i)=>pt(i, s.dims[d.id]||0).join(',')).join(' ');
    g += `<polygon points="${p}" fill="${s.c}" fill-opacity="${ss.length>1?.10:.16}" stroke="${s.c}" stroke-width="2"/>`;
    if(ss.length===1) D.forEach((d,i)=>{ const [x,y]=pt(i,s.dims[d.id]||0); g+=`<circle cx="${x}" cy="${y}" r="3.2" fill="${s.c}"/>`; });
  });
  return `<svg viewBox="0 0 460 345" width="100%" role="img" aria-label="Perfil de competencias">${g}</svg>`;
}

function narrative(rec){
  const r = rec.result, lv = levelOf(r.index), nm = (rec.profile.nombre||'El candidato').split(' ')[0];
  const st = listEs(r.strengths.map(x=>x.t.toLowerCase()));
  const gp = listEs(r.gaps.map(x=>x.t.toLowerCase()));
  const hasGaps = r.gaps.length>0;
  const devGaps = r.gaps.filter(g=>['Técnica','Pipeline','Negociación','Organización'].includes(g.t)).length;
  if(r.dec==='NO')
    return `${nm} obtuvo ${r.index}/100 (${lv.k.toLowerCase()}). `+
      (r.flags.length? 'Se detectó al menos una decisión que compromete la integridad profesional, lo cual pesa por encima del promedio general. '
       : 'Las brechas se ubican en competencias indispensables, no entrenables en el corto plazo. ')+
      `Las principales corresponden a ${gp||'varias dimensiones'}. Se recomienda no avanzar en el proceso para este puesto; el perfil podría revisarse para posiciones de menor exposición al cliente.`;
  if(r.dec==='RES')
    return `${nm} obtuvo ${r.index}/100 (${lv.k.toLowerCase()}) y cubre ${r.basicOk} de los ${r.BASIC.length} requisitos básicos del puesto. `+
      `Muestra bases utilizables en ${st||'algunas dimensiones'}, pero presenta brechas relevantes en ${gp||'varias dimensiones'}. `+
      `Puede continuar en el proceso siempre que la entrevista verifique de forma directa esos puntos; su potencial de desarrollo es ${r.trainKey.toLowerCase()}.`;
  return `${nm} obtuvo ${r.index}/100 (${lv.k.toLowerCase()}), cubre ${r.basicOk} de los ${r.BASIC.length} requisitos básicos y presenta ${r.idealOk} de las ${r.IDEAL.length} competencias ideales del perfil. `+
    `Destaca en ${st}. `+
    (hasGaps ? `Las principales brechas detectadas son ${gp}, `+(devGaps? 'que corresponden en su mayoría a competencias entrenables durante el proceso de inducción. ':'que conviene contrastar en entrevista. ')
             : 'No se detectaron dimensiones por debajo del nivel fuerte, por lo que el foco de la entrevista debe ser verificar con casos reales lo que la evaluación sugiere. ')+
    `Su potencial de desarrollo es ${r.trainKey.toLowerCase()} y el riesgo de contratación es ${r.risk.toLowerCase()}. `+
    (r.dec==='POT' ? 'Además de cubrir el puesto actual, muestra características de futuro desarrollador de cuentas estratégicas: se recomienda avanzar a entrevista final y considerarlo para cuentas de mayor complejidad.'
     : 'Se recomienda avanzar a entrevista final.');
}

function fourQuestions(rec){
  const r = rec.result;
  const pct = r.BASIC.length ? r.basicOk/r.BASIC.length : 1;
  const q1 = pct>=0.9 ? 'Sí, cubre las condiciones para operar desde el inicio con acompañamiento normal.'
           : pct>=0.7 ? 'Parcialmente: puede operar con acompañamiento cercano en las dimensiones marcadas.'
           : 'Todavía no: faltan requisitos indispensables del puesto.';
  const q2 = `${r.index}/100 · ${levelOf(r.index).k.toLowerCase()}. ${r.basicOk}/${r.BASIC.length} requisitos básicos, ${r.idealOk}/${r.IDEAL.length} competencias ideales.`;
  const gn = listEs(r.gaps.map(g=>g.t));
  const q3 = gn ? `Prioridad de capacitación: ${gn.toLowerCase()}, más el portafolio ISEL y el proceso comercial.`
                : 'Solo portafolio ISEL, proceso comercial y CRM.';
  const q4 = ({D:'Alto: reúne diagnóstico, generación de oportunidades y conversación multinivel.',
               C:'Sólido: ya opera de forma consultiva; el siguiente paso es desarrollo estratégico de cuentas.',
               B:'Medio: bases comerciales firmes, requiere desarrollar profundidad consultiva y técnica.',
               A:'Limitado en el corto plazo: el patrón de respuestas es predominantemente transaccional.'})[r.prof]
             + ` Potencial de desarrollo ${r.trainKey.toLowerCase()}.`;
  const items = [['¿Puede desempeñar actualmente el puesto?',q1],['¿Qué tan preparado está?',q2],
                 ['¿Qué necesitaríamos enseñarle?',q3],['¿Cuál es su potencial como consultor comercial?',q4]];
  return `<div class="sect"><div class="sect-h"><h2>Lectura de la decisión</h2></div>
    <div class="panel"><div class="panel-b">
      <p style="font-size:16.5px;line-height:1.6;max-width:78ch;margin-bottom:18px">${narrative(rec)}</p>
      <div class="grid g2" style="gap:0 26px">${items.map(([k,v])=>
        `<div class="chk" style="border-bottom:1px solid var(--steel-200)"><div class="d"><b style="font-size:14.5px">${k}</b>
        <em style="font-size:14px;color:var(--ink-2);margin-top:2px">${v}</em></div></div>`).join('')}</div>
      <p class="tiny" style="margin-top:14px">El número sintetiza, no decide. La recomendación se sostiene en el perfil de competencias, no en el promedio.</p>
    </div></div></div>`;
}

function resultsBody(rec, forPrint){
  const r = rec.result, lv = levelOf(r.index), dc = DECISIONS[r.dec], pf = PROFILES[r.prof];
  const defs = rec.dimsDef || DIMS;
  const nAns = Object.keys(r.perQ).filter(k=>r.perQ[k]!==null).length;
  const alerts = r.alerts.length ? `<div class="alert ${r.alerts.some(a=>a.lvl==='crit')?'':'warn'}">
      <h3>${r.alerts.some(a=>a.lvl==='crit')?'Alertas críticas':'Observaciones sobre competencias críticas'}</h3>
      <ul>${r.alerts.map(a=>`<li><b>${a.t}.</b> ${a.d}</li>`).join('')}</ul></div>` : '';
  return `
  <div class="res-hero">
    <div class="res-top">
      <div class="res-id"><div class="sub">Candidato</div>
        <h2>${esc(rec.profile.nombre||'Sin nombre')}</h2>
        <div class="sub">${esc(rec.puesto)}</div>
        <div class="sub">${fdate(rec.createdAt)} · versión ${esc(rec.version)}</div></div>
      <div class="res-score">
        <div class="bigscore" style="color:${lv.c}">${r.index}<em>/100</em></div>
        <div><div class="lvl" style="color:${lv.c}"><span class="dot" style="background:${lv.c}"></span>${lv.k}</div>
        <div class="tiny" style="max-width:22ch;margin-top:4px">${lv.d}</div></div></div>
    </div>
    <div class="res-cells">
      <div class="cell"><div class="k">Recomendación</div><div class="v" style="color:${dc.c}">${dc.k}</div></div>
      <div class="cell"><div class="k">Perfil comercial</div><div class="v">${pf.k}</div></div>
      <div class="cell"><div class="k">Requisitos básicos</div><div class="v">${r.basicOk} / ${r.BASIC.length}</div></div>
      <div class="cell"><div class="k">Competencias ideales</div><div class="v">${r.idealOk} / ${r.IDEAL.length}</div></div>
    </div>
    <div class="res-cells" style="border-top:1px solid var(--steel-200)">
      <div class="cell"><div class="k">Potencial de desarrollo</div><div class="v">${r.trainKey}</div></div>
      <div class="cell"><div class="k">Riesgo de contratación</div><div class="v" style="color:${r.risk==='Alto'?'var(--r-red)':r.risk==='Moderado'?'var(--amber)':'var(--r-green)'}">${r.risk}</div></div>
      <div class="cell"><div class="k">Consistencia de respuestas</div><div class="v">${r.consistency.idx}</div></div>
      <div class="cell"><div class="k">Reactivos respondidos</div><div class="v">${nAns}</div></div>
    </div>
  </div>
  ${alerts}
  <p class="note">${dc.d}</p>
  ${fourQuestions(rec)}
  <div class="sect grid g2">
    <div class="panel"><div class="panel-h"><h3>Perfil de competencias</h3></div><div class="panel-b">${radar(r.dims,null,defs)}</div></div>
    <div class="panel"><div class="panel-h"><h3>Puntuación por dimensión</h3></div><div class="panel-b">${bars(r.dims,defs)}</div></div>
  </div>
  <div class="sect grid g2 ${forPrint?'page-break':''}">
    <div class="panel"><div class="panel-h"><h3>Requisitos básicos del puesto</h3><span class="num" style="font-size:22px">${r.basicOk}/${r.BASIC.length}</span></div>
      <div class="panel-b">${r.BASIC.length?checklist(r.BASIC):'<p class="sub">Sin requisitos definidos.</p>'}</div></div>
    <div class="panel"><div class="panel-h"><h3>Competencias ideales</h3><span class="num" style="font-size:22px">${r.idealOk}/${r.IDEAL.length}</span></div>
      <div class="panel-b">${r.IDEAL.length?checklist(r.IDEAL):'<p class="sub">Sin competencias ideales definidas.</p>'}</div></div>
  </div>
  <div class="sect grid g2">
    <div class="panel"><div class="panel-h"><h3>Principales fortalezas</h3></div><div class="panel-b">
      ${r.strengths.length?`<ol class="ol">${r.strengths.map(s=>`<li><b>${esc(s.t)} · ${s.v}</b><span>${esc(s.d)}</span></li>`).join('')}</ol>`
      :`<p class="sub">No se identificaron dimensiones por encima de 60. El perfil requiere desarrollo transversal.</p>`}</div></div>
    <div class="panel"><div class="panel-h"><h3>Áreas a desarrollar</h3></div><div class="panel-b">
      ${r.gaps.length?`<ol class="ol">${r.gaps.map(s=>`<li><b>${esc(s.t)} · ${s.v}</b><span>${esc(s.d)}</span></li>`).join('')}</ol>`
      :`<p class="sub">Todas las dimensiones se ubican en nivel fuerte o superior.</p>`}</div></div>
  </div>
  <div class="sect ${forPrint?'page-break':''}">
    <div class="sect-h"><h2>Qué profundizar en la entrevista</h2></div>
    <div class="panel"><div class="panel-b"><ol class="ol">${r.probes.map(p=>`<li><span>${esc(p)}</span></li>`).join('')}</ol></div></div>
  </div>
  <div class="sect">
    <div class="sect-h"><h2>Plan de desarrollo sugerido</h2><span class="sub">Las líneas marcadas responden a brechas detectadas</span></div>
    <div class="grid g3">${[['Primeros 30 días','d30'],['31 a 60 días','d60'],['61 a 90 días','d90']].map(([t,k])=>
      `<div class="plan-col"><h3>${t}</h3><ul>${(r.plan[k]||[]).map(i=>`<li class="${i.g?'gap':''}">${esc(i.t)}</li>`).join('')||'<li>—</li>'}</ul></div>`).join('')}</div>
  </div>
  ${r.consistency.det.length?`<div class="sect"><div class="sect-h"><h2>Control de consistencia</h2></div>
    <div class="panel"><div class="panel-b">
      <p class="sub" style="margin-bottom:12px">Contrasta lo que el candidato declara sobre sí mismo contra las decisiones que eligió en los escenarios. Es informativo: por sí solo no descarta a una persona.</p>
      <div class="tbl-scroll"><table class="tbl"><thead><tr><th>Tema</th><th>Autoevaluación</th><th>Decisiones observadas</th><th>Diferencia</th></tr></thead>
      <tbody>${r.consistency.det.map(c=>`<tr><td class="nmc">${esc(c.n)}</td><td>${c.self}</td><td>${c.beh}</td>
        <td style="color:${c.gap>35?'var(--amber)':'var(--ink-3)'}">${c.gap}</td></tr>`).join('')}</tbody></table></div>
    </div></div></div>`:''}
  <p class="note">Esta evaluación es una herramienta de apoyo a la decisión de contratación. No constituye un diagnóstico psicológico ni una medición definitiva del desempeño futuro. El resultado debe leerse junto con la entrevista, la verificación de referencias y la valoración del responsable del área.</p>`;
}

function viewAdmin(){
  let rows = [...S.list];
  if(S.fRes) rows = rows.filter(r=>r.result.dec===S.fRes);
  if(S.fDate) rows = rows.filter(r=>r.createdAt.slice(0,10) >= S.fDate);
  const key = r => ({index:r.result.index, name:r.profile.nombre||'', date:r.createdAt,
    basic:r.result.basicOk, ideal:r.result.idealOk, risk:['Bajo','Moderado','Alto'].indexOf(r.result.risk)}[S.sortK]);
  rows.sort((a,b)=>{ const x=key(a), y=key(b); return (x>y?1:x<y?-1:0)*S.sortD; });
  const th=(k,l)=>`<th data-sort="${k}">${l}${S.sortK===k?(S.sortD>0?' ▲':' ▼'):''}</th>`;
  return topbar()+`<div class="shell" style="padding-top:26px;padding-bottom:50px">
    <div class="sect-h"><h2>Candidatos evaluados</h2><span class="sub">${rows.length} de ${S.list.length}</span></div>
    ${S.msg?`<div class="alert warn" style="margin-bottom:16px"><h3>${esc(S.msg)}</h3></div>`:''}
    ${S.confirmDel?`<div class="alert" style="margin-bottom:16px"><h3>Confirmar eliminación</h3>
      Se van a borrar ${S.confirmDel.length} evaluación${S.confirmDel.length>1?'es':''} junto con todas sus respuestas,
      puntajes y banderas. La acción no se puede deshacer.
      <ul style="margin:8px 0 0 18px;font-size:14px">${S.confirmDel.map(r=>`<li>${esc(r.profile.nombre||'Sin nombre')} · ${r.result.index}/100 · ${fdate(r.createdAt)}</li>`).join('')}</ul>
      <div class="navrow" style="margin-top:12px">
        <button class="btn btn-sm" style="background:var(--r-red);border-color:var(--r-red)" data-confirmdel>Sí, eliminar</button>
        <button class="btn btn-ghost btn-sm" data-canceldel>Cancelar</button></div></div>`:''}
    ${S.pendingCount?`<div class="alert" style="margin-bottom:16px"><h3>${S.pendingCount} evaluación${S.pendingCount>1?'es':''} sin enviar</h3>
      Se completaron pero el servidor no las aceptó. Están guardadas en este navegador y no se han perdido.
      <div class="navrow" style="margin-top:10px"><button class="btn btn-sm" data-retrysave>Enviar ahora</button></div></div>`:''}
    ${invitePanel()}
    <div class="panel">
      <div class="panel-b no-print" style="border-bottom:1px solid var(--steel-200)"><div class="filters">
        <div class="field"><label for="f-res">Recomendación</label><select id="f-res" data-filter="res"><option value="">Todas</option>
          ${Object.entries(DECISIONS).map(([k,v])=>`<option value="${k}" ${S.fRes===k?'selected':''}>${v.k}</option>`).join('')}</select></div>
        <div class="field"><label for="f-dat">Evaluados desde</label><input id="f-dat" type="date" data-filter="date" value="${S.fDate}"></div>
        <span style="flex:1"></span>
        <button class="btn btn-ghost btn-sm" data-compare ${S.sel.length<2?'disabled':''}>Comparar candidatos (${S.sel.length})</button>
        <button class="btn btn-ghost btn-sm" data-delcands ${S.sel.length?'':'disabled'}
          style="${S.sel.length?'color:var(--r-red);border-color:var(--r-red)':''}">Eliminar (${S.sel.length})</button>
        <button class="btn btn-ghost btn-sm" data-go="analysis">Análisis de reactivos</button>
        <button class="btn btn-ghost btn-sm" data-go="form">Evaluar nuevo candidato</button>
      </div></div>
      <div class="panel-b">${rows.length? `<div class="tbl-scroll"><table class="tbl"><thead><tr>
        <th style="width:34px"></th>${th('name','Candidato')}${th('index','Índice ISEL')}<th>Nivel</th><th>Perfil</th>
        ${th('basic','Básicas')}${th('ideal','Ideales')}${th('risk','Riesgo')}<th>Recomendación</th><th>Versión</th>${th('date','Fecha')}<th></th></tr></thead>
        <tbody>${rows.map(r=>{
          const lv=levelOf(r.result.index), dc=DECISIONS[r.result.dec];
          const rc = r.result.risk==='Alto'?'var(--r-red)':r.result.risk==='Moderado'?'var(--amber)':'var(--r-green)';
          return `<tr><td><input type="checkbox" data-sel="${r.id}" ${S.sel.includes(r.id)?'checked':''} aria-label="Seleccionar"></td>
          <td class="nmc">${esc(r.profile.nombre||'Sin nombre')}<div class="tiny">${esc(r.profile.ultimoPuesto||'')}</div></td>

          <td>${PROFILES[r.result.prof].k}</td><td>${r.result.basicOk}/${r.result.BASIC.length}</td>

        ? 'Conectado a Supabase. Las respuestas quedan normalizadas para análisis de reactivos.'
        : (DB.ok?'Los resultados se guardan localmente en este navegador.':'Almacenamiento no disponible: los datos existen solo durante esta sesión.')}</span></div>
  </div>`;
}

/* ---------- COMPARADOR ---------- */
function viewCompare(){
  const cs = S.list.filter(r=>S.sel.includes(r.id)).slice(0,4);
  if(cs.length<2) return topbar()+`<div class="shell" style="padding-top:40px">
    <div class="empty"><b>Selecciona entre 2 y 4 candidatos</b>Marca las casillas en la lista de candidatos para comparar sus perfiles.</div>
    <div class="navrow"><button class="btn" data-go="admin">Ir a candidatos</button></div></div>`;
  const COLORS=['var(--blue)','var(--r-green)','var(--amber)','var(--r-red)'];
  const defs = cs[0].dimsDef || DIMS;
  const mixed = cs.some(c=>c.version!==cs[0].version);
  const rowsMetric = [['Índice ISEL','index'],...defs.map(d=>[d.short,d.id])];
  const val=(r,k)=> k==='index'? r.result.index : (r.result.dims[k] ?? 0);
  const bestOf = k => Math.max(...cs.map(r=>val(r,k)));
  return topbar()+`<div class="shell" style="padding-top:26px;padding-bottom:50px">
    <div class="sect-h"><h2>Comparativo de candidatos</h2><span class="sub">${cs.length} seleccionados</span></div>
    ${mixed?`<div class="alert warn"><h3>Versiones distintas</h3>Los candidatos no fueron evaluados con la misma versión del instrumento (${[...new Set(cs.map(c=>c.version))].join(', ')}). Los puntajes no son estrictamente comparables.</div>`:''}
    <p class="note" style="margin:0 0 18px">El comparativo no elige automáticamente al candidato con mayor puntuación. Un índice más alto puede convivir con una brecha crítica; revisa riesgo, competencias básicas y potencial antes de decidir.</p>
    <div class="grid g2">
      <div class="panel"><div class="panel-h"><h3>Perfiles superpuestos</h3></div><div class="panel-b">
        ${radar(null, cs.map((r,i)=>({dims:r.result.dims, c:COLORS[i]})), defs)}
        <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">${cs.map((r,i)=>
          `<span class="tiny"><span class="dot" style="background:${COLORS[i]}"></span>${esc(r.profile.nombre)}</span>`).join('')}</div></div></div>
      <div class="panel"><div class="panel-h"><h3>Lectura cualitativa</h3></div><div class="panel-b">
        ${cs.map((r,i)=>`<div style="padding:12px 0;border-bottom:1px solid var(--steel-200)">
          <div style="font-weight:600"><span class="dot" style="background:${COLORS[i]}"></span>${esc(r.profile.nombre)} · ${PROFILES[r.result.prof].k}</div>
          <div class="tiny" style="margin-top:4px"><b>Fortalezas relativas:</b> ${r.result.strengths.map(s=>esc(s.t)).join(', ')||'—'}</div>
          <div class="tiny"><b>Riesgos relativos:</b> ${r.result.gaps.map(s=>esc(s.t)).join(', ')||'—'}</div></div>`).join('')}</div></div>
    </div>
    <div class="sect"><div class="panel"><div class="panel-b tbl-scroll">
      <table class="tbl cmp-tbl"><thead><tr><th></th>${cs.map(r=>`<th>${esc(r.profile.nombre)}</th>`).join('')}</tr></thead><tbody>
      ${rowsMetric.map(([lab,k])=>{ const b=bestOf(k);
        return `<tr><td class="lab">${esc(lab)}</td>${cs.map(r=>{ const v=val(r,k), c=levelOf(v).c;
          return `<td class="cmp-cell ${v===b?'best':''}"><span class="cmp-v" style="color:${c}">${v}</span>
            <span class="cmp-bar"><i style="width:${v}%;background:${c}"></i></span></td>`;}).join('')}</tr>`;}).join('')}
      <tr><td class="lab">Requisitos básicos</td>${cs.map(r=>`<td>${r.result.basicOk} / ${r.result.BASIC.length}</td>`).join('')}</tr>
      <tr><td class="lab">Competencias ideales</td>${cs.map(r=>`<td>${r.result.idealOk} / ${r.result.IDEAL.length}</td>`).join('')}</tr>

/* ============================================================
   MÓDULO 7 — EDITOR DE EVALUACIONES
   ============================================================ */
const badgeOf = ins => ins.status==='publicada'
  ? `<span class="badge b-pub">Publicada</span>` : ins.status==='archivada'
  ? `<span class="badge b-arc">Archivada</span>` : `<span class="badge b-draft">Borrador</span>`;
const isLocked = ins => ins.status !== 'borrador';

function countActive(ins){ return ins.items.filter(i=>i.active!==false).length; }

/* ---- validación ---- */
function validate(ins){
  const out = [];
  const err = (t,d)=>out.push({lvl:'err',t,d}), warn=(t,d)=>out.push({lvl:'warn',t,d});
  const wsum = ins.dims.reduce((s,d)=>s+(+d.w||0),0);
  if(Math.abs(wsum-1) > 0.0005) err('Los pesos de las dimensiones suman '+pctW(wsum)+'%', 'Deben sumar exactamente 100%. Usa "Normalizar a 100%" en la pestaña Dimensiones.');
  const ids = ins.items.map(i=>i.id);
  const dup = ids.filter((v,i)=>ids.indexOf(v)!==i);
  if(dup.length) err('IDs de reactivo duplicados', [...new Set(dup)].join(', '));
  const dimIds = ins.dims.map(d=>d.id);
  const dupD = dimIds.filter((v,i)=>dimIds.indexOf(v)!==i);
  if(dupD.length) err('IDs de dimensión duplicados', [...new Set(dupD)].join(', '));
  ins.dims.forEach(d=>{
    const n = ins.items.filter(i=>i.dim===d.id && i.active!==false).length;
    if(!n) err('La dimensión "'+d.short+'" no tiene reactivos activos', 'Su puntaje siempre será 0 y arrastrará el índice global hacia abajo.');
    else if(n<2 && d.w>=0.1) warn('La dimensión "'+d.short+'" pesa '+pctW(d.w)+'% con un solo reactivo', 'Una sola respuesta determina una porción grande del índice.');
    if(!d.probe) warn('La dimensión "'+d.short+'" no tiene pregunta sugerida de entrevista','Sin ese texto no se genera recomendación para el entrevistador cuando aparece como brecha.');
    if(!d.strength || !d.gap) warn('La dimensión "'+d.short+'" no tiene textos de fortaleza o brecha','El informe mostrará el nombre sin explicación.');
  });
  ins.items.forEach(q=>{
    if(!dimIds.includes(q.dim)) err('El reactivo '+q.id+' apunta a una dimensión inexistente', 'Dimensión "'+q.dim+'".');
    if(!q.q || !q.q.trim()) err('El reactivo '+q.id+' no tiene texto de pregunta','');
    if(q.type==='likert'){ if(!q.labs || !q.labs[0] || !q.labs[1]) err('El reactivo '+q.id+' no tiene etiquetas de escala',''); return; }
    if(!q.opts || q.opts.length<2){ err('El reactivo '+q.id+' tiene menos de 2 opciones',''); return; }
    if(q.opts.some(o=>!o.t || !o.t.trim())) err('El reactivo '+q.id+' tiene opciones sin texto','');
    if(q.type==='scenario'||q.type==='technical'){
      if(!q.opts.some(o=>+o.s>=80)) warn('El reactivo '+q.id+' no tiene ninguna opción de 80 o más','Ningún candidato podrá obtener puntaje alto en este reactivo.');
      if(!q.opts.some(o=>+o.s<=40)) warn('El reactivo '+q.id+' no tiene opciones de bajo puntaje','No discrimina: todas las respuestas puntúan parecido.');
      const sp = q.opts.map(o=>+o.s).sort((a,b)=>a-b);
      if(sp[sp.length-1]-sp[0] < 30) warn('El reactivo '+q.id+' tiene poca dispersión de puntajes','Diferencia de solo '+(sp[sp.length-1]-sp[0])+' puntos entre la mejor y la peor opción.');
    }
    if(q.type==='multi'){
      const pos = q.opts.filter(o=>+o.p>0).length;
      if(!pos) err('El reactivo '+q.id+' no tiene opciones con puntos positivos','No es posible calcular su puntaje.');
      if(q.max>pos) warn('El reactivo '+q.id+' permite elegir más opciones de las que suman puntos','Máximo '+q.max+' con solo '+pos+' opciones positivas.');
    }
    if(q.type==='ranking'){
      const rs = q.opts.map(o=>+o.r).sort((a,b)=>a-b);
      const okSeq = rs.every((v,i)=>v===i+1);
      if(!okSeq) err('El reactivo '+q.id+' tiene posiciones ideales inválidas','Deben ser 1 a '+q.opts.length+' sin repetir. Actualmente: '+rs.join(', ')+'.');
    }
    if(!q.just) warn('El reactivo '+q.id+' no tiene justificación de puntuación','El administrador no podrá consultar por qué una respuesta recibió cierto valor.');
  });
  const refCheck = (rows,label)=>rows.forEach(r=>{
    if(r.src.type==='dim' && !dimIds.includes(r.src.dim)) err(label+': "'+r.n+'" apunta a una dimensión inexistente', r.src.dim);
    if(r.src.type==='items'){
      const miss = (r.src.ids||[]).filter(i=>!ids.includes(i));
      if(miss.length===(r.src.ids||[]).length) err(label+': "'+r.n+'" no encuentra ninguno de sus reactivos', miss.join(', ')+'. Se usará la dimensión de respaldo.');
      else if(miss.length) warn(label+': "'+r.n+'" referencia reactivos inexistentes', miss.join(', '));
    }
  });
  refCheck(ins.basic||[],'Requisito básico'); refCheck(ins.ideal||[],'Competencia ideal');
  (ins.consPairs||[]).forEach(p=>{
    const miss = [p.self,...(p.beh||[])].filter(i=>!ids.includes(i));
    if(miss.length) warn('Par de consistencia "'+p.n+'" referencia reactivos inexistentes', miss.join(', '));
  });
  if(!(ins.basic||[]).length) warn('Sin requisitos básicos definidos','El informe no podrá responder si el candidato puede desempeñar el puesto.');
  if(!(ins.plan.d30||[]).length && !(ins.plan.d60||[]).length) warn('Sin plan de desarrollo','No se generará plan de capacitación en el informe.');
  return out;
}

function itemDetail(q){
  const body = q.type==='likert'
    ? `<div class="sc"><b>0–100</b><span>Escala 1 a 5 mapeada linealmente (1=0, 5=100). Etiquetas: “${esc(q.labs[0])}” a “${esc(q.labs[1])}”.</span></div>`
    : q.opts.map(o=>{
        const v = q.type==='ranking' ? 'pos '+o.r : (q.type==='multi' ? (o.p>0?'+'+o.p:o.p) : o.s);
        const col = q.type==='multi' ? (o.p>0?'var(--r-green)':o.p<0?'var(--r-red)':'var(--ink-3)')
                  : q.type==='ranking' ? 'var(--blue)'
                  : (o.s>=80?'var(--r-green)':o.s>=45?'var(--amber)':'var(--r-red)');
        return `<div class="sc"><b style="color:${col}">${v}</b><span>${esc(o.t)}${o.flag?' <b style="color:var(--r-red)">· bandera crítica</b>':''}</span></div>`;
      }).join('');
  return `<div class="qb-item" style="margin-top:-6px;border-top:none"><div class="qb-b" style="padding-top:12px;padding-left:60px">
    ${q.case?`<div class="qcase" style="margin-bottom:12px">${esc(q.case)}</div>`:''}
    ${body}
    ${q.just?`<div class="qb-just"><b>Criterio de puntuación.</b> ${esc(q.just)}</div>`:''}
  </div></div>`;
}
