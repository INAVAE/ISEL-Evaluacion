          ${ins.dims.map(d=>`<option value="${d.id}" ${it.dim===d.id?'selected':''}>Si ${esc(d.short)} &lt; 70</option>`).join('')}</select></td>
        <td style="width:30px">${lock?'':`<button class="rowdel" data-delplan="${k}.${i}">×</button>`}</td></tr>`).join('')}
      </tbody></table>
      ${lock?'':`<button class="btn btn-ghost btn-sm" style="margin-top:8px" data-addplan="${k}">Agregar línea</button>`}</div>`).join('')}
    </div></div>`;
}

/* ---- pestaña: metadatos ---- */
function tabMeta(ins){
  const ro = isLocked(ins)?'disabled':'';
  return `<div class="tabpanel"><div class="formgrid">
    <div class="full"><label class="fl">Puesto evaluado</label><input class="fi" data-meta="name" value="${esc(ins.name)}" ${ro}></div>
    <div class="full"><label class="fl">Área</label><input class="fi" data-meta="area" value="${esc(ins.area||'')}" ${ro}></div>
    <div><label class="fl">Clave de versión</label><input class="fi" data-meta="version" value="${esc(ins.version)}" ${ro}></div>
    <div><label class="fl">Orden de las opciones</label>
      <label class="sw ${ins.shuffleOptions!==false?'on':''}" data-shuffle style="margin-top:9px" ${ro}><i></i>
        ${ins.shuffleOptions!==false?'Aleatorio en cada aplicación':'Fijo, como están capturadas'}</label>
      <p class="mini" style="margin-top:6px">Evita que el candidato deduzca la respuesta por su posición.
      Las respuestas se guardan con el índice original, así que el puntaje no cambia.</p></div>
    <div class="full"><label class="fl">Notas internas</label><textarea class="fi" rows="4" data-meta="notes" ${ro}>${esc(ins.notes||'')}</textarea></div>
  </div>
  <div style="margin-top:22px"><div class="sect-h" style="margin-bottom:8px"><h2 style="font-size:20px">Aviso de privacidad</h2>
    <label class="sw ${ins.privacy && ins.privacy.enabled?'on':''}" data-privon ${ro}><i></i>${ins.privacy && ins.privacy.enabled?'Se muestra al candidato':'Desactivado'}</label></div>
    <p class="mini" style="margin-bottom:10px">Se presenta antes de los reactivos y el candidato debe aceptarlo para continuar.
    El texto que trae por omisión es un borrador: pídele a quien lleve el tema legal en ISEL que lo revise antes de usarlo con candidatos reales.</p>
    <div class="formgrid">
      <div class="full"><label class="fl">Responsable del tratamiento</label>
        <input class="fi" data-priv="responsible" value="${esc((ins.privacy||{}).responsible||'')}" ${ro}></div>
      <div class="full"><label class="fl">Texto del aviso (un párrafo por línea)</label>
        <textarea class="fi" rows="8" data-priv="text" ${ro}>${esc((ins.privacy||{}).text||'')}</textarea></div>
      <div class="full"><label class="fl">Contacto para derechos ARCO</label>
        <input class="fi" data-priv="contact" value="${esc((ins.privacy||{}).contact||'')}" ${ro}></div>
      <div class="full"><label class="fl">Texto de la casilla de aceptación</label>
        <input class="fi" data-priv="ack" value="${esc((ins.privacy||{}).ack||'')}" ${ro}></div>
    </div>
  </div>
  <div style="margin-top:22px"><div class="sect-h" style="margin-bottom:8px"><h2 style="font-size:20px">Pares de control de consistencia</h2></div>
    <p class="mini" style="margin-bottom:10px">Contrastan un reactivo de autoevaluación contra reactivos de decisión sobre el mismo tema. El resultado es informativo y nunca descarta por sí solo a un candidato.</p>
    <table class="et"><thead><tr><th style="width:170px">Tema</th><th style="width:110px">Autoevaluación</th><th>Reactivos de decisión</th><th style="width:34px"></th></tr></thead>
    <tbody>${(ins.consPairs||[]).map((p,i)=>`<tr>
      <td><input type="text" data-cons="${i}.n" value="${esc(p.n)}" ${ro}></td>
      <td><input type="text" data-cons="${i}.self" value="${esc(p.self)}" ${ro}></td>
      <td><input type="text" data-cons="${i}.beh" value="${esc((p.beh||[]).join(', '))}" ${ro}></td>
      <td>${ro?'':`<button class="rowdel" data-delcons="${i}">×</button>`}</td></tr>`).join('')}</tbody></table>
    ${ro?'':`<button class="btn btn-ghost btn-sm" style="margin-top:8px" data-addcons>Agregar par</button>`}
  </div></div>`;
}

/* ---- pestaña: validación ---- */
function tabCheck(ins){
  const v = validate(ins);
  const M={err:['✕','v-err'],warn:['△','v-warn']};
  return `<div class="tabpanel">
    <p class="mini" style="margin-bottom:14px">Los errores impiden publicar la versión. Los avisos no bloquean, pero señalan reactivos que probablemente no discriminen entre candidatos.</p>
    ${v.length? `<ul class="vlist">${v.map(x=>`<li><span class="vm ${M[x.lvl][1]}">${M[x.lvl][0]}</span>
      <span><b>${esc(x.t)}</b>${x.d?`<br><span class="tiny">${esc(x.d)}</span>`:''}</span></li>`).join('')}</ul>`
    : `<div class="empty"><b>Sin observaciones</b>La estructura del instrumento es consistente y puede publicarse.</div>`}
    <div style="margin-top:22px" class="grid g4">
      ${[['Dimensiones',ins.dims.length],['Reactivos activos',countActive(ins)],
         ['Requisitos básicos',(ins.basic||[]).length],['Competencias ideales',(ins.ideal||[]).length]]
        .map(([k,n])=>`<div class="cell" style="border:1px solid var(--steel-200)"><div class="k">${k}</div><div class="v">${n}</div></div>`).join('')}
    </div>
    <div style="margin-top:18px"><div class="sect-h" style="margin-bottom:8px"><h2 style="font-size:20px">Reparto de reactivos por dimensión</h2></div>
      ${bars(Object.fromEntries(ins.dims.map(d=>{
        const n = ins.items.filter(i=>i.dim===d.id && i.active!==false).length;
        const mx = Math.max(1,...ins.dims.map(x=>ins.items.filter(i=>i.dim===x.id && i.active!==false).length));
        return [d.id, R(n/mx*100)];
      })), ins.dims)}
      <p class="tiny">Escala relativa a la dimensión con más reactivos, para detectar dimensiones con peso alto y poca evidencia.</p>
    </div></div>`;
}

function viewEditor(){
  const ins = S.draft;
  if(!ins) return viewVersions();
  const T = {items:tabItems, dims:tabDims, reqs:tabReqs, plan:tabPlan, meta:tabMeta, check:tabCheck};
  return topbar()+`<div class="shell" style="padding-top:22px;padding-bottom:40px">
    ${edHead(ins)}${(T[S.tab]||tabItems)(ins)}${saveBar(ins)}</div>`;
}

/* ---- formulario de un reactivo ---- */
function viewItemEdit(){
  const q = S.itemDraft, ins = S.draft;
  if(!q) return viewEditor();
  const opt = (o,i) => {
    let right = '';
    if(q.type==='scenario'||q.type==='technical')
      right = `<div><label class="fl">Puntaje 0–100</label><input class="fi" type="number" min="0" max="100" data-opt="${i}.s" value="${o.s??0}">
        <label class="sw ${o.flag?'on':''}" style="margin-top:7px" data-optflag="${i}"><i></i>Bandera crítica</label></div>`;
    else if(q.type==='multi')
      right = `<div><label class="fl">Puntos (+/−)</label><input class="fi" type="number" step="1" data-opt="${i}.p" value="${o.p??0}"></div>`;
    else if(q.type==='ranking')
      right = `<div><label class="fl">Posición ideal</label><input class="fi" type="number" min="1" max="${q.opts.length}" data-opt="${i}.r" value="${o.r??i+1}"></div>`;
    return `<div class="optrow"><div class="ok">${'ABCDEFGHI'[i]||i+1}</div>
      <div><label class="fl">Texto de la opción</label><textarea class="fi" rows="2" data-opt="${i}.t">${esc(o.t||'')}</textarea></div>
      ${right}<button class="rowdel" data-delopt="${i}" style="margin-top:22px">×</button></div>`;
  };
  const optArea = q.type==='likert'
    ? `<div class="formgrid"><div><label class="fl">Etiqueta del 1</label><input class="fi" data-lab="0" value="${esc(q.labs?q.labs[0]:'')}"></div>
       <div><label class="fl">Etiqueta del 5</label><input class="fi" data-lab="1" value="${esc(q.labs?q.labs[1]:'')}"></div></div>
       <p class="mini">La escala se convierte linealmente a 0–100. Conviene mantener el peso bajo (0.5) por el sesgo de deseabilidad social.</p>`
    : `${(q.opts||[]).map(opt).join('')}
       <div class="navrow" style="margin-top:12px"><button class="btn btn-ghost btn-sm" data-addopt>Agregar opción</button>
       ${q.type==='multi'?`<span style="display:flex;align-items:center;gap:8px"><label class="fl" style="margin:0">Máximo de selecciones</label>
         <input class="fi" style="width:80px" type="number" min="1" data-max value="${q.max||3}"></span>`:''}
       ${q.type==='ranking'?`<span class="tiny">Las posiciones ideales deben ser 1 a ${q.opts.length} sin repetir.</span>`:''}</div>`;
  const hint = {
    scenario:'Las opciones incorrectas no deben ser absurdas: todas deben parecer razonables. Lo que separa a un vendedor consultivo de uno transaccional es cuál elige primero, no cuál es obviamente falsa.',
    technical:'Nivel básico e intermedio. Vale premiar la respuesta prudente (“validaría estos datos antes de recomendar”) por encima de una respuesta rápida pero temeraria.',
    multi:'Incluye opciones con puntos negativos para castigar los reflejos transaccionales (preguntar la marca preferida, correr a cerrar el mes).',
    ranking:'Define el orden ideal completo. El puntaje baja según el desplazamiento respecto de ese orden.',
    likert:'Autoevaluación: úsala junto con un par de consistencia en la pestaña de datos de la versión.'
  }[q.type];
  return topbar()+`<div class="shell" style="padding-top:22px;padding-bottom:50px">
    <div class="sect-h"><h2>${S.itemNew?'Nuevo reactivo':'Editar reactivo '+esc(q.id)}</h2>
      <span class="sub">${esc(ins.name)} · ${esc(ins.version)}</span></div>
    ${S.msg?`<div class="alert" style="margin-bottom:16px"><h3>${esc(S.msg)}</h3></div>`:''}
    <div class="panel"><div class="panel-b">
      <div class="formgrid">
        <div><label class="fl">Identificador</label><input class="fi" data-it="id" value="${esc(q.id)}"></div>
        <div><label class="fl">Dimensión</label><select class="fi" data-it="dim">
          ${ins.dims.map(d=>`<option value="${d.id}" ${q.dim===d.id?'selected':''}>${esc(d.short)}</option>`).join('')}</select></div>
        <div><label class="fl">Tipo de reactivo</label><select class="fi" data-ittype>
          ${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${q.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
        <div><label class="fl">Dificultad</label><select class="fi" data-it="level">
          ${LEVELS_Q.map(l=>`<option ${q.level===l?'selected':''}>${l}</option>`).join('')}</select></div>
        <div class="full"><label class="fl">Competencia evaluada</label><input class="fi" data-it="comp" value="${esc(q.comp||'')}"></div>
        <div><label class="fl">Peso dentro de la dimensión</label><input class="fi" type="number" step="0.1" min="0.1" data-it="w" value="${q.w||1}"></div>
        <div style="display:flex;align-items:flex-end;gap:18px">
          <label class="sw ${q.crit?'on':''}" data-itcrit><i></i>Competencia crítica</label>
          <label class="sw ${q.active!==false?'on':''}" data-itactive><i></i>${q.active!==false?'Activo':'Inactivo'}</label></div>
      </div>
      <div style="margin-top:18px"><label class="fl">Situación o caso (opcional)</label>
        <textarea class="fi" rows="3" data-it="case">${esc(q.case||'')}</textarea></div>
      <div style="margin-top:14px"><label class="fl">Pregunta</label>
        <textarea class="fi" rows="2" data-it="q">${esc(q.q||'')}</textarea></div>
    </div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Opciones y puntuación</h3>
      <span class="sub">${TYPES[q.type]}</span></div>
      <div class="panel-b"><p class="mini" style="margin-bottom:14px">${hint}</p>${optArea}</div></div>
    <div class="panel" style="margin-top:16px"><div class="panel-h"><h3>Justificación del criterio</h3></div>
      <div class="panel-b"><p class="mini" style="margin-bottom:8px">Solo la ve el administrador. Explica por qué cada opción recibe su puntaje; es lo que permite defender una decisión de contratación meses después.</p>
      <textarea class="fi" rows="4" data-it="just">${esc(q.just||'')}</textarea></div></div>
    <div class="savebar" style="margin-top:16px">
      <span class="tiny">Los cambios se aplican al borrador; recuerda guardarlo.</span><span class="sp"></span>
      <button class="btn btn-ghost btn-sm" data-cancelitem>Cancelar</button>
      <button class="btn btn-sm" data-saveitem>Aplicar al borrador</button></div>
  </div>`;
}


/* ============================================================
   MÓDULO 8 — CONEXIÓN, ACCESO E INVITACIONES
   ============================================================ */
const SQL_SCHEMA = "-- ============================================================\n-- ISEL \u00b7 Evaluaci\u00f3n de competencias comerciales\n-- Esquema para Supabase / PostgreSQL\n-- Ejecutar completo en el SQL Editor del proyecto.\n-- ============================================================\n\n-- En Supabase pgcrypto ya viene instalado en el esquema \"extensions\", no en\n-- \"public\". Por eso todas las funciones llevan extensions en su search_path:\n-- sin eso, gen_random_bytes() no se encuentra y la funci\u00f3n falla.\ncreate extension if not exists pgcrypto;\n\n-- ------------------------------------------------------------\n-- 1. INSTRUMENTOS (versiones de la evaluaci\u00f3n)\n-- La definici\u00f3n completa vive en jsonb: dimensiones, reactivos,\n-- requisitos, plan y pares de consistencia. Se versiona entera\n-- para que un candidato evaluado con 1.0 conserve su contexto\n-- aunque 1.1 cambie los pesos.\n-- ------------------------------------------------------------\ncreate table if not exists isel_instruments (\n  id          text primary key,\n  name        text not null,\n  area        text,\n  version     text not null,\n  status      text not null default 'borrador'\n              check (status in ('borrador','publicada','archivada')),\n  notes       text,\n  definition  jsonb not null,\n  created_at  timestamptz not null default now(),\n  updated_at  timestamptz not null default now()\n);\ncreate index if not exists isel_instruments_status_idx on isel_instruments(status);\n\n-- ------------------------------------------------------------\n-- 2. CANDIDATOS\n-- profile guarda escolaridad, experiencia, disponibilidad, etc.\n-- La edad se captura pero nunca entra al c\u00e1lculo.\n-- ------------------------------------------------------------\ncreate table if not exists isel_candidates (\n  id          text primary key,\n  full_name   text not null,\n  email       text,\n  profile     jsonb not null default '{}'::jsonb,\n  created_at  timestamptz not null default now()\n);\ncreate index if not exists isel_candidates_name_idx on isel_candidates(lower(full_name));\n\n-- ------------------------------------------------------------\n-- 3. EVALUACIONES APLICADAS\n-- Una fila por aplicaci\u00f3n. invite_token permite que el candidato\n-- conteste desde su celular sin ver el panel; se anula al enviar.\n-- ------------------------------------------------------------\ncreate table if not exists isel_assessments (\n  id             text primary key,\n  candidate_id   text references isel_candidates(id) on delete cascade,\n  instrument_id  text references isel_instruments(id),\n  version        text,\n  invite_token   text unique,\n  status         text not null default 'pendiente'\n                 check (status in ('pendiente','en_progreso','completada','cancelada')),\n  consent        jsonb,\n  answers        jsonb,\n  dims_def       jsonb,\n  result         jsonb,\n  index_score    int,\n  decision       text,\n  profile_code   text,\n  risk           text,\n  consistency    int,\n  invited_at     timestamptz not null default now(),\n  started_at     timestamptz,\n  submitted_at   timestamptz\n);\n-- Se agrega aparte porque create table if not exists no modifica una tabla\n-- que ya existe. Es seguro volver a ejecutarlo.\nalter table isel_assessments add column if not exists consent jsonb;\n\ncreate index if not exists isel_assessments_status_idx on isel_assessments(status);\ncreate index if not exists isel_assessments_cand_idx   on isel_assessments(candidate_id);\ncreate index if not exists isel_assessments_date_idx   on isel_assessments(submitted_at desc);\n\n-- ------------------------------------------------------------\n-- 4. RESPUESTAS INDIVIDUALES\n-- Normalizadas para poder hacer an\u00e1lisis de reactivos: qu\u00e9 tanto\n-- discrimina cada pregunta entre candidatos buenos y malos.\n-- Guardar la respuesta cruda permite recalcular el puntaje si\n-- despu\u00e9s se recalibra el instrumento.\n-- ------------------------------------------------------------\ncreate table if not exists isel_answers (\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  item_id       text not null,\n  dimension_id  text,\n  item_type     text,\n  raw_answer    jsonb,\n  score         numeric,\n  primary key (assessment_id, item_id)\n);\ncreate index if not exists isel_answers_item_idx on isel_answers(item_id);\n\n-- ------------------------------------------------------------\n-- 5. PUNTAJES POR DIMENSI\u00d3N\n-- ------------------------------------------------------------\ncreate table if not exists isel_dimension_scores (\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  dimension_id  text not null,\n  score         int,\n  weight        numeric,\n  minimum       int,\n  is_critical   boolean,\n  primary key (assessment_id, dimension_id)\n);\n\n-- ------------------------------------------------------------\n-- 6. BANDERAS CR\u00cdTICAS\n-- kind: 'respuesta_etica' (opci\u00f3n marcada como falta grave),\n--       'crit' (dimensi\u00f3n bajo umbral de corte),\n--       'warn' (competencia cr\u00edtica bajo el m\u00ednimo del puesto).\n-- ------------------------------------------------------------\ncreate table if not exists isel_critical_flags (\n  id            bigserial primary key,\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  kind          text not null,\n  item_id       text,\n  detail        text,\n  created_at    timestamptz not null default now()\n);\ncreate index if not exists isel_flags_assessment_idx on isel_critical_flags(assessment_id);\n\n-- ------------------------------------------------------------\n-- 7. RECOMENDACI\u00d3N\n-- ------------------------------------------------------------\ncreate table if not exists isel_recommendations (\n  assessment_id       text primary key references isel_assessments(id) on delete cascade,\n  decision            text,\n  level               text,\n  profile_code        text,\n  risk                text,\n  potential           text,\n  basic_met           int,\n  basic_total         int,\n  ideal_met           int,\n  ideal_total         int,\n  narrative           text,\n  interview_questions text[]\n);\n\n-- ------------------------------------------------------------\n-- 8. PLAN DE DESARROLLO\n-- ------------------------------------------------------------\ncreate table if not exists isel_development_plans (\n  id            bigserial primary key,\n  assessment_id text not null references isel_assessments(id) on delete cascade,\n  phase         text not null check (phase in ('d30','d60','d90')),\n  activity      text not null,\n  addresses_gap boolean not null default false\n);\ncreate index if not exists isel_plans_assessment_idx on isel_development_plans(assessment_id);\n\n-- ============================================================\n-- VISTAS\n-- ============================================================\n\n-- Reconstruye el registro que consume la aplicaci\u00f3n\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_records;\ncreate view isel_records with (security_invoker = true) as\nselect\n  a.id,\n  a.candidate_id                        as \"candidateId\",\n  coalesce(a.submitted_at, a.invited_at) as \"createdAt\",\n  coalesce(i.name, 'Puesto no especificado') as puesto,\n  a.version,\n  a.instrument_id                       as \"instrumentId\",\n  a.dims_def                            as \"dimsDef\",\n  c.profile,\n  a.consent,\n  a.answers,\n  a.result,\n  r.narrative\nfrom isel_assessments a\njoin isel_candidates c on c.id = a.candidate_id\nleft join isel_instruments i on i.id = a.instrument_id\nleft join isel_recommendations r on r.assessment_id = a.id\nwhere a.status = 'completada';\n\n-- Tablero ejecutivo\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_candidate_overview;\ncreate view isel_candidate_overview with (security_invoker = true) as\nselect c.full_name, a.id as assessment_id, a.version, a.index_score, a.decision,\n       a.profile_code, a.risk, rec.basic_met, rec.basic_total, rec.ideal_met, rec.ideal_total,\n       (select count(*) from isel_critical_flags f where f.assessment_id = a.id and f.kind = 'respuesta_etica') as ethical_flags,\n       a.submitted_at\nfrom isel_assessments a\njoin isel_candidates c on c.id = a.candidate_id\nleft join isel_recommendations rec on rec.assessment_id = a.id\nwhere a.status = 'completada'\norder by a.index_score desc nulls last;\n\n-- An\u00e1lisis de reactivos: qu\u00e9 tanto discrimina cada pregunta.\n-- Un reactivo con desviaci\u00f3n cercana a cero no separa candidatos\n-- y conviene revisarlo o retirarlo.\n-- Se elimina antes de recrear: create or replace view no admite\n-- insertar una columna en medio de las existentes.\ndrop view if exists isel_item_analysis;\ncreate view isel_item_analysis with (security_invoker = true) as\nselect ans.item_id, ans.dimension_id, ans.item_type,\n       count(*)                       as respuestas,\n       round(avg(ans.score), 1)       as puntaje_medio,\n       round(stddev_pop(ans.score), 1) as dispersion,\n       round(corr(ans.score, a.index_score::numeric)::numeric, 2) as correlacion_indice\nfrom isel_answers ans\njoin isel_assessments a on a.id = ans.assessment_id\nwhere a.status = 'completada' and ans.score is not null\ngroup by ans.item_id, ans.dimension_id, ans.item_type;\n\n-- ============================================================\n-- FUNCIONES\n-- ============================================================\n\n-- Descompone el registro que env\u00eda la aplicaci\u00f3n en las tablas\n-- normalizadas. Es interna: no se expone a anon ni a authenticated.\ncreate or replace function isel__persist(p jsonb)\nreturns text\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  v_assessment text := p->>'id';\n  v_candidate  text;\n  v_result     jsonb := p->'result';\n  v_paso       text := 'inicio';\nbegin\n  select candidate_id into v_candidate from isel_assessments where id = v_assessment;\n  if v_candidate is null then\n    v_candidate := coalesce(p->>'candidateId', 'K' || encode(gen_random_bytes(8), 'hex'));\n  end if;\n\n  v_paso := 'candidato';\n  insert into isel_candidates (id, full_name, email, profile)\n  values (v_candidate,\n          coalesce(nullif(p->'profile'->>'nombre',''), 'Sin nombre'),\n          p->'profile'->>'email',\n          coalesce(p->'profile', '{}'::jsonb))\n  on conflict (id) do update\n    set full_name = excluded.full_name,\n        email     = coalesce(excluded.email, isel_candidates.email),\n        profile   = excluded.profile;\n\n  v_paso := 'evaluacion';\n  insert into isel_assessments (id, candidate_id, instrument_id, version, status,\n                                consent, answers, dims_def, result, index_score, decision,\n                                profile_code, risk, consistency, submitted_at)\n  values (v_assessment, v_candidate, p->>'instrumentId', p->>'version', 'completada',\n          p->'consent', p->'answers', p->'dimsDef', v_result,\n          (v_result->>'index')::int, v_result->>'dec', v_result->>'prof', v_result->>'risk',\n          (v_result->'consistency'->>'idx')::int,\n          coalesce((p->>'createdAt')::timestamptz, now()))\n  on conflict (id) do update\n    set consent      = excluded.consent,\n        answers      = excluded.answers,\n        dims_def     = excluded.dims_def,\n        result       = excluded.result,\n        index_score  = excluded.index_score,\n        decision     = excluded.decision,\n        profile_code = excluded.profile_code,\n        risk         = excluded.risk,\n        consistency  = excluded.consistency,\n        status       = 'completada',\n        invite_token = null,\n        submitted_at = excluded.submitted_at;\n\n  v_paso := 'respuestas';\n  delete from isel_answers where assessment_id = v_assessment;\n  insert into isel_answers (assessment_id, item_id, dimension_id, item_type, raw_answer, score)\n  select v_assessment, kv.key, x.it->>'dim', x.it->>'type', kv.value,\n         nullif(v_result->'perQ'->>kv.key, '')::numeric\n  from jsonb_each(coalesce(p->'answers', '{}'::jsonb)) kv\n  left join lateral (\n    select item as it\n    from isel_instruments ins,\n         jsonb_array_elements(ins.definition->'items') item\n    where ins.id = p->>'instrumentId' and item->>'id' = kv.key\n    limit 1\n  ) x on true;\n\n  v_paso := 'dimensiones';\n  delete from isel_dimension_scores where assessment_id = v_assessment;\n  insert into isel_dimension_scores (assessment_id, dimension_id, score, weight, minimum, is_critical)\n  select v_assessment, d->>'id', (v_result->'dims'->>(d->>'id'))::int,\n         (d->>'w')::numeric, (d->>'min')::int, (d->>'crit')::boolean\n  from jsonb_array_elements(coalesce(p->'dimsDef', '[]'::jsonb)) d;\n\n  v_paso := 'banderas';\n  delete from isel_critical_flags where assessment_id = v_assessment;\n  insert into isel_critical_flags (assessment_id, kind, item_id, detail)\n  select v_assessment, 'respuesta_etica', f->>'id', f->>'txt'\n  from jsonb_array_elements(coalesce(v_result->'flags', '[]'::jsonb)) f;\n  insert into isel_critical_flags (assessment_id, kind, item_id, detail)\n  select v_assessment, a->>'lvl', null, (a->>'t') || ' \u2014 ' || (a->>'d')\n  from jsonb_array_elements(coalesce(v_result->'alerts', '[]'::jsonb)) a;\n\n  v_paso := 'recomendacion';\n  insert into isel_recommendations (assessment_id, decision, level, profile_code, risk, potential,\n                                    basic_met, basic_total, ideal_met, ideal_total,\n                                    narrative, interview_questions)\n  values (v_assessment, v_result->>'dec', p->>'level', v_result->>'prof', v_result->>'risk',\n          v_result->>'trainKey',\n          (v_result->>'basicOk')::int, jsonb_array_length(coalesce(v_result->'BASIC','[]'::jsonb)),\n          (v_result->>'idealOk')::int, jsonb_array_length(coalesce(v_result->'IDEAL','[]'::jsonb)),\n          p->>'narrative',\n          array(select jsonb_array_elements_text(coalesce(v_result->'probes','[]'::jsonb))))\n  on conflict (assessment_id) do update\n    set decision = excluded.decision, level = excluded.level, profile_code = excluded.profile_code,\n        risk = excluded.risk, potential = excluded.potential,\n        basic_met = excluded.basic_met, basic_total = excluded.basic_total,\n        ideal_met = excluded.ideal_met, ideal_total = excluded.ideal_total,\n        narrative = excluded.narrative, interview_questions = excluded.interview_questions;\n\n  v_paso := 'plan';\n  delete from isel_development_plans where assessment_id = v_assessment;\n  insert into isel_development_plans (assessment_id, phase, activity, addresses_gap)\n  select v_assessment, ph.key, it->>'t', coalesce((it->>'g')::boolean, false)\n  from jsonb_each(coalesce(v_result->'plan', '{}'::jsonb)) ph,\n       jsonb_array_elements(ph.value) it;\n\n  return v_assessment;\nexception when others then\n  -- Reporta en qu\u00e9 paso muri\u00f3 y el error original, en vez de un mensaje opaco\n  raise exception 'ISEL persist fall\u00f3 en el paso \"%\": % (SQLSTATE %)', v_paso, sqlerrm, sqlstate;\nend\n$fn$;\n\n-- Guardar un registro desde el panel (requiere sesi\u00f3n)\ncreate or replace function isel_save_record(p jsonb)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare v_id text;\nbegin\n  if auth.uid() is null then\n    raise exception 'Se requiere sesi\u00f3n iniciada';\n  end if;\n  v_id := isel__persist(p);\n  return jsonb_build_object('ok', true, 'id', v_id);\nend\n$fn$;\n\n-- Crear una invitaci\u00f3n para que el candidato conteste por su cuenta\ncreate or replace function isel_create_invite(p_instrument text, p_name text, p_email text)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare\n  v_token text := encode(gen_random_bytes(12), 'hex');\n  v_cand  text := 'K' || encode(gen_random_bytes(8), 'hex');\n  v_ass   text := 'A' || encode(gen_random_bytes(8), 'hex');\n  v_ver   text;\nbegin\n  if auth.uid() is null then\n    raise exception 'Se requiere sesi\u00f3n iniciada';\n  end if;\n  select version into v_ver from isel_instruments where id = p_instrument;\n  if v_ver is null then\n    raise exception 'El instrumento indicado no existe';\n  end if;\n\n  insert into isel_candidates (id, full_name, email, profile)\n  values (v_cand, coalesce(nullif(p_name,''), 'Candidato por invitaci\u00f3n'), p_email,\n          jsonb_build_object('nombre', p_name, 'email', p_email));\n\n  insert into isel_assessments (id, candidate_id, instrument_id, version, invite_token, status)\n  values (v_ass, v_cand, p_instrument, v_ver, v_token, 'pendiente');\n\n  return jsonb_build_object('token', v_token, 'assessmentId', v_ass, 'candidateId', v_cand, 'version', v_ver);\nend\n$fn$;\n\n-- Lo \u00fanico que puede leer un candidato con su enlace:\n-- la definici\u00f3n del instrumento y su propio nombre.\n-- Nunca puntajes, criterios ni datos de otros candidatos.\ncreate or replace function isel_get_invite(p_token text)\nreturns jsonb\nlanguage sql\nsecurity definer\nset search_path = public, extensions\nstable\nas $fn$\n  select jsonb_build_object(\n    'assessmentId', a.id,\n    'status',       a.status,\n    'version',      a.version,\n    'instrumentId', a.instrument_id,\n    'candidate',    jsonb_build_object('nombre', c.full_name, 'email', c.email),\n    'instrument',   i.definition)\n  from isel_assessments a\n  join isel_instruments i on i.id = a.instrument_id\n  left join isel_candidates c on c.id = a.candidate_id\n  where a.invite_token = p_token\n    and a.status in ('pendiente','en_progreso');\n$fn$;\n\ncreate or replace function isel_start_invite(p_token text)\nreturns void\nlanguage sql\nsecurity definer\nset search_path = public, extensions\nas $fn$\n  update isel_assessments\n     set status = 'en_progreso', started_at = coalesce(started_at, now())\n   where invite_token = p_token and status = 'pendiente';\n$fn$;\n\n-- Env\u00edo del candidato. El token se anula: un enlace, un uso.\ncreate or replace function isel_submit_invite(p_token text, p jsonb)\nreturns jsonb\nlanguage plpgsql\nsecurity definer\nset search_path = public, extensions\nas $fn$\ndeclare v_id text;\nbegin\n  select id into v_id\n    from isel_assessments\n   where invite_token = p_token and status in ('pendiente','en_progreso');\n  if v_id is null then\n    raise exception 'La invitaci\u00f3n no es v\u00e1lida o ya fue utilizada';\n  end if;\n  perform isel__persist(jsonb_set(p, '{id}', to_jsonb(v_id)));\n  return jsonb_build_object('ok', true);\nend\n$fn$;\n\n-- ============================================================\n-- SEGURIDAD\n-- Sin pol\u00edticas, RLS activo bloquea todo: anon no toca las tablas\n-- y solo puede ejecutar las tres funciones del flujo de invitaci\u00f3n.\n-- ============================================================\nalter table isel_instruments       enable row level security;\nalter table isel_candidates        enable row level security;\nalter table isel_assessments       enable row level security;\nalter table isel_answers           enable row level security;\nalter table isel_dimension_scores  enable row level security;\nalter table isel_critical_flags    enable row level security;\nalter table isel_recommendations   enable row level security;\nalter table isel_development_plans enable row level security;\n\ndo $policies$\ndeclare t text;\nbegin\n  foreach t in array array['isel_instruments','isel_candidates','isel_assessments','isel_answers',\n                           'isel_dimension_scores','isel_critical_flags','isel_recommendations',\n                           'isel_development_plans']\n  loop\n    execute format('drop policy if exists isel_rw_authenticated on %I', t);\n    execute format(\n      'create policy isel_rw_authenticated on %I for all to authenticated using (true) with check (true)', t);\n  end loop;\nend\n$policies$;\n\nrevoke execute on function isel__persist(jsonb) from public;\nrevoke execute on function isel__persist(jsonb) from anon;\n\ngrant execute on function isel_get_invite(text)            to anon, authenticated;\ngrant execute on function isel_start_invite(text)          to anon, authenticated;\ngrant execute on function isel_submit_invite(text, jsonb)  to anon, authenticated;\ngrant execute on function isel_save_record(jsonb)          to authenticated;\ngrant execute on function isel_create_invite(text,text,text) to authenticated;\n\ngrant select on isel_records, isel_candidate_overview, isel_item_analysis to authenticated;\n\n-- ============================================================\n-- NOTA SOBRE EL C\u00c1LCULO\n-- El puntaje se calcula hoy en el navegador. Un candidato con\n-- conocimientos t\u00e9cnicos podr\u00eda alterar el resultado que env\u00eda.\n-- La mitigaci\u00f3n est\u00e1 en isel_answers: las respuestas crudas se\n-- guardan tal cual, as\u00ed que el resultado siempre puede\n-- recalcularse desde el panel o desde una Edge Function.\n-- Si la evaluaci\u00f3n se usa para decisiones formales, conviene\n-- mover isel__persist para que recalcule el puntaje en el\n-- servidor a partir de definition->'items' e ignore el jsonb\n-- 'result' que manda el cliente.\n-- ============================================================\n";

function inviteLink(token){
  const base = location.origin + location.pathname + location.search;
  return base + '#/e/' + token;
}

function viewSettings(){
  const t = S.conn;
  return topbar()+`<div class="shell-narrow" style="padding-top:30px;padding-bottom:60px">
    <div class="sect-h"><h2>Conexión de datos</h2>
      <span class="sub">${DB.remote?'Supabase':'Almacenamiento local'}</span></div>
    ${S.msg?`<div class="alert warn" style="margin-bottom:18px"><h3>${esc(S.msg)}</h3></div>`:''}

    <div class="modecard">
      <button class="modeopt ${CFG.mode==='local'?'on':''}" data-mode="local">
        <b>Local</b><span>Todo vive en este navegador. Sirve para calibrar el instrumento y hacer pruebas.
        Los enlaces de invitación solo funcionan en este mismo equipo y los datos se pierden si se borra el almacenamiento.</span></button>
      <button class="modeopt ${CFG.mode==='supabase'?'on':''}" data-mode="supabase">
        <b>Supabase</b><span>Base compartida con control de acceso. El equipo ve los mismos candidatos,
        los enlaces de invitación funcionan desde cualquier dispositivo y las respuestas quedan normalizadas para análisis.</span></button>
    </div>

    ${CFG.fromFile?`<div class="alert warn" style="margin-bottom:16px">
      <h3>La conexión viene de config.json</h3>
      Este sitio publica un archivo <code>config.json</code> y sus valores mandan sobre lo que guardes aquí.
      Es lo correcto: así el celular de cada candidato se conecta solo, sin configurar nada.
      Para cambiar el proyecto, edita ese archivo en el repositorio.</div>`:''}
    ${CFG.mode==='supabase'?`
      <div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Credenciales del proyecto</h3></div>
        <div class="panel-b">
          <div class="field"><label for="c-url">URL del proyecto</label>
            <input id="c-url" data-cfg="url" value="${esc(CFG.url)}" placeholder="https://xxxxxxxx.supabase.co"></div>
          <div class="field"><label for="c-key">Llave pública del proyecto</label>
            <input id="c-key" data-cfg="anonKey" value="${esc(CFG.anonKey)}" placeholder="sb_publishable_…  o bien  eyJhbGciOi…"></div>
          <p class="mini">En Supabase, <b>Project Settings → API Keys</b>. Sirve la <b>Publishable key</b>
          (<code>sb_publishable_…</code>) o la <b>anon public</b> de la pestaña de llaves heredadas.
          Nunca la <b>secret</b> ni la <b>service_role</b>: esas saltan toda la seguridad y el navegador las rechaza.
          Cópiala siempre con el botón <b>Copy</b> de Supabase; seleccionándola con el ratón se corta y el error que
          verás será “llave no válida”.</p>
          <p class="mini">La llave pública no da acceso a nada por sí sola: quien protege los datos es la política
          de seguridad a nivel de fila del esquema, que impide a un visitante sin sesión leer candidatos,
          puntajes o criterios de calificación.</p>
          <div class="navrow"><button class="btn btn-sm" data-testconn>Probar conexión</button>
            <button class="btn btn-ghost btn-sm" data-testsave ${DB.signedIn?'':'disabled'}>Probar guardado</button>
            <button class="btn btn-ghost btn-sm" data-saveconn>Guardar</button>
            <button class="btn btn-ghost btn-sm" data-dlconfig>Descargar config.json</button></div>
          <p class="mini">Descarga ese archivo y súbelo al repositorio, junto a <code>index.html</code>.
          Sin él, los enlaces de invitación abren en blanco porque el dispositivo del candidato no sabe
          a qué proyecto conectarse.</p>
          ${S.diag?`<div class="alert ${S.diag.ok?'warn':''}" style="margin-top:12px">
            <h3>${S.diag.ok?'El guardado funciona':'El guardado falla'}</h3>
            ${S.diag.ok?'Se escribió y se borró un registro de prueba sin errores.':
              `<p>Mensaje exacto del servidor:</p><p class="tiny" style="margin-top:6px"><code>${esc(S.diag.msg)}</code></p>`}
          </div>`:''}
          ${t?`<ul class="steps">${t.steps.map(x=>`<li>
            <span class="sm" style="color:${x.ok===true?'var(--r-green)':x.ok===false?'var(--r-red)':'var(--amber)'}">${x.ok===true?'✓':x.ok===false?'✕':'△'}</span>
            <span>${esc(x.t)}</span></li>`).join('')}</ul>`:''}
        </div></div>

      <div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Sesión del panel</h3></div>
        <div class="panel-b">
          ${DB.signedIn && SESSION
            ? `<p class="sub">Sesión iniciada como <b>${esc((SESSION.user&&SESSION.user.email)||'usuario')}</b>.</p>
               <div class="navrow"><button class="btn btn-ghost btn-sm" data-signout>Cerrar sesión</button></div>`
            : `<p class="sub">Sin sesión. El panel de candidatos y el editor requieren una cuenta de Supabase.</p>
               <div class="navrow"><button class="btn btn-sm" data-go="login">Iniciar sesión</button></div>`}
        </div></div>

      <div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Esquema de base de datos</h3>
        <button class="btn btn-ghost btn-sm" data-copysql>Copiar SQL</button></div>
        <div class="panel-b">
          <p class="mini" style="margin-bottom:10px">Pega esto en el editor SQL de Supabase antes de usar el modo remoto.
          Crea ocho tablas, tres vistas de análisis y las funciones que permiten a un candidato contestar por enlace
          sin poder leer nada más.</p>
          <pre class="sql">${esc(SQL_SCHEMA)}</pre>
        </div></div>
    `:`
      <div class="panel" style="margin-bottom:16px"><div class="panel-h"><h3>Bloqueo del panel</h3></div>
        <div class="panel-b">
          <div class="field"><label for="c-gate">Código de acceso (opcional)</label>
            <input id="c-gate" data-cfg="gate" value="${esc(CFG.gate)}" placeholder="Sin código"></div>
          <p class="mini">Evita que un candidato entre por accidente al panel desde un equipo compartido.
          No es una medida de seguridad: el código se guarda en este navegador y cualquiera con conocimientos técnicos
          puede leerlo. Para control de acceso real, usa el modo Supabase.</p>
          <div class="navrow"><button class="btn btn-ghost btn-sm" data-saveconn>Guardar</button></div>
        </div></div>
    `}

    <p class="note">Cambiar de modo no migra información. Los candidatos guardados en local siguen en local
    y los de Supabase siguen en Supabase.</p>
  </div>`;
}

  return topbar()+`<div class="shell"><div class="logincard">

      ? 'Cuenta de Supabase con permiso de lectura sobre el esquema ISEL.'

function invitePanel(){
  const invs = S.invites || [];
  return `<div class="panel" style="margin-bottom:18px">
    <div class="panel-h"><h3>Invitaciones abiertas</h3>
      <span class="sub">${invs.length} pendientes</span>
      <button class="btn btn-ghost btn-sm" data-toggleinv>${S.showInvites?'Ocultar':'Mostrar'}</button></div>
    ${S.showInvites?`<div class="panel-b">
      <p class="mini" style="margin-bottom:12px">Genera un enlace para que el candidato conteste desde su propio dispositivo.
      Con el enlace solo ve la evaluación: no accede al panel, a otros candidatos ni a los criterios de calificación.
      Cada enlace sirve una sola vez.${DB.remote?'':' <b>En modo local el enlace solo abre en este mismo navegador.</b>'}</p>
      <div class="filters" style="margin-bottom:16px">
        <div class="field"><label for="i-nom">Nombre del candidato</label><input id="i-nom" data-inv="nombre" value="${esc(S.invForm.nombre||'')}"></div>

const scoreColor = v => v>=80?'var(--r-green)': v>=60?'var(--r-yellow)': v>=40?'var(--r-orange)':'var(--r-red)';

function answerDetail(q, ans, score){
  const best = i => q.opts.reduce((b,o,k)=> o.s>q.opts[b].s ? k : b, 0);
  let body = '';
  if(q.type==='likert'){
    body = `<div class="ansrow sel"><span class="ansv" style="color:${scoreColor(score)}">${ans||'—'}</span>
      <span>Se calificó ${ans||'—'} de 5 en la escala “${esc(q.labs[0])}” a “${esc(q.labs[1])}”.</span></div>`;
  }
  else if(q.type==='scenario' || q.type==='technical'){
    const b = best();
    body = q.opts.map((o,i)=>{
      const chosen = ans===i;
      const cls = chosen ? 'sel' : (i===b ? 'best' : '');
      return `<div class="ansrow ${cls}">
        <span class="ansv" style="color:${scoreColor(o.s)}">${o.s}</span>
        <span>${esc(o.t)}
          ${chosen?'<b class="tagc">Elegida</b>':''}${i===b && !chosen?'<b class="tagb">Mejor opción</b>':''}
          ${o.flag?'<b class="tagf">Bandera crítica</b>':''}</span></div>`;
    }).join('');
  }
  else if(q.type==='multi'){
    const sel = ans||[];
    body = q.opts.map((o,i)=>{
      const chosen = sel.includes(i);
      const cls = chosen ? (o.p<0?'bad':'sel') : (o.p>0 ? 'miss' : '');
      return `<div class="ansrow ${cls}">
        <span class="ansv" style="color:${o.p>0?'var(--r-green)':o.p<0?'var(--r-red)':'var(--ink-3)'}">${o.p>0?'+'+o.p:o.p}</span>
        <span>${esc(o.t)}
          ${chosen?'<b class="tagc">Elegida</b>':''}${!chosen && o.p>0?'<b class="tagm">No la vio</b>':''}</span></div>`;
    }).join('');
  }
  else if(q.type==='ranking'){
    const chosen = ans||[];
    body = q.opts.map((o,i)=>{
      const pos = chosen.indexOf(i)+1;
      const ok = pos===o.r;
      return `<div class="ansrow ${ok?'sel':'bad'}">
        <span class="ansv">${pos||'—'}<em>/${o.r}</em></span>
        <span>${esc(o.t)}${ok?'':`<b class="tagm">Debía ir en ${o.r}</b>`}</span></div>`;
    }).join('');
  }
  return body;
}

/* ---- análisis de reactivos ---- */
function itemStats(){
  const rows = [];
  const recs = S.list.filter(r=>r.result && r.result.perQ);
  const byIns = {};
  S.instruments.forEach(i=>{ i.items.forEach(q=>{ byIns[q.id] = byIns[q.id] || {q, dim:q.dim}; }); });
  Object.values(byIns).forEach(({q})=>{
    const pares = [];
    recs.forEach(r=>{
      const v = r.result.perQ[q.id];
      if(v!==null && v!==undefined) pares.push([v, r.result.index]);
    });
    const n = pares.length;
    if(!n) return;
    const mx = pares.reduce((a,p)=>a+p[0],0)/n;
    const my = pares.reduce((a,p)=>a+p[1],0)/n;
    const sx = Math.sqrt(pares.reduce((a,p)=>a+(p[0]-mx)**2,0)/n);
    const sy = Math.sqrt(pares.reduce((a,p)=>a+(p[1]-my)**2,0)/n);
    const cov = pares.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/n;
    const r = (sx>0 && sy>0) ? cov/(sx*sy) : null;
    let veredicto, color;
    if(sx < 8){ veredicto='Todos responden igual'; color='var(--r-red)'; }
    else if(r===null){ veredicto='Sin datos suficientes'; color='var(--ink-3)'; }
    else if(r >= .35){ veredicto='Discrimina bien'; color='var(--r-green)'; }
    else if(r >= .15){ veredicto='Discrimina poco'; color='var(--amber)'; }
    else { veredicto='No discrimina'; color='var(--r-red)'; }
    if(mx >= 92) veredicto = 'Demasiado fácil';
    if(mx <= 20) veredicto = 'Demasiado difícil';
    rows.push({q, n, media:R(mx), sd:R(sx), r: r===null?null:Math.round(r*100)/100, veredicto, color});
  });
  return rows;
}

function viewAnalysis(){
  const rows = itemStats();
  const n = S.list.length;
  const key = {r:'r', media:'media', sd:'sd', id:'id'}[S.analysisSort] || 'r';
  rows.sort((a,b)=>{
    if(key==='id') return a.q.id < b.q.id ? -1 : 1;
    const x = a[key]===null?-2:a[key], y = b[key]===null?-2:b[key];
    return x - y;
  });
  const malos = rows.filter(x=>x.color==='var(--r-red)').length;
  return topbar()+`<div class="shell" style="padding-top:26px;padding-bottom:50px">
    <div class="sect-h"><h2>Análisis de reactivos</h2><span class="sub">${rows.length} reactivos · ${n} evaluaciones</span></div>
    ${n < 15 ? `<div class="alert warn" style="margin-bottom:16px"><h3>Muestra insuficiente</h3>
      Con ${n} evaluación${n===1?'':'es'} los números son ruido. Estas cifras empiezan a significar algo a partir de unos
      15 candidatos y se vuelven confiables cerca de 30. Déjalo correr y vuelve cuando tengas historial.</div>`
      : malos ? `<div class="alert" style="margin-bottom:16px"><h3>${malos} reactivo${malos>1?'s':''} para revisar</h3>
      Aparecen abajo en rojo. O todos los candidatos responden igual, o la respuesta no se relaciona con el desempeño general.</div>`
      : `<div class="alert warn" style="margin-bottom:16px"><h3>Sin reactivos problemáticos</h3>
      Todos separan razonablemente entre candidatos.</div>`}
    <p class="note" style="margin:0 0 16px"><b>Media</b>: puntaje promedio del reactivo.
    <b>Dispersión</b>: qué tanto varían las respuestas; cerca de cero significa que todos contestan lo mismo y el reactivo no aporta.
    <b>Correlación</b>: relación entre lo que se obtiene en este reactivo y el índice global. Alta significa que quienes
    responden bien aquí suelen ser los mejores candidatos, que es justo lo que debe hacer una buena pregunta.</p>
    <div class="panel"><div class="panel-b tbl-scroll"><table class="tbl">
      <thead><tr><th data-asort="id">Reactivo</th><th>Dimensión</th><th>Tipo</th><th>n</th>
        <th data-asort="media">Media</th><th data-asort="sd">Dispersión</th><th data-asort="r">Correlación</th><th>Lectura</th></tr></thead>
      <tbody>${rows.map(x=>`<tr>
        <td class="nmc"><span class="num" style="color:var(--blue)">${esc(x.q.id)}</span>
          <div class="tiny" style="max-width:42ch">${esc(x.q.q)}</div></td>
        <td class="tiny">${esc((DIM[x.q.dim]||{short:x.q.dim}).short)}</td>
        <td class="tiny">${TYPES[x.q.type]}</td>
        <td>${x.n}</td>
        <td class="idx" style="font-size:16px;color:${scoreColor(x.media)}">${x.media}</td>
        <td>${x.sd}</td>
        <td class="idx" style="font-size:16px">${x.r===null?'—':x.r.toFixed(2)}</td>
        <td>${pill(x.veredicto, x.color)}</td></tr>`).join('')}
      </tbody></table></div></div>
    <p class="note">Un reactivo que “no discrimina” no siempre está mal escrito: puede medir algo que este puesto no exige,
    o tener una respuesta correcta demasiado evidente. Ábrelo en el editor y compáralo con los que sí discriminan.</p>
    <div class="navrow"><button class="btn btn-ghost" data-go="admin">Volver a candidatos</button>
      <button class="btn btn-ghost" data-go="versions">Editar reactivos</button></div>
  </div>`;
}

const GATED = ['admin','compare','versions','editor','itemedit','answers','analysis'];
function accessOk(){

function render(){
  const V={home:viewHome,form:viewForm,quiz:viewQuiz,done:viewDone,results:viewResults,report:viewReport,

  if(S._last !== S.view){ window.scrollTo(0,0); S._last = S.view; }

    const f = $(S._focus);
    if(f){ f.focus(); if(f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); }

async function go(v){
  /* En modo candidato solo existen las pantallas de la evaluación */
  if(S.candidateMode && !['invite','form','quiz','thanks'].includes(v)) v = 'invite';
  if(GATED.includes(v) && !accessOk()){ S.view='login'; return render(); }
  try{
    if(['admin','compare','versions','editor','answers','analysis'].includes(v)) S.list = await DB.listCandidates();
    if(['versions','admin','answers','analysis'].includes(v)){ S.instruments = await DB.listInstruments(); }
    if(v==='admin'){
      S.invites = await DB.listInvites();
      const r = await DB.flushPending();
      if(r.sent){ S.list = await DB.listCandidates(); S.saveFailed=false; }
      S.pendingCount = r.left;
    }
  }catch(e){
    if(DB.remote && !DB.signedIn){
      S.msg = 'Tu sesión expiró por seguridad. Vuelve a entrar; los datos guardados están intactos.';
      S.view = 'login'; return render();
    }
    S.msg = 'No se pudieron leer los datos: ' + e.message;
  }
  S.view=v; render();
}
function setPath(obj, path, val){
  const p = path.split('.'); let o = obj;
  for(let i=0;i<p.length-1;i++) o = o[p[i]];
  o[p[p.length-1]] = val;
}
function touch(){ S.dirty = true; }
async function openInstrument(id){
  S.instruments = await DB.listInstruments();
  const ins = S.instruments.find(i=>i.id===id);
  if(!ins) return go('versions');
  S.draft = clone(ins); S.dirty=false; S.tab='items'; S.fDim=''; S.fQuery=''; S.qbOpen={}; S.msg='';
  return go('editor');
}
async function duplicateInstrument(id){
  const all = await DB.listInstruments();
  const src = all.find(i=>i.id===id) || baseInstrument();
  const copy = clone(src);
  const m = (src.version||'').match(/(.*?)(\d+)\.(\d+)$/);
  copy.id = uid('ins-');
  copy.version = m ? `${m[1]}${m[2]}.${+m[3]+1}` : (src.version||'V')+'-copia';
  copy.status = 'borrador';
  copy.createdAt = copy.updatedAt = new Date().toISOString();
  await DB.saveInstrument(copy);
  return openInstrument(copy.id);
}

    catch(e){ S.conn = {ok:false, steps:[{ok:false, t:e.message}]}; }

    return render();
  }
  if(d.cancelinv!==undefined){
    try{ S.invites = await DB.cancelInvite(d.cancelinv); if(S.lastInvite && S.lastInvite.token===d.cancelinv) S.lastInvite=null; }
    catch(e){ S.msg=e.message; }
    return render();
  }
  if(d.startinvite!==undefined){
    S.profile = Object.assign({}, S.invite.candidate);
    S.answers={}; S.page=0;
    return go('form');
  }
  if(d.retrysave!==undefined){
    const r = await DB.flushPending();
    if(r.left){
      S.msg = 'Siguen ' + r.left + ' evaluación' + (r.left>1?'es':'') + ' sin enviar.';
      S.msgTech = r.error || '';
    }
    else {
      S.saveFailed = false; S.sendFailed = false; S.pendingCount = 0;
      S.msgTech = '';
      S.msg = r.sent ? (r.sent + ' evaluación' + (r.sent>1?'es enviadas':' enviada') + ' correctamente.') : 'No hay nada pendiente.';
      if(S.candidateMode){ S.view='thanks'; return render(); }
    }
    try{ S.list = await DB.listCandidates(); }catch(e){}
    return render();
  }
  if(d.recalc!==undefined){
    let n=0;
    for(const rec of S.list){
      const ins = S.instruments.find(i=>i.id===rec.instrumentId);
      if(!ins) continue;
      rec.result = runScoring(rec.profile, rec.answers, ins);
      rec.level = levelOf(rec.result.index).k;
      rec.narrative = narrative(rec);
      try{ await DB.saveCandidate(rec); n++; }catch(e){ S.msg=e.message; break; }
    }
    S.list = await DB.listCandidates();
    if(!S.msg) S.msg = n+' evaluaciones recalculadas desde las respuestas guardadas.';
    return render();
  }

  /* --- evaluación --- */
  const q = BANK[S.page];
  if(d.consent!==undefined){ S.consent = !S.consent; return render(); }
  if(d.start!==undefined){
    const miss = PROFILE_Q.filter(f=>f.req && !S.profile[f.k]);
    if(miss.length){ $('#form-msg').textContent='Faltan campos obligatorios: '+miss.map(m=>m.l).join(', ')+'.'; return; }
    if(INS.privacy && INS.privacy.enabled && !S.consent){
      $('#form-msg').textContent='Para continuar debes aceptar el aviso de privacidad.'; return;
    }
    S.answers={}; S.page=0; S.shuffle = buildShuffle(INS); return go('quiz');
  }
  if(d.pick!==undefined){ S.answers[q.id]=+d.pick; return render(); }
  if(d.lik!==undefined){ S.answers[q.id]=+d.lik; return render(); }
  if(d.multi!==undefined){ const i=+d.multi, c=S.answers[q.id]||[]; S.answers[q.id]=c.includes(i)?c.filter(x=>x!==i):[...c,i]; return render(); }
  if(d.rank!==undefined){ const i=+d.rank, c=S.answers[q.id]||[]; S.answers[q.id]=c.includes(i)?c.filter(x=>x!==i):[...c,i]; return render(); }
  if(d.rankreset!==undefined){ S.answers[q.id]=[]; return render(); }
  if(d.prev!==undefined){ S.page=Math.max(0,S.page-1); return render(); }
  if(d.next!==undefined){
    if(S.page < BANK.length-1){ S.page++; return render(); }
    const rec = buildRecord(S.profile, S.answers, INS);
    if(S.candidateMode){
      try{ await DB.submitInvite(S.inviteToken, rec); }
      catch(e){
        rec._inviteToken = S.inviteToken;
        await DB.queue(rec);
        S.msg = 'No se pudo enviar en este momento: ' + e.message +
                ' Tus respuestas quedaron guardadas en este dispositivo. Vuelve a intentarlo sin cerrar la página.';
        S.sendFailed = true;
        return render();
      }
      S.view='thanks'; return render();
    }
    S.rec = rec;
    S.saveFailed = false; S.msg = '';
    try{ S.list = await DB.saveCandidate(rec); }
    catch(e){
      await DB.queue(rec);
      S.saveFailed = true;
      S.msg = 'La evaluación NO se guardó en el servidor: ' + e.message +
              ' Quedó en espera en este navegador; usa "Reintentar guardado" para enviarla.';
    }
    return go('done');
  }
  if(d.restart!==undefined){ S.profile={}; S.answers={}; S.page=0; S.rec=null; S.consent=false; return go('home'); }
  if(d.open!==undefined){ S.rec = S.list.find(r=>r.id===d.open); return go('results'); }
  if(d.compare!==undefined) return go('compare');
  if(d.delcands!==undefined){ S.confirmDel = S.list.filter(r=>S.sel.includes(r.id)); S.msg=''; return render(); }
  if(d.canceldel!==undefined){ S.confirmDel = null; return render(); }
  if(d.confirmdel!==undefined){
    const n = S.confirmDel.length;
    try{
      S.list = await DB.deleteCandidates(S.confirmDel);
      S.sel = []; S.confirmDel = null;
      S.msg = n + ' evaluación' + (n>1?'es eliminadas':' eliminada') + '.';
    }catch(e){ S.msg = 'No se pudo eliminar: ' + e.message; S.confirmDel = null; }
    return render();
  }
  if(d.seed!==undefined){
    try{ await DB.resetAll(); }catch(e){ S.msg=e.message; return render(); }
    S.activeIns=null; const b=await bootstrap(); S.instruments=b.ins; S.list=b.cands; S.sel=[]; S.lastInvite=null;
    return go('admin');
  }
  if(d.print!==undefined) return window.print();
  if(d.sort!==undefined){ if(S.sortK===d.sort) S.sortD*=-1; else { S.sortK=d.sort; S.sortD=-1; } return render(); }
  if(d.qb!==undefined){ S.qbOpen[d.qb]=!S.qbOpen[d.qb]; return render(); }
  if(d.ansopen!==undefined){ S.answersOpen[d.ansopen]=!S.answersOpen[d.ansopen]; return render(); }
  if(d.asort!==undefined){ S.analysisSort = d.asort; return render(); }

  /* --- versiones --- */
  if(d.tab!==undefined){ S.tab=d.tab; S.msg=''; return render(); }
  if(d.openins!==undefined) return openInstrument(d.openins);
  if(d.dupins!==undefined) return duplicateInstrument(d.dupins);
  if(d.useins!==undefined){
    const all = await DB.listInstruments();
    const x = all.find(i=>i.id===d.useins);
    if(x){ useInstrument(x); S.activeIns=x.id; S.msg='Ahora las evaluaciones nuevas usan '+x.version+'.'; }
    return go('versions');
  }
  if(d.delins!==undefined){ await DB.deleteInstrument(d.delins); S.msg='Borrador eliminado.'; return go('versions'); }
  if(d.newins!==undefined){ const b=blankInstrument(); await DB.saveInstrument(b); return openInstrument(b.id); }

  /* --- borrador --- */
  if(d.savedraft!==undefined){
    S.instruments = await DB.saveInstrument(ins); S.dirty=false;
    if(ins.id===S.activeIns) useInstrument(ins);
    return render();
  }
  if(d.publish!==undefined){
    ins.status='publicada';
    S.instruments = await DB.saveInstrument(ins);
    useInstrument(ins); S.activeIns=ins.id; S.dirty=false;
    S.msg='Versión '+ins.version+' publicada y en uso para nuevas evaluaciones.';
    return go('versions');
  }

  /* --- reactivos --- */
  if(d.toggle!==undefined){ const it=ins.items.find(x=>x.id===d.toggle); it.active = it.active===false; touch(); return render(); }
  if(d.delitem!==undefined){ ins.items = ins.items.filter(x=>x.id!==d.delitem); touch(); return render(); }
  if(d.dupitem!==undefined){
    const src = ins.items.find(x=>x.id===d.dupitem), c = clone(src);
    c.id = nextItemId(ins, c.dim); ins.items.splice(ins.items.indexOf(src)+1, 0, c); touch(); return render();
  }
  if(d.edititem!==undefined){ S.itemDraft = clone(ins.items.find(x=>x.id===d.edititem)); S.itemOrigId=d.edititem; S.itemNew=false; S.msg=''; return go('itemedit'); }
  if(d.newitem!==undefined){
    const dim = S.fDim || ins.dims[0].id;
    S.itemDraft = {id: nextItemId(ins, dim), dim, comp:'', type:'scenario', level:'medio', w:1, crit:false, active:true,
      case:'', q:'', just:'', opts:[{t:'',s:100},{t:'',s:60},{t:'',s:30},{t:'',s:0}]};
    S.itemNew=true; S.msg=''; return go('itemedit');
  }

  /* --- dimensiones --- */
  if(d.privon!==undefined){ ins.privacy = ins.privacy||{}; ins.privacy.enabled = !ins.privacy.enabled; touch(); return render(); }
  if(d.shuffle!==undefined){ ins.shuffleOptions = ins.shuffleOptions===false; touch(); return render(); }
  if(d.adddim!==undefined){
    ins.dims.push({id:uid('d'), code:'X', n:'Nueva dimensión', short:'Nueva', w:0, crit:false, min:55, strength:'', gap:'', probe:''});
    touch(); return render();
  }
  if(d.deldim!==undefined){
    const dd = ins.dims[+d.deldim];
    const used = ins.items.filter(i=>i.dim===dd.id).length;
    if(used){ S.msg='No se puede eliminar "'+dd.short+'": tiene '+used+' reactivos asignados. Reasígnalos o elimínalos primero.'; return render(); }
    ins.dims.splice(+d.deldim,1); touch(); return render();
  }
  if(d.normalize!==undefined){
    const s = ins.dims.reduce((a,x)=>a+(+x.w||0),0);
    if(s>0) ins.dims.forEach(x=>x.w = +( (+x.w||0)/s ).toFixed(5));
    else ins.dims.forEach(x=>x.w = +(1/ins.dims.length).toFixed(5));
    touch(); return render();
  }

  /* --- requisitos / plan / consistencia --- */
  if(d.addreq!==undefined){ ins[d.addreq].push({n:'Nuevo criterio', min:60, src:{type:'dim', dim:ins.dims[0].id}}); touch(); return render(); }
  if(d.delreq!==undefined){ const [k,i]=d.delreq.split('.'); ins[k].splice(+i,1); touch(); return render(); }
  if(d.addplan!==undefined){ ins.plan[d.addplan].push({t:'Nueva actividad', dim:''}); touch(); return render(); }
  if(d.delplan!==undefined){ const [k,i]=d.delplan.split('.'); ins.plan[k].splice(+i,1); touch(); return render(); }
  if(d.addcons!==undefined){ (ins.consPairs=ins.consPairs||[]).push({n:'Nuevo par', self:'', beh:[]}); touch(); return render(); }
  if(d.delcons!==undefined){ ins.consPairs.splice(+d.delcons,1); touch(); return render(); }

  /* --- formulario de reactivo --- */
  const it = S.itemDraft;
  if(d.addopt!==undefined){
    const base = it.type==='multi' ? {t:'',p:1} : it.type==='ranking' ? {t:'',r:it.opts.length+1} : {t:'',s:50};
    it.opts.push(base); return render();
  }
  if(d.delopt!==undefined){ it.opts.splice(+d.delopt,1);
    if(it.type==='ranking') it.opts.forEach((o,i)=>{ if(o.r>it.opts.length) o.r=i+1; });
    return render(); }
  if(d.optflag!==undefined){ const o=it.opts[+d.optflag]; o.flag=!o.flag; return render(); }
  if(d.itcrit!==undefined){ it.crit=!it.crit; return render(); }
  if(d.itactive!==undefined){ it.active = it.active===false; return render(); }
  if(d.cancelitem!==undefined){ S.itemDraft=null; S.msg=''; return go('editor'); }
  if(d.saveitem!==undefined){
    const err = validateItem(it, ins, S.itemNew);
    if(err){ S.msg=err; return render(); }
    if(S.itemNew) ins.items.push(clone(it));
    else {
      const i = ins.items.findIndex(x=>x.id===S.itemOrigId);
      if(i>=0){
        const oldId = S.itemOrigId;
        ins.items[i] = clone(it);
        if(oldId !== it.id) renameRefs(ins, oldId, it.id);
      } else ins.items.push(clone(it));
    }
    S.itemDraft=null; S.itemOrigId=null; S.msg=''; touch(); return go('editor');
  }
});

/* Al renombrar un reactivo, arrastra sus referencias en requisitos y consistencia */
function renameRefs(ins, oldId, newId){
  [...(ins.basic||[]), ...(ins.ideal||[])].forEach(r=>{
    if(r.src.type==='items' && r.src.ids) r.src.ids = r.src.ids.map(i=>i===oldId?newId:i);
  });
  (ins.consPairs||[]).forEach(p=>{
    if(p.self===oldId) p.self=newId;
    if(p.beh) p.beh = p.beh.map(i=>i===oldId?newId:i);
  });
}

function nextItemId(ins, dimId){
  const dim = ins.dims.find(d=>d.id===dimId);
  const code = (dim && dim.code) || 'X';
  let n = 1, id;
  do { id = code + String(n++).padStart(2,'0'); } while(ins.items.some(i=>i.id===id));
  return id;
}
function validateItem(it, ins, isNew){
  if(!it.id.trim()) return 'El reactivo necesita un identificador.';
  const clash = ins.items.filter(x=>x.id===it.id && x.id!==S.itemOrigId).length;
  if(clash) return 'Ya existe un reactivo con el identificador '+it.id+'.';
  if(!it.q.trim()) return 'Falta el texto de la pregunta.';
  if(it.type==='likert'){ if(!it.labs || !it.labs[0] || !it.labs[1]) return 'La escala necesita etiquetas para el 1 y el 5.'; return null; }
  if(!it.opts || it.opts.length<2) return 'Se necesitan al menos dos opciones.';
  if(it.opts.some(o=>!o.t.trim())) return 'Hay opciones sin texto.';
  if(it.type==='ranking'){
    const rs = it.opts.map(o=>+o.r).sort((a,b)=>a-b);
    if(!rs.every((v,i)=>v===i+1)) return 'Las posiciones ideales deben ser 1 a '+it.opts.length+' sin repetir.';
  }
  if(it.type==='multi' && !it.opts.some(o=>+o.p>0)) return 'Se necesita al menos una opción con puntos positivos.';
  return null;
}

APP.addEventListener('change', async e=>{
  const t = e.target, d = t.dataset, ins = S.draft, it = S.itemDraft;
  if(d.f!==undefined){ S.profile[d.f]=t.value; return; }
  if(d.filter==='res'){ S.fRes=t.value; return render(); }
  if(d.filter==='date'){ S.fDate=t.value; return render(); }
  if(d.sel!==undefined){
    const id=d.sel;
    if(t.checked){ if(S.sel.length>=4){ t.checked=false; return; } S.sel=[...S.sel,id]; }
    else S.sel=S.sel.filter(x=>x!==id);
    return render();
  }
  if(d.fdim!==undefined){ S.fDim=t.value; return render(); }
  if(d.ittype!==undefined){
    it.type = t.value;
    if(it.type==='likert'){ it.labs = it.labs||['',' ']; it.w = it.w>0.6?0.5:it.w; }
    else if(it.type==='multi'){ it.opts=(it.opts||[]).map(o=>({t:o.t||'',p:1})); it.max = it.max||3; }
    else if(it.type==='ranking'){ it.opts=(it.opts||[]).map((o,i)=>({t:o.t||'',r:i+1})); }
    else it.opts=(it.opts||[]).map(o=>({t:o.t||'', s:o.s??50}));
    if(!it.opts || !it.opts.length) it.opts=[{t:'',s:100},{t:'',s:40}];
    return render();
  }
  /* dimensiones: los selects/checkbox re-renderizan; los textos se manejan en input */
  if(d.dim!==undefined && t.type==='checkbox'){ const [i,k]=d.dim.split('.'); ins.dims[+i][k]=t.checked; touch(); return render(); }
  if(d.req!==undefined){ applyReq(ins, d.req, t.value); touch(); return render(); }
  if(d.plan!==undefined){ const [k,i,f]=d.plan.split('.'); ins.plan[k][+i][f]=t.value; touch(); if(f==='dim') return render(); return; }
  if(d.it==='dim' || d.it==='level'){ it[d.it]=t.value; return render(); }
  if(d.inv!==undefined){ S.invForm[d.inv]=t.value; return; }
  if(d.cfg!==undefined){ CFG[d.cfg]=t.value.trim(); return; }
});

function applyReq(ins, path, val){
  const [key,i,f] = path.split('.');
  const row = ins[key][+i];
  if(f==='n') row.n=val;
  else if(f==='min') row.min=+val;
  else if(f==='type'){
    row.src = val==='dim' ? {type:'dim', dim:ins.dims[0].id}
            : val==='items' ? {type:'items', ids:[], fallback:ins.dims[0].id}
            : {type:'operativo'};
  }
  else if(f==='dim') row.src.dim=val;
  else if(f==='ids') row.src.ids = val.split(',').map(s=>s.trim()).filter(Boolean);
  else if(f==='fallback') row.src.fallback=val;
}

/* Entrada de texto: nunca re-renderiza, para no perder el cursor */
APP.addEventListener('input', e=>{
  const t = e.target, d = t.dataset, ins = S.draft, it = S.itemDraft;
  if(d.f!==undefined){ S.profile[d.f]=t.value; return; }
  if(d.fq!==undefined){ S.fQuery=t.value; clearTimeout(S._fq);
    S._fq=setTimeout(()=>{ S._focus='#fq'; render(); }, 320); return; }
  if(d.dim!==undefined && t.type!=='checkbox'){
    const [i,k]=d.dim.split('.');
    if(k==='wpct') ins.dims[+i].w = (+t.value||0)/100;
    else if(k==='min') ins.dims[+i].min = +t.value||0;
    else ins.dims[+i][k]=t.value;
    touch(); return;
  }
  if(d.req!==undefined && t.tagName!=='SELECT'){ applyReq(ins, d.req, t.value); touch(); return; }
  if(d.plan!==undefined && t.tagName!=='SELECT'){ const [k,i,f]=d.plan.split('.'); ins.plan[k][+i][f]=t.value; touch(); return; }
  if(d.meta!==undefined){ ins[d.meta]=t.value; touch(); return; }
  if(d.priv!==undefined){ ins.privacy = ins.privacy||{}; ins.privacy[d.priv]=t.value; touch(); return; }
  if(d.cons!==undefined){ const [i,f]=d.cons.split('.');
    if(f==='beh') ins.consPairs[+i].beh = t.value.split(',').map(s=>s.trim()).filter(Boolean);
    else ins.consPairs[+i][f]=t.value;
    touch(); return; }
  if(d.it!==undefined && d.it!=='dim' && d.it!=='level'){ it[d.it] = (d.it==='w') ? (+t.value||1) : t.value; return; }
  if(d.opt!==undefined){ const [i,f]=d.opt.split('.'); it.opts[+i][f] = f==='t' ? t.value : (+t.value||0); return; }
  if(d.lab!==undefined){ it.labs = it.labs||['','']; it.labs[+d.lab]=t.value; return; }
  if(d.max!==undefined){ it.max = +t.value||1; return; }
  if(d.cfg!==undefined){ CFG[d.cfg]=t.value.trim(); return; }
  if(d.login!==undefined){ S.login[d.login]=t.value; if(d.login==='email') S.loginEmail=t.value; return; }
  if(d.inv!==undefined){ S.invForm[d.inv]=t.value; return; }
});

function copyText(txt, btn){
  const done = ok => { if(!btn) return; const o=btn.textContent;
    btn.textContent = ok?'Copiado':'Selecciona y copia'; setTimeout(()=>{btn.textContent=o;}, 1600); };
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).then(()=>done(true), ()=>done(false));
  done(false);
}

window.addEventListener('beforeunload', e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

async function enterCandidateMode(token){
  S.candidateMode = true; S.inviteToken = token;
  S.invite = null; S.inviteReason = '';
  await DB.loadConfig();
  try{
    const inv = await DB.getInvite(token);
    if(inv){
      S.invite = inv;
      useInstrument(inv.instrument);
      if(DB.remote){ try{ await rpc('isel_start_invite', {p_token: token}); }catch(e){} }
    }
    /* En modo local la invitación solo existe en el navegador que la creó.
       Si no aparece y no hay conexión remota, lo más probable es que el sitio
       no publique config.json y este dispositivo no sepa a dónde conectarse. */
    else S.inviteReason = DB.remote ? 'usado' : 'sinconfig';
  }catch(e){ S.invite = null; S.inviteReason = 'error'; DB.lastError = e.message; }
  S.view = 'invite';
  render();
}

(async function init(){
  const m = (location.hash||'').match(/^#\/e\/([A-Za-z0-9_-]+)$/);
  if(m) return enterCandidateMode(m[1]);
  const b = await bootstrap();
  S.instruments = b.ins; S.list = b.cands;
  if(!DB.remote && CFG.gate) S.unlocked = false;
  render();
})();
</script>
